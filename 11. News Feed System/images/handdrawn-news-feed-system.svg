<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>新闻流：写时准备目录，读时合并结果</title><desc>普通作者发帖后把帖子ID写入好友feed缓存；大V不向所有粉丝扩散，读取时拉取其最近帖子，并与缓存合并。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">新闻流：写时准备目录，读时合并结果</text><path d="M45,115 Q33,116 35,127 L36,187 Q35,198 47,197 L231,196 Q242,197 240,184 L239,126 Q240,113 228,116 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,119 L225,117 M236,130 L238,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="149" text-anchor="middle"><tspan x="137.5" dy="0">普通作者发帖</tspan><tspan x="137.5" dy="23">正文只存一份</tspan></text><path d="M340,115 Q328,116 330,127 L331,187 Q330,198 342,197 L526,196 Q537,197 535,184 L534,126 Q535,113 523,116 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M343,119 L520,117 M531,130 L533,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="432.5" y="149" text-anchor="middle"><tspan x="432.5" dy="0">写扩散 Worker</tspan><tspan x="432.5" dy="23">推送 post ID</tspan></text><path d="M635,115 Q623,116 625,127 L626,187 Q625,198 637,197 L821,196 Q832,197 830,184 L829,126 Q830,113 818,116 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M638,119 L815,117 M826,130 L828,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="727.5" y="149" text-anchor="middle"><tspan x="727.5" dy="0">好友 Feed 缓存</tspan><tspan x="727.5" dy="23">有界 ID 列表</tspan></text><path d="M240,156 L330,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M535,156 L625,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M45,305 Q33,306 35,317 L36,377 Q35,388 47,387 L231,386 Q242,387 240,374 L239,316 Q240,303 228,306 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,309 L225,307 M236,320 L238,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="339" text-anchor="middle"><tspan x="137.5" dy="0">大 V 发帖</tspan><tspan x="137.5" dy="23">正文 / 作者时间线</tspan></text><path d="M340,305 Q328,306 330,317 L331,377 Q330,388 342,387 L526,386 Q537,387 535,374 L534,316 Q535,303 523,306 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M343,309 L520,307 M531,320 L533,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="432.5" y="339" text-anchor="middle"><tspan x="432.5" dy="0">读时拉取</tspan><tspan x="432.5" dy="23">只取最近帖子</tspan></text><path d="M635,305 Q623,306 625,317 L626,377 Q625,388 637,387 L821,386 Q832,387 830,374 L829,316 Q830,303 818,306 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M638,309 L815,307 M826,320 L828,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="727.5" y="339" text-anchor="middle"><tspan x="727.5" dy="0">合并 + 权限过滤</tspan><tspan x="727.5" dy="23">时间排序 / 取详情</tspan></text><path d="M240,346 L330,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M535,346 L625,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M728,197 L728,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="670.5" y="239" width="115" height="22" rx="5" fill="#fffdf7"/><text class="label" x="728" y="256" text-anchor="middle"><tspan x="728" dy="0">打开 Feed</tspan></text><path d="M905,305 Q893,306 895,317 L896,377 Q895,388 907,387 L1056,386 Q1067,387 1065,374 L1064,316 Q1065,303 1053,306 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M908,309 L1050,307 M1061,320 L1063,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="980.0" y="339" text-anchor="middle"><tspan x="980.0" dy="0">读者 Feed</tspan><tspan x="980.0" dy="23">最新在前</tspan></text><path d="M830,346 L895,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="436" text-anchor="start"><tspan x="35" dy="0">写扩散：读快、写放大。读扩散：写轻、读取要聚合。混合策略按关系规模和活跃度选择。</tspan></text><text class="note" x="35" y="468" text-anchor="start"><tspan x="35" dy="0">缓存放帖子 ID，正文单独缓存；删除、拉黑、隐私变化后，读取时仍需校验可见性。</tspan></text></svg>