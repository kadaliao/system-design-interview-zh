<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">广告点击：原始留底，窗口聚合，可重算</text><text x="45" y="83" font-size="19" fill="#536070">事件可能迟到、重复、乱序；准确计费依赖状态和输出的一致性</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="215,270 315,270"/><polyline points="525,247 585,247 585,165 650,165"/><polyline points="525,292 585,292 585,395 650,395"/><polyline points="880,395 1010,395"/><polyline points="1105,350 1105,210"/><polyline points="765,210 765,350"/></g><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="242.0" y="232" width="46" height="25" rx="5" fill="#fffdf6"/><text x="265" y="250" text-anchor="middle" font-size="17" fill="#435165">接收</text><rect x="542.0" y="127" width="80" height="25" rx="5" fill="#fffdf6"/><text x="582" y="145" text-anchor="middle" font-size="17" fill="#435165">原始留底</text><rect x="544.0" y="463" width="80" height="25" rx="5" fill="#fffdf6"/><text x="584" y="481" text-anchor="middle" font-size="17" fill="#435165">分区处理</text><rect x="905.0" y="358" width="80" height="25" rx="5" fill="#fffdf6"/><text x="945" y="376" text-anchor="middle" font-size="17" fill="#435165">提交结果</text><rect x="1127.0" y="265" width="46" height="25" rx="5" fill="#fffdf6"/><text x="1150" y="283" text-anchor="middle" font-size="17" fill="#435165">读取</text><rect x="762.5" y="266" width="131" height="25" rx="5" fill="#fffdf6"/><text x="828" y="284" text-anchor="middle" font-size="17" fill="#435165">重算 / 回填</text><path d="M43 227 Q125.0 223 207 226 Q217 227 214 237 L217 305 Q215 317 205 315 L44 317 Q33 315 36 305 L34 237 Q33 227 43 227Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="125.0" y="264.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">点击事件</text><text x="125.0" y="290.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">event_id / 事件时间</text><path d="M323 227 Q420.0 223 517 226 Q527 227 524 237 L527 305 Q525 317 515 315 L324 317 Q313 315 316 305 L314 237 Q313 227 323 227Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="420.0" y="264.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">输入日志 / Kafka</text><text x="420.0" y="290.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">可重放的事件</text><path d="M658 122 Q765.0 118 872 121 Q882 122 879 132 L882 200 Q880 212 870 210 L659 212 Q648 210 651 200 L649 132 Q648 122 658 122Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="765.0" y="159.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">原始事件存储</text><text x="765.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">审计 / 对账 / 重算</text><path d="M658 352 Q765.0 348 872 351 Q882 352 879 362 L882 430 Q880 442 870 440 L659 442 Q648 440 651 430 L649 362 Q648 352 658 352Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="765.0" y="389.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">窗口聚合</text><text x="765.0" y="415.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">状态 + 输入 offset</text><path d="M1018 352 Q1105.0 348 1192 351 Q1202 352 1199 362 L1202 430 Q1200 442 1190 440 L1019 442 Q1008 440 1011 430 L1009 362 Q1008 352 1018 352Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="1105.0" y="389.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">结果队列 / 库</text><text x="1105.0" y="415.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">幂等提交版本</text><path d="M1018 122 Q1105.0 118 1192 121 Q1202 122 1199 132 L1202 200 Q1200 212 1190 210 L1019 212 Q1008 210 1011 200 L1009 132 Q1008 122 1018 122Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="1105.0" y="159.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">报表 / 计费</text><text x="1105.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">按窗口查询</text></g><text x="45" y="582" font-size="18" fill="#344054">记忆：窗口决定事件归属，watermark 表示事件时间进展，不是窗口长度。</text><text x="45" y="609" font-size="18" fill="#344054">快照与 offset 必须对应；原始日志用于对账，重算结果用版本防止重复覆盖。</text></svg>