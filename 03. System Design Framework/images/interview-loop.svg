<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <rect width="980" height="500" fill="#fffdf7"/>
  <style>.b{fill:#fffaf0;stroke:#2e4057;stroke-width:4;stroke-linejoin:round}.t{font-family:"Comic Sans MS","KaiTi",cursive;fill:#1f2937}.h{font-size:25px;font-weight:bold}.p{font-size:19px}.a{fill:none;stroke:#e07a5f;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 8}</style>
  <text x="40" y="42" class="t h">45 分钟面试循环：先对齐，再展开，最后收口</text>
  <g transform="translate(70,110) rotate(-2)"><rect class="b" width="190" height="110" rx="20"/><text x="20" y="42" class="t h">1 需求</text><text x="20" y="75" class="t p">问清目标和规模</text></g>
  <g transform="translate(295,110) rotate(2)"><rect class="b" width="190" height="110" rx="20"/><text x="20" y="42" class="t h">2 蓝图</text><text x="20" y="75" class="t p">画高层组件</text></g>
  <g transform="translate(520,110) rotate(-1)"><rect class="b" width="190" height="110" rx="20"/><text x="20" y="42" class="t h">3 深挖</text><text x="20" y="75" class="t p">解释瓶颈取舍</text></g>
  <g transform="translate(745,110) rotate(2)"><rect class="b" width="170" height="110" rx="20"/><text x="20" y="42" class="t h">4 收口</text><text x="20" y="75" class="t p">总结和演进</text></g>
  <path d="M260 165 C275 140 280 140 295 165 M485 165 C500 140 505 140 520 165 M710 165 C725 140 730 140 745 165" class="a"/>
  <path d="M830 235 C850 315 700 390 490 390 C280 390 130 330 150 235" class="a"/>
  <text x="175" y="430" class="t p">每一步都向面试官确认：这个方向符合题目的优先级吗？</text>
