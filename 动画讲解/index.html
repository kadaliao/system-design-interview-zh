<script>
const R=[{"no":1,"title":"从零扩展到百万用户","en":"Scaling from Zero to Millions","dur":224.124,"mb":37.019484519958496,"scenes":12,"src":"ch01/out/ch01-%E4%BB%8E%E9%9B%B6%E6%89%A9%E5%B1%95%E5%88%B0%E7%99%BE%E4%B8%87%E7%94%A8%E6%88%B7.mp4","text":"第一章，从一台服务器，到百万用户。用几分钟，看懂它。 最开始，Web 应用、数据库和缓存，全挤在同一台服务器上。用户访问域名，DNS 解析出 IP，请求直奔这台机器。用户一多，它们互相争抢资源，于是第一步，先把数据库搬到专用服务器。 Web 层扛不住了，有两条路。纵向扩展，是给机器加 CPU 和内存，简单，但有硬件上限，还是单点。横向扩展，是增加服务器数量，组成服务器池。 服务器多了，要有人分发请求，这就是负载均衡器。一台下线，流量改送另一台；流量突增，就再加一台。但它只负责分发，如果所有请求都打到同一个数据库，Web 加再多也没有用。 还有个陷阱。登录会话如果存在某台 Web 服务器的内存里，下次请求被分到别的机器，用户就得重新登录。把 session 挪到共享存储，Web 层就成了无状态，可以随流量自动扩容和缩容。 接着解决数据库。主库负责写，从库负责读，多数应用读多写少，所以从库更多。主库宕机，就把一个从库提升为新主库。但复制有延迟，刚写完立刻读从库，可能还是旧数据。 读压力还能再降。先查缓存，命中就直接返回；没命中再查数据库，并把结果回填缓存。缓存适合读多写少的数据，要设过期时间，满了按最近最少使用淘汰，代价是可能和数据库不一致。 图片、样式、脚本这类静态内容，交给 CDN。用户向最近的节点要文件，没有就由节点回源站获取并缓存，后面的人直接命中。文件更新后，要让旧缓存失效。 发邮件、生成缩略图这类任务，可以稍后再做。生产者把消息放进队列，消费者按自己的速度处理，高峰时积压在队列里，而不是压垮服务。代价是消息可能重复，消费者要做到幂等。 用户遍布各地，就要多个数据中心。GeoDNS 把用户导向离他最近的一个，一个中心故障，流量切到另一个。代价是数据要在中心之间复制，各处的部署也要保持一致。 最后是数据层。单库纵向扩展有上限，于是按分片键，比如 user_id，把数据拆到多个分片。分片键要让数据均匀。麻烦也随之而来：重新分片、名人热点，还有跨分片的 JOIN。 记住三组词：无状态加冗余，缓存加 CDN，分片加解耦。每加一层之前，先问瓶颈在哪里，也想清楚它会带来什么新问题。"},{"no":2,"title":"数量级估算","en":"Back-of-the-Envelope Estimation","dur":188.6,"mb":29.04328441619873,"scenes":10,"src":"ch02/out/ch02-%E6%95%B0%E9%87%8F%E7%BA%A7%E4%BC%B0%E7%AE%97.mp4","text":"第二章，数量级估算。用三分钟，学会几分钟内估出系统有多大。 估算先从二的幂开始。二的十次方约一千，二十次方约一百万，三十次方约十亿，四十次方是万亿，五十次方是千万亿。每多十位，大约放大一千倍，对应 KB、MB、GB、TB、PB。 再记两个心算技巧。一天八万六千四百秒，直接当成十的五次方秒。算式也要四舍五入：九万九千九百八十七除以九点一，当成十万除以十，一万就够了。量级对了，比小数点重要。 再看延迟数字。L1 缓存零点五纳秒，主内存一百纳秒，SSD 随机读一百五十微秒，机械硬盘寻道十毫秒，跨地域往返一百五十毫秒。内存快，磁盘慢，尽量避免磁盘寻道。 可用性用几个九表示。两个九，一年约停三点六五天；三个九约八点八小时；四个九约五十二分钟；五个九约五点三分钟；六个九只有三十一点五六秒。每多一个九，停机预算缩小十倍。 但组件各自三个九，整条链路并不是三个九。一次请求要同时依赖 API、数据库和支付，三个都在线才算成功，概率相乘：零点九九九的三次方，约百分之九十九点七，一年约停二十六小时。 现在走一遍推特的例子。三亿月活，一半日活，一亿五千万。每人每天发两条，一天三亿条，除以八万六千四百秒，平均约三千五百条每秒。峰值按两倍，约七千条每秒。 再算存储。每十条推文有一条带媒体，大小一兆字节。每天一亿五千万乘二乘十分之一乘一兆，是三十 TB。保存五年，乘三百六十五再乘五，约五十五 PB。这只是裸数据，副本和索引还要再乘。 只看平均会不够用。单实例稳定承载三百五十 QPS，峰值七千，就要二十个实例，再留三成余量，约二十六个。若每人每天从两次变成十次，QPS 就是五倍，只需替换一个参数。 记住三个词：假设、单位、峰值。写下假设，标好单位，别忘了峰值，再回到设计。"},{"no":3,"title":"系统设计面试框架","en":"System Design Framework","dur":239.392,"mb":38.77409362792969,"scenes":11,"src":"ch03/out/ch03-%E7%B3%BB%E7%BB%9F%E8%AE%BE%E8%AE%A1%E9%9D%A2%E8%AF%95%E6%A1%86%E6%9E%B6.mp4","text":"第三章，系统设计面试框架。用四分钟，看懂它。 一场系统设计面试有四十五分钟，不能想到哪儿答到哪儿。书里给的是四步框架：理解问题，高层设计，深入设计，收尾。我们按一个典型分配来看：八分钟，十二分钟，二十分钟，再留五分钟。 第一步，先别画图，先提问。好问题要能改变设计。比如，只按时间倒序，就不需要推荐系统。好友数量有多大，决定发帖要扇出给多少人。有没有图片视频，决定要不要对象存储和 CDN。 问完之后，把假设写下来。没有数字，就主动提一个初始值，邀请面试官修正。比如：先按一千万用户、读远多于写、按时间排序来设计，这个范围可以吗？第十分钟之前，应该有需求和核心 API。 第二步，画高层蓝图，把面试官当队友，一边画一边确认。方框表示客户端、API、数据库、缓存。再用纸巾盒背面估算，看设计扛不扛得住。然后走两条流程：发布流程，把帖子写入数据库，并填充好友的 Feed；获取流程，聚合好友帖子，按倒序时间展示。 第三步，只深挖最关键的瓶颈。比如名人发帖，要扇出给大量粉丝。假设收件箱更新的处理能力是每秒两万次，而到达的是每秒三万次，一分钟就积压六十万条。这时只加无状态的 API 机器没有用，要提升处理能力，或者改变扇出策略。 深挖时，问自己四个问题：主键和访问模式是什么，容量上限和故障模式是什么，数据丢了、重复了或延迟了会怎样，何时升级。答案落在取舍上：普通用户写时推送，换来读取快；名人读时合并，接受额外的读计算。 第四步，收尾。最后五分钟，不再加新组件。第一分钟重述目标和假设，第二分钟沿图走一遍写路径和读路径，第三分钟讲取舍，第四分钟讲瓶颈和故障，最后一分钟给出升级条件。第四十分钟之后，就该停止新增组件。 再看这条时间线上最常见的坑。开头一上来就画满技术名词，范围没锁定。中间把时间花在表字段和类名上，没讲热点、超时和重试。最后还在加组件，没有收尾。解法是多提问、不沉默、聚焦关键、避免过度工程。 如果只有九十秒，也能把四步串起来。需求十五秒，路径二十五秒，瓶颈十五秒，取舍二十秒，演进十五秒。一句话就是：谁要什么，请求怎么走，哪里先卡，为何接受代价，什么证据触发升级。 总结一下。先问清范围，再取得共识，最后收口取舍。面试不是背一张万能架构图，而是在不完整信息下，让面试官看到你怎么做决定。"},{"no":4,"title":"限流器","en":"Rate Limiter","dur":239.266667,"mb":40.17040729522705,"scenes":12,"src":"ch04/out/ch04-%E9%99%90%E6%B5%81%E5%99%A8.mp4","text":"第四章，限流器。用四分钟，看懂各种限流算法，到底放行了谁，又拒绝了谁。 限流器就像系统的门卫。请求太多的时候，先把多余的挡在门外，防止被攻击打垮，少花冤枉钱，也不让服务器过载。被挡住的请求，通常会收到一个四二九错误。 限流器放在哪里？放在客户端不可靠，用户可以绕过页面，直接调用接口。放在服务端或者API网关，所有请求都必须经过，这才是真正的闸门。 先看令牌桶。桶里按固定速率补充令牌，满了就不再积攒。每个请求拿走一个令牌，拿不到就被拒绝。比如容量是五，空闲之后一次来七个请求，前五个通过，后两个被拒绝。容量决定能突发多少，补充速率决定长期能跑多快。 漏桶不一样。请求先进入一个先进先出的队列，再按固定速率一个一个流出。同样的突发，输出依然平稳。但队列满了，新请求就被丢弃，排在后面的请求，还要等很久。 固定窗口计数最简单。把时间切成一段一段，每段一个计数器。没到配额就放行，到了就拒绝，窗口一换，计数清零。简单高效，适合规则比较粗的场景。 但清零的那一刻有个漏洞。假设每个窗口最多放行五个，窗口一的最后一瞬间来了五个，窗口二的第一瞬间又来了五个。两个窗口各自合规，可是在大约一秒之内，放行了十个，超过配额一倍。它保证的是每个固定窗口，不是任意连续的一段时间。 滑动窗口日志可以解决这个问题。它记下每个请求的时间戳，每次先清掉窗口之外的旧记录，再数剩下几条，没超才放行。刚才那一波边界突发，在这里被拦住了。代价是要按请求数保存时间戳，内存开销比较高。 滑动窗口计数是一个折中。它只存当前窗口和上一窗口两个计数，把上一窗口仍然覆盖的那部分比例折算进来。当前计数，加上上一窗口计数乘以覆盖比例。省内存，边界也平滑，但它假设上一窗口流量均匀，所以只是近似值。 五种算法各有取舍。要允许短时突发，用令牌桶。要输出平稳，用漏桶。要简单便宜，用固定窗口。要精确的滚动限制，用滑动窗口日志。要平滑又省内存，用滑动窗口计数。 多台网关还有一个坑。两台网关同时读到只剩一个名额，各自放行，名额就被花了两次。办法是把读取、判断、扣减，放进 Redis 的 Lua 脚本，作为一个原子操作。同一个名额，只能由同一个裁判，一次判完。 记住三个词：桶、窗口、原子。桶管突发和速率，窗口管边界，原子操作保证多台机器不超发。"},{"no":5,"title":"一致性哈希","en":"Consistent Hashing","dur":133.133333,"mb":23.204293251037598,"scenes":11,"src":"ch05/out/ch05-%E4%B8%80%E8%87%B4%E6%80%A7%E5%93%88%E5%B8%8C.mp4","text":"第五章，一致性哈希。用两分钟，看懂它。 数据存到多台机器上，每个 key 都要决定去哪一台。最直接的办法：对 key 做哈希，再对机器数量 N 取余。 机器数量固定时，这样没问题。可一旦加一台，N 从四变成五，绝大多数 key 的去向都变了。缓存大面积失效，请求全部砸向数据库，扩容反而先制造了一次故障。 一致性哈希换了个思路：把哈希空间首尾相连，变成一个环。服务器按各自的哈希值，落在环上的某个位置。 key 也算出哈希值，落到环上，然后顺时针往前走。遇到的第一台服务器，就是它的负责人。 现在加入一台服务器 s4。只有它和前一台服务器之间的这一小段 key，会转交给它，其余的纹丝不动。 移除服务器也一样。它负责的 key，全部交给顺时针方向的下一台，其他 key 完全不受影响。 但服务器在环上的位置是随机的，间隔有大有小。有的机器分到大地盘，有的只分到一点点。 解决办法是虚拟节点：让一台物理机器在环上占据许多个位置。位置越多，各台机器的负担就越接近平均。 不过要记住，数据均匀，不等于访问均匀。一个热门 key，仍然只会压在一台机器上，这要靠缓存复制或者拆分来解决。 记住三个词：环、顺时针、虚拟节点。Dynamo、Cassandra、Discord，都用过这样的思路。"},{"no":6,"title":"键值存储","en":"Key-Value Store","dur":240.833333,"mb":37.32242202758789,"scenes":10,"src":"ch06/out/ch06-%E9%94%AE%E5%80%BC%E5%AD%98%E5%82%A8.mp4","text":"第六章，键值存储。用四分钟，看懂它。 键值存储先要回答：数据放哪台，坏了怎么办。分区用一致性哈希，把不同的 key 分到不同机器，管容量。复制则把同一个 key，顺时针存到后面的 N 台，这里 N 等于三，管故障。有虚拟节点时，副本要落在不同的物理机上。 三份副本，怎样才算写成功、读成功？看三个数。N 是副本数，W 是写入要等的确认数，R 是读取要等的回复数。N 等于三，W 和 R 都取二：写拿到两个确认，读问两个副本，两组里至少有一台重合，读者就能碰到最新的写入。这就是 W 加 R 大于 N。 但相交，不等于万事大吉。假设写 x 等于一，只到了副本 A，还没凑够两个确认。读一问了 A 和 B，返回一。紧接着读二问了 B 和 C，却只看到零。两次读都满足 R 等于二，用户却看到一之后又变回零。所以这条不等式只是协议的一部分，还要有版本比较和读修复。 副本之间还会各自修改。原来姓名是张敏，向量时钟是 A 一、B 一。网络断开后，A 把它改成张明，向量变成 A 二、B 一。同时 B 改成李敏，向量变成 A 一、B 二。哪台服务器改数据，就给自己那一项加一。 怎么比较？每一项都不大于对方，说明是祖先，被直接覆盖。一边这项大、另一边那项大，就是并发冲突，称为兄弟版本。向量时钟只告诉你有冲突，不会替你决定姓名选谁。用户选定张明后，先取每项最大值，再由执行的 A 加一，得到 A 三、B 二。 再看单个存储节点怎么写。第一步，把写入追加到提交日志，用来崩溃恢复。第二步，写进内存里的表，也就是 memtable。第三步，内存达到阈值，整体刷成磁盘上有序的 SSTable，写出后不再修改。 读取反过来。先查内存，命中就返回。没命中，就得去磁盘找 SSTable，可一个 key 可能散在好几个文件里，逐个去读太慢。于是每个 SSTable 前面放一个布隆过滤器，先问一句：这个 key 可能在你这儿吗？回答不可能的文件，直接跳过。 布隆过滤器就是一排位，这里示意八位、两个哈希。插入 alpha，把位一和位四置一；插入 beta，把位四和位六置一。查一个没插入过的 gamma，它恰好映射到位一和位六，全是一，过滤器只能说，可能存在。另一个 key 落在位二和位七，看到零，就一定不存在。 记住三件事：N、W、R 在一致性与延迟之间取舍；向量时钟识别冲突，却不裁决对错；日志、内存表、SSTable 加布隆过滤器，撑起单机读写。故障检测、提示移交和默克尔树，书里还有，这里一笔带过。"},{"no":7,"title":"唯一 ID 生成器","en":"Unique ID Generator","dur":239.833333,"mb":38.183502197265625,"scenes":12,"src":"ch07/out/ch07-%E5%94%AF%E4%B8%80%20ID%20%E7%94%9F%E6%88%90%E5%99%A8.mp4","text":"第七章，唯一 ID 生成器。用三分钟，看懂它。 多台机器同时发号，就得保证不发出同一个号。本章要求：ID 唯一，能按时间大致排序，放得进六十四位，每秒生成一万个以上。注意，唯一、连续、有序是三件事，本题不要求连续。 第一种，多主自增。两台数据库，一台发一、三、五，另一台发二、四、六，步长都是二。不会撞号，但 A 已经发到一百零一，B 还在发二十，数字大小对不上先后。想扩成三台，也不能直接改步长。 第二种，UUID。每台服务器自己生成，不用协调，扩展方便。可它有一百二十八位，装不进六十四位，随机的 UUID 也不按时间排序。就算是按时间排序的 UUIDv7，仍然是一百二十八位。 第三种，票据服务器，像一台统一的排号机。所有人来这里取号，实现简单，也是数字 ID。但它是单点：排号机一坏，所有人都拿不到号。改成多台，又要解决同步和冲突。 第四种，Twitter 的雪花算法，把六十四位拆开来用。一位符号位，固定为零；四十一位毫秒时间戳；五位数据中心；五位机器；十二位序列号。时间放在高位，数字越大，时间越晚，天然可以排序。 看一个 ID 怎么拼出来：时间、机房、机器、序列，各自移到自己的位置再合并。机房、机器、毫秒、序列，只要有一项不同，ID 就不同。但两台机器若共用同一个机房号和机器号，就会发出一模一样的 ID。 再看同一毫秒里。时间停在某一毫秒，连续来了三个请求，序列号依次是零、一、二。进入下一毫秒，序列归零。十二位最多到四千零九十五，用完了不能绕回零，只能等下一毫秒。 还有一个风险，时钟回拨。时钟被校准，往回退了几毫秒，照常发号就会重复。正确做法是每次和上次发号时间比较：回拨很小就等待追平，太大就拒绝并报警，绝不能悄悄把序列清零继续发。 算一下容量。单机一毫秒最多四千零九十六个，一秒理论上约四百一十万个，远超一万的要求。四十一位毫秒大约能用六十九点七年。六十四位是一份固定预算，机器、寿命、吞吐，要此消彼长。 四种方案放在一起比。多主自增简单，但难扩展，也不按时间。UUID 不用协调，但太长。票据服务器容易理解，但有单点。雪花算法满足六十四位、大致有序、可扩展，代价是要管好机器号和时钟。 记住三个词：时间、机器、序列。时间负责排序，机器负责区分，序列负责同一毫秒内不重复。"},{"no":8,"title":"短网址服务","en":"URL Shortener","dur":190.556,"mb":30.104490280151367,"scenes":10,"src":"ch08/out/ch08-%E7%9F%AD%E7%BD%91%E5%9D%80%E6%9C%8D%E5%8A%A1.mp4","text":"第八章，短网址服务。用三分钟，看懂它。 每天生成一亿个短网址，要撑十年，一共三千六百五十亿条。短码用零到九、小写字母和大写字母，共六十二个字符。六位只有五百多亿种，不够；七位有三点五万亿种，刚好够用。 第一种做法：对长网址做哈希。书里用 MD5 算出一串十六进制，截取前七位当短码。不过十六进制每位只有十六种取值，七位才两亿多种，远不够三千六百五十亿，实际要多取几位再换算才行。 麻烦在于，不同的长网址可能截出同一个短码，这就是碰撞。办法是在长网址后追加一段预设字符串，重新哈希，再查数据库，直到找到空位。书里还用布隆过滤器加速：它说一定不存在，就直接用；说可能存在，仍要查库确认。 第二种做法：先拿到全局唯一的 ID，再转成六十二进制。书里的例子，一个十三位的 ID，反复除以六十二，每一步的余数对应一个字符，倒着读出来，就是短码。 两种方案怎么选？哈希不需要 ID 生成器，但会碰撞，必须处理。Base62 只要 ID 唯一就不会碰撞，但需要 ID 生成器，而且连续的 ID 会让相邻短码容易被猜到。 创建短链的流程是这样：先查数据库，这个长网址已经有短码，就直接返回。没有，就向 ID 生成器要一个唯一 ID，转成 Base62，再把 ID、短码和长网址一起存进数据库。 跳转是另一条路径。用户点击短链，先查缓存。没命中，再查数据库，并把结果放回缓存。最后返回重定向响应，浏览器再去访问长网址。读写比大约十比一，所以重点优化这里。 重定向有两种。三零一是永久重定向，浏览器可能缓存，下次直接去长网址，不再经过短链服务，省流量，但统计不到点击。三零二是临时重定向，每次都经过服务，适合统计。实际还取决于缓存头。 记住三件事：创建时保证唯一，Base62 是编码，哈希可能碰撞；跳转时优先查缓存；三零一和三零二，取决于要不要统计。"},{"no":9,"title":"网络爬虫","en":"Web Crawler","dur":179.6,"mb":29.466304779052734,"scenes":9,"src":"ch09/out/ch09-%E7%BD%91%E7%BB%9C%E7%88%AC%E8%99%AB.mp4","text":"第九章，网络爬虫。用三分钟，看懂它。 爬虫的本质，是一条循环流水线。先把种子 URL 放进待抓队列，下载器取出一个网址，经过 DNS 解析找到服务器，把网页下载下来，交给解析器检查格式，合格的就存进内容存储。 网页里还藏着新的链接。链接提取器把它们挑出来，过滤器丢掉黑名单和错误地址，再查一遍是不是见过。没见过的，才回到待抓队列，下一轮继续。就这样，几个种子，滚出了一整张网。 为什么要查两道？因为网址不同，内容可能完全一样，比如带了跟踪参数，或者是镜像站。所以下载之后，还要比对页面哈希。反过来，同一个网址明天可能更新，所以已见记录要带上抓取时间，不能把网址永远封死。 整套系统最核心的部件，是待抓队列，也叫 URL Frontier。它其实有两层。前面一层按优先级分队列，决定先抓谁。后面一层按主机分队列，决定什么时候能抓。每个网址，都要先后穿过这两层。 先看礼貌。如果只是一个先进先出队列，同一个网站的网址排在一起，所有下载线程会同时冲向它，直接把对方压垮。解决办法是按主机分队列，一条队列只配一个 worker，同一主机同一时刻只发一个请求，两次下载之间还要留出间隔。 再看优先级。前置队列用 PageRank、更新频率这类信号打分，高优先级的队列，被选中的概率更大。注意，是概率更大，而不是永远优先。选中的网址进入后置队列，仍然要等主机的间隔。高优先级，也不能插队越过限速。 最后是蜘蛛陷阱。比如一个无限日历，每页都有下一个月的链接，网址每次都不一样，网址去重根本拦不住，队列越滚越长。光限制网址长度不够，短网址也能无限延伸，还要配合深度限制和站点抓取预算。 记住三个词：循环、礼貌、去重。判断一只爬虫好不好，看的是有效新内容的吞吐，而不是线程数。"},{"no":10,"title":"通知系统","en":"Notification System","dur":173.228,"mb":29.473621368408203,"scenes":10,"src":"ch10/out/ch10-%E9%80%9A%E7%9F%A5%E7%B3%BB%E7%BB%9F.mp4","text":"第十章，通知系统。用三分钟，看懂它。 最直觉的做法：触发服务调用一台通知服务器，它查库、渲染，再直接调用苹果推送、谷歌推送、短信和邮件服务商。每天要发推送一千万条、邮件五百万条、短信一百万条。 这个设计有三个毛病。唯一的服务器一挂，全部通知停摆，这是单点故障。数据库、缓存和发送逻辑绑在一起，没法单独扩容。发送又占大量资源，成了性能瓶颈。 改进有四步。数据库和缓存搬出服务器。通知服务器水平扩展成多台。中间插入消息队列，每个渠道一条。最后由各渠道的 worker 从队列取消息，去调用第三方。 整条流水线是这样的：触发服务调用接口，通知服务器校验并取元数据，把事件放进队列，worker 取走处理，调用第三方，最后送到用户手里。业务方交给队列就可以走了。 队列还能削平高峰。更重要的是隔离：如果短信服务商故障，只有短信队列积压，推送和邮件照常投递。但队列不会增加第三方的处理能力，积压不降，就要看渠道限额和 worker 吞吐。 可靠性靠两件事。第一，通知先写进日志库，记录状态，崩溃后能恢复。第二，第三方失败就重试，间隔逐步拉长。过期的验证码，则不必再发。 重试会带来重复。书里的办法是按事件 ID 去重。但先查后发并不够：两个 worker 可能同时查到没见过。需要原子占用，加上稳定的幂等键，目标是至少一次加去重，而不是轻率承诺恰好一次。 发送之前还有几道关。先查用户设置，退订了这类通知就不发。再看限流，限制对同一用户的发送频率。最后套用模板，保持格式统一。 记住三个词：队列、重试加去重、设置与限流。还有一点，第三方接受了，不等于用户已经看到。"},{"no":11,"title":"新闻流系统","en":"News Feed System","dur":204.733333,"mb":33.19189643859863,"scenes":10,"src":"ch11/out/ch11-%E6%96%B0%E9%97%BB%E6%B5%81%E7%B3%BB%E7%BB%9F.mp4","text":"第十一章，新闻流系统。用三分钟，看懂推与拉。 新闻流要做两件事。一是发布：帖子写进数据库，再传播到好友的新闻流。二是构建：用户打开应用，把好友的帖子聚合起来，按时间倒序返回。规模是每人最多五千个好友，一千万日活。 先看发布。请求经过负载均衡到达 Web 服务器，这里验证身份并限流。然后交给帖子服务，存进数据库和缓存。接着扩散服务把帖子传给好友的新闻流缓存，通知服务给好友发提醒。 扩散服务怎么干活？先从图数据库取好友列表，按用户设置过滤掉静音和屏蔽的人，再连同帖子 ID 丢进消息队列。工作进程消费队列，往每个好友的新闻流缓存里写一条，只存帖子 ID，不复制整篇帖子。这就是写扩散：发帖时，就推给读者。 写扩散读得快，更新也及时。代价在好友多的时候。普通用户几百个好友，写几百份目录不算什么。可如果一个名人有一百万读者，发一条帖子，就要更新一百万份目录。这就是写放大。 再看读扩散。发帖时只存帖子本身，什么都不推。等读者打开新闻流，系统才去取他每个好友的最新帖子，再合并排序。不活跃的用户不用提前计算，写入很省。代价是每次打开都要多次读取，读得更慢。 把两种方式放在一起比。名人发一条帖，写扩散要写一百万次，读扩散只写一次。反过来，读者打开一次，写扩散只读自己的缓存，读扩散要去读他关注的每一个人。成本要么放在写，要么放在读。 混合方案取两者之长。普通用户发帖，照常推给粉丝。粉丝特别多的用户，发帖不扩散，只存一份。读者打开时，先取自己的缓存，再把关注的名人的最新帖子拉过来合并。写放大和读延迟，就都能控制住。 最后是读取流程。请求经过负载均衡和 Web 服务器，到达新闻流服务。它从新闻流缓存取出帖子 ID，再到内容缓存或数据库取完整帖子。缓存里只有 ID，所以读取时要按当前权限过滤，删掉的帖子、拉黑的人，不能再出现。 记住三个词：写扩散、读扩散、混合。普通用户推，大 V 拉，缓存里只存帖子 ID。"},{"no":12,"title":"聊天系统","en":"Chat System","dur":223.528,"mb":35.514771461486816,"scenes":11,"src":"ch12/out/ch12-%E8%81%8A%E5%A4%A9%E7%B3%BB%E7%BB%9F.mp4","text":"第十二章，聊天系统。用几分钟，看懂一条消息怎么送到对方手里。 服务器要把新消息交给对方，最朴素的办法是轮询：客户端隔一会儿问一次，大多数时候得到的是空响应。长轮询好一些：请求一直挂着，直到有新消息或超时再返回。可是挂起的请求要占资源，返回之后还得重新发起。 WebSocket 换了思路：客户端和服务器建立一条双向的持久连接，之后任何一方都能随时发数据。有新消息，服务器直接推过去，不用再问。所以这个设计，收和发都用 WebSocket。 整体上分两类服务。登录、注册、资料这些无状态服务，还会通过服务发现，给客户端推荐一台聊天服务器。聊天服务器是有状态的，它握着用户的 WebSocket 连接。另外还有在线状态服务、通知服务，以及保存聊天历史的键值存储。 看一条一对一消息。用户 A 把消息发给聊天服务器一，它先分配一个唯一的消息 ID，写进键值存储。如果 B 在线，就转给持有 B 连接的聊天服务器二，再推给 B。如果 B 离线，改走推送通知。 消息 ID 不只要唯一，还要能排序。可以用雪花算法这样的全局 64 位序号，但时钟漂移会让它只是近似有序。更实用的是会话内序号：只要在同一个会话里递增就行，不必为所有会话排一个全局顺序。 用户可能有好几台设备。每台设备记着自己的 cur max message id，也就是本地已有的最新消息。上线之后，向存储拉取 ID 比它大的新消息，补齐离线期间错过的部分。连接断了，消息并没有丢。 群聊最多一百人。发送者把消息发出后，系统给群里每个成员的收件箱各复制一份消息，或者一条索引。这样每个人同步起来很简单，代价是写放大：群越大，一条消息要写的份数就越多。 在线状态靠心跳。客户端每五秒向在线状态服务发一次心跳。如果连续三十秒都没收到，就把它标记为离线。网络抖一下，心跳不会立刻判下线。注意，这只是近似的在线，弱网或休眠也会触发超时。 状态变化要通知好友。做法是发布订阅：A 与每位好友各有一个频道。A 上线或下线，就往 A 和 B、A 和 C、A 和 D 三个频道发布，好友订阅各自的频道，就能收到更新。这适合好友数较少的场景。 记住三件事：WebSocket 是实时通道，消息库是历史，游标负责断线后补拉。顺序只要在会话内保证，在线状态是近似判断。"},{"no":13,"title":"搜索自动补全","en":"Search Autocomplete","dur":203.224,"mb":32.92362976074219,"scenes":11,"src":"ch13/out/ch13-%E6%90%9C%E7%B4%A2%E8%87%AA%E5%8A%A8%E8%A1%A5%E5%85%A8.mp4","text":"第十三章，搜索自动补全。用三分钟，看懂它。 敲下一个字母，就要立刻给出热门建议，还得在一百毫秒内返回。最朴素的做法是查频率表：找出所有以这个前缀开头的查询，排序，取前几条。可峰值每秒四万八千次，每次都这样扫，扛不住。 换一种结构：Trie，也叫前缀树。每个字符占一层，共同的前缀只存一份。true、try、tree 共用 t 和 r 两个节点。单词结束的节点上，记着这个词的搜索次数。 可是光有树，top-k 还是要现算。输入 t，先走到 t 节点，再把它下面整棵子树遍历一遍，收集所有完整的词，排序，取前三。前缀越短，子树越大，越慢。 优化的关键，是先做工作，再把答案贴在节点上。后台提前算好每个节点下面最热的几条，直接存进节点。t 节点上，就存着 true、try、toy。代价是多占一些存储，换来的是查询速度。 现在再看用户输入。敲 t，沿树走一步，直接取出 t 节点的缓存。再敲 r，再走一步，换成 tr 的缓存。接着是 u，最后是 e。每一步只走一层，不遍历子树，也不用排序。 这些缓存从哪来？靠一条离线流水线。查询原样追加进分析日志，聚合器把日志汇总成频率表，工作进程据此重建 Trie，写进缓存和数据库。原书按周构建，因为热门建议不会每秒都大变。 新版本不能直接覆盖旧版本。先在旁边构建，校验、预热，再把查询服务整体切过去，旧版本留着方便回滚。删除也一样：查询链路上加一层过滤，先滤掉有害的建议，后台再慢慢物理删除。 前端也能优化。浏览器缓存常见前缀的结果，用轻量的异步请求取建议。但输入太快时，旧请求可能比新请求更晚返回，客户端要按前缀丢弃过时的结果，缓存也要设置合理的过期时间。 数据再大，就要分片。按前缀范围拆到不同服务器，由分片映射管理器负责路由。但按字母平均分，不等于流量平均，短前缀是热点，要预先缓存它的 top-k，或者并发查询各分片再合并。 记住三个词：前缀树、节点缓存、离线构建。线上只查表，重活留给后台。"},{"no":14,"title":"设计 YouTube","en":"Design YouTube","dur":225.496,"mb":35.85102367401123,"scenes":11,"src":"ch14/out/ch14-%E8%AE%BE%E8%AE%A1%20YouTube.mp4","text":"第十四章，设计 YouTube。用三分钟，看懂视频是怎样被切块、并行处理、再拼起来的。 先看全局。客户端上传视频时，业务 API 只负责鉴权和元数据，不碰视频字节。视频本身直接进对象存储，再由转码服务器转成多个版本，最后通过 CDN 分发给观众。上传一次，转成多份，从边缘播放。 原片可能有几百兆，一口气传很容易失败。办法是切成小块并行上传：API 先鉴权，发出限时的预签名地址，客户端凭它把每一块直接传给对象存储。某一块失败，只重传这一块，这就是断点续传。 转码阶段也要切块，但不能随便按字节切。视频帧之间有解码依赖，后面的帧要参考前面的关键帧。所以预处理器按 GOP，也就是图像组的边界来切，每一块从关键帧开始，才能独立解码、独立处理。 切完之后，预处理器根据配置生成一张有向无环图。原片先拆成视频、音频和元数据，视频再分出多种分辨率和码率的编码、缩略图和水印。没有依赖关系的任务，可以同时执行。 调度器把任务放进资源管理器的队列，再挑选空闲的 worker 去执行。这里八个切片分给三个 worker 并行处理。某个任务失败，只重试这一块，中间结果存在临时存储里。全部完成后，再拼成完整的输出。 还有一个坑：什么时候才算转码完成。如果完成事件先到，视频文件却还没落盘，用户就会看到可播放，点开却是四零四。所以要等输出和清单都持久化、校验通过，才发布 ready 状态。更高清晰度可以稍后逐步可用。 播放时，客户端先拿播放清单，再一段一段下载，协议有 MPEG-DASH、Apple HLS 等。自适应码率会根据网络吞吐和缓冲情况，在清晰度之间切换。网速变差就降一档，目标是不卡顿。 这些片段直接从离用户最近的 CDN 边缘节点获取。命中就立刻返回；没命中，才向后回源，取回之后缓存下来，下一位观众就命中了。热门视频，几乎都在边缘完成。 最关键的取舍在成本。按书里的假设，五百万日活，每人看五个三百兆的视频，CDN 一天就是十五万美元。观看有长尾：热门视频走 CDN，冷门视频由高容量服务器提供，甚至按需转码。代价是首次播放变慢，源站压力变大。 记住三个词：分块上传、DAG 并行转码、CDN 播放。成本取决于观看流量和缓存命中，而不只是单价。"},{"no":15,"title":"设计 Google Drive","en":"Design Google Drive","dur":191.256,"mb":30.302666664123535,"scenes":9,"src":"ch15/out/ch15-%E8%AE%BE%E8%AE%A1%20Google%20Drive.mp4","text":"第十五章，设计 Google Drive。用三分钟，看懂它。 网盘其实是两样东西。文件内容被切成块，放进云端的块存储；文件叫什么、有哪些块、第几个版本，这些又小又常变的信息，放在元数据数据库。内容大、目录小，分开存放，才能各自扩容。 先看文件怎么存。一个文件会被切成最大四兆字节的块，每个块算出一个哈希值，当作它的唯一标识。把哈希按顺序排好，就是这个文件的块清单。要还原文件，按清单把块拼起来就行。 文件只改了一小部分，没必要整份重传。客户端在本地切块、算哈希，把新的块清单交给服务器。服务器对照一下，回答：只缺第三块。于是只上传这一块，其余的沿用旧块。这就是增量同步，省下的是客户端的上行带宽。 块是按哈希命名的，所以内容相同的块只存一份，不同文件、不同版本都可以指向它，这就是去重。上传前还会按文件类型压缩，不过图片和视频本来就压缩过，收益很小。删除旧版本时，要看这个块还有没有人引用，没人引用、又过了保留期，才能回收。 上传不是一步完成的。元数据先记下这个版本，状态是 pending，别的设备看不到它。块陆续到齐，核对清单和校验值之后，状态才改成 uploaded，再发通知。中途断线，版本就停在 pending，已经传好的块不用重传。 设备 A 上传完了，设备 B 怎么知道？通知服务用长轮询：B 先挂着一个请求，一有变化，服务器立刻答复。B 收到通知，先向 API 服务器取最新元数据，再只下载自己缺的块，按顺序拼好。如果 B 当时离线，变更先存进离线备份队列，上线后补拉。 两台设备同时改同一个文件怎么办？每次提交都带着自己基于的版本号。服务器先处理的那一个成功，版本升到二；后到的那个基于旧版本一，被判定冲突。系统不会悄悄覆盖，而是把两份都留下，让用户选择合并，或者用一份覆盖另一份。 记住三个词：分块、增量、冲突副本。内容拆块存，目录单独管；只传变化块，冲突留副本。"},{"no":16,"title":"附近地点服务","en":"Proximity Service","dur":273.664,"mb":43.77259826660156,"scenes":11,"src":"ch16/out/ch16-%E9%99%84%E8%BF%91%E5%9C%B0%E7%82%B9%E6%9C%8D%E5%8A%A1.mp4","text":"第十六章，附近地点服务。用四分钟，看懂地图怎么被切开，又怎么快速找到附近商家。 要找五百米内的餐馆，最直观的写法，是按纬度和经度各限定一个范围。可普通索引一次只能顺着一个维度走：先按纬度，就扫出整整一条横带，再逐行检查经度。两亿商家，这样太慢了。 Geohash 的办法是逐位二分。先把经度切成左右两半，落在右边记一，落在左边记零；再把纬度切成上下两半，再记一位。经度和纬度交替切下去，一个点就变成一串零一。每五位合成一个字符，用 base32 编码，这家店就是，九 Q 八 Y Y M。 每多一个字符，格子就再切小一轮。前缀相同，说明落在同一个更大的格子里，所以共享的前缀越长，范围越小。查询时按半径挑长度：五百米用长度六，一公里和两公里用长度五，五公里和二十公里用长度四。 来看书里的例子。用户在纬度三十七点七七六七二，经度负一百二十二点四一六七三，搜五百米内的餐馆。位置服务按半径选长度六，算出自己的格子，再算出八个邻格，一共九个。并行取回这九格里的商家，最后用真实距离，过滤掉圆外的。 但边界是个坑。两家店隔着一条格线，相距只有几十米，编码的最后一位却不一样；隔着赤道更极端，一个以 s 开头，一个以 k 开头。所以不能只查自己的格子，必须连邻格一起查。精度也不能太细：长度七的格子只有一百多米，九格盖不住五百米的圆。 整条链路是这样的：客户端把经纬度和半径交给负载均衡器，转到位置服务。它只读、无状态，可以多开几台。位置服务并行查 Geohash 的 Redis 拿到商家 ID，再从详情 Redis 取完整信息，按距离排序返回。缓存的键用 Geohash，而不是 GPS 坐标，因为用户一动坐标就变，缓存就命不中。 Geohash 的格子大小固定，可城市里商家密，乡下稀。四叉树按密度来：整张地图是根节点，商家数超过阈值，就切成四个象限，一层层递归，直到每个叶子都不超过阈值。书里阈值取一百，画面用小数字示意。密的地方切得细，稀的地方一块就够。 四叉树特别适合找最近的 k 家，比如最近的加油站。先从根往下找到用户所在的叶子；不够 k 家，就把搜索范围放大，访问相交的叶子，直到凑够 k 个。代价是它要在每台服务器启动时于内存里建好，两亿商家要几分钟，建好前不能接流量，更新也往往要重建。 第三种是 Google S2。它把球面切成单元，用 Hilbert 曲线编号，把二维位置排成一条一维的线。相邻的编号通常空间上也相近，但反过来，挨着的两格，编号可能差得很远。S2 还能用不同层级的单元，拼出任意形状的区域，适合地理围栏，只是门槛更高。 总结一下。Geohash 简单，适合固定半径的附近搜索，要查邻格并精确过滤；四叉树随密度调整，适合找最近的 k 家，但要重建；S2 擅长区域覆盖和地理围栏。面试时记住：先找格子，再取商家，最后按距离筛选。"},{"no":17,"title":"附近好友","en":"Nearby Friends","dur":223.366667,"mb":39.67295742034912,"scenes":12,"src":"ch17/out/ch17-%E9%99%84%E8%BF%91%E5%A5%BD%E5%8F%8B.mp4","text":"第十七章，附近好友。用三分钟，看懂位置是怎么实时推送的。 附近商家的地址基本不动，可好友是一直在走的。所以不能每次刷新都去扫描全库，而是让在线的设备，每隔三十秒主动上报一次位置。按一千万人同时在线算，每秒大约三十三万四千次更新。 手机和服务器之间，用的是 WebSocket 长连接。连接建立后一直保持，设备能上报，服务器也能随时主动推送。让设备点对点互发并不实用，移动网络不稳定，还费电，所以由后端统一转发。 转发的关键，是 Redis 的发布订阅。每个用户有一个自己的频道。好友所在的服务器，订阅 A 的频道。A 一上报，位置就发布到 A 的频道，所有订阅者同时收到。 一次上报的完整路径是这样：位置先到 WebSocket 服务器，写进历史库，更新位置缓存，再发布到用户自己的频道。Redis 把消息广播给订阅者，也就是好友所在的那些服务器。 收到消息的服务器还有最后一步：算距离。好友在五英里之内，就推给客户端；超出半径的，直接丢掉。平均每人四百个好友，一成在线，所以一次上报，大约扇出四十份更新。 位置缓存里存的是最新位置：用户 ID，对应纬度、经度和时间戳，并且设了过期时间。用户不再上报，条目自己过期，就等于离线。历史轨迹单独写进 Cassandra，不参与附近列表的读取。 为什么选发布订阅？因为它轻。没有订阅者的频道，不用像消息队列那样保留消息；频道名可以提前约定，用户上线时不必协调创建。偶尔丢一个位置点，三十秒后新的就来了，这里完全能接受。 真正的瓶颈在吞吐。三十三万多次上报，各扇出四十份，约每秒一千四百万次推送。频道所需内存大约两百 GB，两台一百 GB 的 Redis 就够。但按单机每秒十万次算，至少要一百四十台。 所以要把频道分片到一个 Redis 集群。用 ZooKeeper 或 etcd 记录存活节点和频道分布，WebSocket 服务器据此算出，某个频道在哪台机器上，订阅和发布都去找它。分片用一致性哈希。 频道带着订阅状态，所以节点不能像无状态服务那样随便增减。频道一搬家，订阅者要重新订阅，期间可能漏几个位置点，本题允许，但尽量放在低峰。一致性哈希能让搬家的频道最少。 记住三个词：长连接、每人一频道、距离过滤。规模上来，就把频道分片。"},{"no":18,"title":"Google Maps","en":"Designing Google Maps","dur":197.996,"mb":33.741684913635254,"scenes":10,"src":"ch18/out/ch18-Google%20Maps.mp4","text":"第十八章，设计 Google Maps。用三分钟，看懂地图是怎么切的。 地图产品可以拆成三条链路。位置上报，由客户端批量上传，写进 Cassandra，再用 Kafka 分发，书里估算约二十万 QPS，峰值一百万。真正难懂的是另外两条：看地图，靠图像瓦片；算路线，靠路由瓦片。 先看地图瓦片。PB 级的地图不可能整张下载，所以把世界切成小块。最小缩放级别，一张二百五十六乘二百五十六的瓦片就是整个世界；每放大一级，每张瓦片再切成四张，总数变成原来的四倍。 屏幕上只需要少数几张。客户端按位置和缩放级别算出瓦片编号，直接去 CDN 取预先生成的静态图。平移地图时，只补新进入屏幕的那一排，其余用本地缓存。编号规则要和服务端保持兼容。 再看导航。路口是节点，道路是边，路线用改进的 Dijkstra 或 A* 搜索。可搜索对图的大小很敏感：从起点一圈圈向外扩散，图越大，要展开的路口越多，所以不能每次都扫描全球路网。 办法是把路网切成路由瓦片，每块保存相邻瓦片的引用。搜索时按需拼接，只加载起点到终点沿途用得到的几块，其余完全不碰，内存和带宽都省下来。 但长途路线要拼的小瓦片太多，代价很高。于是再分层：同一片路网保存不同细节的瓦片，按距离选层级。远处先在高层走，像先上高速；到了目的地附近，再展开细层的小路。 一次导航请求是这样走的。地理编码服务先把地址变成经纬度，路线规划器算出所在瓦片，让最短路径服务在对象存储里的路由瓦片上跑 A* 的变体。ETA 服务结合路况和机器学习估时间，排序服务再按用户偏好挑出路线。 路况是会变的。系统记下每位导航用户会经过哪些瓦片。某块瓦片发生事故，就反查经过它的用户，只给这些人重新规划，再通过 WebSocket 推送新路线。若只存粗瓦片来省空间，命中只是候选，还要核对具体路径。 记住三个词：瓦片、分层、实时重规划。图像瓦片用来看，路由瓦片用来算，路况变了，只通知受影响的人。"},{"no":19,"title":"分布式消息队列","en":"Distributed Message Queue","dur":245.392,"mb":39.041789054870605,"scenes":11,"src":"ch19/out/ch19-%E5%88%86%E5%B8%83%E5%BC%8F%E6%B6%88%E6%81%AF%E9%98%9F%E5%88%97.mp4","text":"第十九章，分布式消息队列。用三分钟，看懂它。 生产者发来的消息，先按主题分类，再被切成多个分区，分区分布在不同的 Broker 上。每条消息带一个分区键，对键做哈希再对分区数取余，就决定了去哪个分区。同一个键永远落在同一个分区，所以顺序只在分区内有保证。 每个分区本质上是一份只追加的日志。新消息永远写在末尾，拿到一个递增的偏移量，主题、分区、偏移量，这三个值就能定位一条消息。日志还会切成多个段，旧段只读，只有最新段可写。保留期是两周，到期整段回收，不用逐条删除。 消息被读走之后并不会删除。每个消费组各自保存一个偏移量，记下自己读到了哪里。订单组读到六，统计组读到九，互不影响。想要重放，把偏移量拨回去就行。日志只有一份，各组独立的是读取进度。 同一个消费组里，每个分区同一时刻只分给一个消费者，这样分区内的顺序才不会乱。三个分区，三个消费者，一人一个。再来第四个消费者，它只能空闲。所以组内活跃的消费者，最多等于分区数，想要更高的并行度，就增加分区。 消费者加入、退出，或者心跳超时，都会触发重平衡。成员连着同一个组协调器，协调器在心跳回复里通知大家重新加入，选出组长，由组长算出分配方案。B 加入，分区就分给 B 一份；B 挂了，分区再还给 A。交接期间，旧消费者必须先停手。 为了容错，每个分区有多个副本，其中只有一个 Leader。生产者写 Leader，Follower 主动来拉。已提交的偏移量是十三，Leader 又写了两条。副本二和副本三跟上了，所以在 ISR 里；副本四落后太多，被暂时移出。消息同步到 ISR 的所有副本，才算提交。 要等几个副本确认，可以配置。ACK 等于零，发出去就不管，最快，丢了也不知道。ACK 等于一，Leader 收到就确认，如果它在复制之前宕机，消息就丢了。ACK 等于 all，要等 ISR 里所有副本都同步，最慢，但持久性最强。 投递语义，取决于消费者处理和提交偏移量，谁先谁后。先提交再处理，处理前崩溃，这条消息就再也不会被处理，这是最多一次。先处理再提交，提交前崩溃，重启后会再读一遍，这是至少一次，可能重复。 最多一次，可能丢；至少一次，不会漏，但可能重复，所以业务要做幂等；恰好一次对用户最友好，代价也最高。只靠调整提交顺序做不到，写到外部数据库，还要事务或者幂等来配合。 回顾第十九章。分区日志，用追加写换来吞吐和顺序；消费组，用偏移量记录各自的进度；副本和 ISR，在延迟与持久性之间做取舍。"},{"no":20,"title":"指标监控与告警系统","en":"Metrics Monitoring & Alerting","dur":255.433333,"mb":40.86373329162598,"scenes":11,"src":"ch20/out/ch20-%E6%8C%87%E6%A0%87%E7%9B%91%E6%8E%A7%E4%B8%8E%E5%91%8A%E8%AD%A6%E7%B3%BB%E7%BB%9F.mp4","text":"第二十章，指标监控与告警系统。用三分钟，看懂它。 监控的数据叫时间序列。一条序列由指标名加一组标签确定，比如 CPU 负载，主机 web 零一，地域美西。每隔一会儿，它就多一个带时间戳的值，连起来就是曲线。一千个池，每池一百台，每台约一百个指标，共一千万条序列。 序列数由实际出现的标签组合决定。方法名只有 GET 和 POST，序列只多一倍。可要是把请求 ID 放进标签，每个请求都会新开一条序列，一千万条很快就失控。所以标签基数必须限制。 数据怎么进来？先看拉模型。采集器要知道有哪些服务，所以用 ZooKeeper 或 etcd 做服务发现。拿到名单，就按间隔访问每台服务的 metrics 端点，把指标拉回来。采集器有多个，每个目标由哈希环上的一个采集器负责，避免重复采集。 推模型相反：每台机器旁放一个 Agent，在本机采集，再主动推给中央采集器，前面要有负载均衡。怎么选？看服务突然没数据。拉模型里，拉取失败本身就是信号。推模型里，可能是服务挂了，也可能只是网络断了，分不清。 采集器直接写时序数据库，数据库一宕机数据就丢了。所以中间放一个 Kafka：采集器只管写入队列，消费者再写进数据库。数据库故障时，数据先堆在队列里，恢复后继续写。代价是多一套要运维的系统。 存储是设计的核心。访问模式是持续大量写入，平时读得少，出事才集中查。书里说，约百分之八十五的查询针对过去二十六小时，所以近期数据要放在快的地方。时序库还会压缩：只存时间差，间隔稳定时，差值的差值几乎全是零。 旧数据还要降采样：七天内保留原样，之后一分钟精度留三十天，再往后一小时精度留到一年。例子里十秒一个点，三十秒取平均，应是十五点三三和二十六点六七。注意，尖峰被平均抹平，原始点丢了就找不回，必要时要另存最大值。 告警规则不是一越线就响。这条规则是：up 等于零，持续 for 五分钟。曲线越线，先进入待定状态，开始计时。很快回落，只是尖峰，不报警。一直越线满五分钟，才触发，生成告警事件。持续时长，就是用来过滤抖动的。 触发后交给告警管理器：先过滤、合并、去重，同一实例反复触发只产生一个事件，再写入 Kafka，由消费者发邮件、电话、PagerDuty 或 Webhook。送不出就重试，至少一次送达，所以通知端也要去重。还有一条：没有数据，不等于健康。 回顾一下。第一，指标是时间序列，名称加标签加时间戳的值，要控制基数。第二，推或拉采集，队列跨过故障，时序库降采样。第三，告警用阈值加持续时间，去重重试，缺数据也要有规则。"},{"no":21,"title":"广告点击事件聚合","en":"Ad Click Event Aggregation","dur":225.26,"mb":36.733500480651855,"scenes":10,"src":"ch21/out/ch21-%E5%B9%BF%E5%91%8A%E7%82%B9%E5%87%BB%E4%BA%8B%E4%BB%B6%E8%81%9A%E5%90%88.mp4","text":"第二十一章，广告点击事件聚合。用三分钟，看懂它。 先估算规模。每天十亿次点击，平均每秒大约一万次，峰值按五倍算，是每秒五万次。每条事件约零点一 KB，一天大约一百 GB，一个月大约三 TB。原始事件要留底，聚合结果则小得多。 整体是一条事件流。点击事件先写进消息队列，聚合服务从队列里读，每分钟算出每个广告的点击数，再写进第二个队列，最后落到结果库。中间用队列隔开，下游慢了或者挂了，也不会堵住上游。 聚合服务按 MapReduce 的思路拆成三步。第一步 Map，按广告 ID 分发，同一个广告永远去同一个节点。第二步，各节点在内存里数数。第三步 Reduce，每个节点先挑出自己的前几名，再合并成全局榜单。因为同一广告的计数没有被拆散，合并才不会漏掉赢家。 统计要划窗口。每分钟的点击数，用滚动窗口：一分钟一个账本，互不重叠。最近 M 分钟的热门广告，用滑动窗口：每过一分钟，就往前看最近 M 分钟，窗口之间互相重叠。 再看时间。事件时间，是点击真正发生的时刻；处理时间，是服务器收到它的时刻。网络和队列会让两者差很多，事件还会乱序到达。本章要的是准确，所以按事件时间归窗口。 可迟到的事件怎么办？办法是水位线，它估计事件时间已经推进到了哪里。窗口的终点过了，也不立刻关门，要等水位线越过终点才输出。迟到的点击只要赶在这之前，照样算进来。等得短，延迟低但容易漏；等得长，更准但输出更慢。实在太晚的，进侧输出，留给对账修正。 计费既不能重复，也不能漏，目标是恰好一次。聚合节点算完一个结果，要做两件事：发给下游，记下进度。先发后记，中间宕机，重启后会重发，结果重复。先记后发，宕机后结果就永远丢了。办法是让两件事原子完成，或者让下游按唯一键幂等写入。 最后是批和流。批流各写一套，叫 Lambda 架构，代价是两套代码。只用一套流处理，历史数据靠重放走同一逻辑，叫 Kappa 架构。本章按 Kappa 思路设计：原始事件留底，每天用它重新算一遍，和聚合库对账，发现差异就修正。 记住三件事。窗口按事件时间归属，水位线接住迟到事件。状态、进度和结果一起提交，下游幂等写入。原始事件留底，每天对账重算。计费不能出错，靠的就是这几道保险。"},{"no":22,"title":"酒店预订系统","en":"Hotel Reservation System","dur":255.856,"mb":39.735426902770996,"scenes":11,"src":"ch22/out/ch22-%E9%85%92%E5%BA%97%E9%A2%84%E8%AE%A2%E7%B3%BB%E7%BB%9F.mp4","text":"第二十二章，酒店预订系统。用四分钟，看懂它。 客人订的是房型，不是某一间房。所以库存按酒店、房型、日期来存，每天一行：总数，加上已订数。五千家酒店，每家二十种房型，预生成两年，一共七千三百万行，单台数据库放得下。 住三晚，就要同时改三行库存。书里的例子，三晚的已订数是八十、八十二、八十六，上限一百一十，都能订。但如果中间一晚已经订满，整笔预订必须一起回滚，不能只订到头尾两晚。所以检查、扣库存、写订单，要放在同一个事务里。 麻烦来了。旺季里，两个用户同时抢同一个房型的最后一间。库存上限是一百一十，已经订了一百零九。两个事务都读到一百零九，都判断还能订一间，于是各自加一。结果变成一百一十一，超过了上限。先查后改，中间没有任何保护。 第一种办法，悲观锁。先到的事务用 SELECT FOR UPDATE 锁住这一行，直到提交。另一个事务只能排队等。等到库存变成一百一十，再读，一百一十加一超过上限，被拒绝。代价是锁多行可能死锁，长事务还会让后来的人一直等。 第二种，乐观锁。大家先读，不加锁，每行带一个版本号。提交时，更新条件是：版本号还是我读到的那个。第一个人成功，版本加一；第二个人条件不成立，影响行数为零，回滚后重读。冲突少时很划算。本题预订每秒只有约三次，书里选的就是它。 第三种，数据库约束。把规则交给数据库：总库存减去已订数，必须大于等于零。任何会越界的更新，直接被数据库拒绝。简单，低争用时好用；高争用下仍会大量失败。注意，允许超售百分之十时，约束要限制的是可售上限，不是物理房间数。 再看另一个问题：同一个用户点了两次。靠前端禁用按钮不可靠，要靠幂等。填写订单时，先生成全局唯一的预订编号，每次提交都带着它。数据库对编号加唯一约束，第二次提交直接被挡住，返回已有订单，不会重复扣房。幂等管同一件事做几次，库存控制管不同的人能买几份。 如果流量放大一千倍，数据库就成了瓶颈。好在每次查询都带酒店编号，可以按酒店编号做哈希分片。书里的例子，每秒三万次请求，分成十六片，每片大约一千八百七十五次，单个 MySQL 集群扛得住。 也可以用 Redis 缓存剩余库存，键是酒店、房型、日期。数据库的变化通过 CDC 异步同步到缓存，所以缓存可能短暂落后。用户看到有房，提交时却发现售罄，这时由数据库兜底拒绝。缓存只负责展示，能不能订，以数据库为准。 记住三个词：库存行、并发控制、幂等键。一天一行的库存，三种办法守住上限，预订编号挡住重复提交。"},{"no":23,"title":"分布式邮件服务","en":"Distributed Email Service","dur":261.033333,"mb":41.611572265625,"scenes":11,"src":"ch23/out/ch23-%E5%88%86%E5%B8%83%E5%BC%8F%E9%82%AE%E4%BB%B6%E6%9C%8D%E5%8A%A1.mp4","text":"第二十三章，分布式邮件服务。跟着一封邮件走一趟，看懂它。 Alice 用 Outlook 写信，点发送。Outlook 的服务器先查询对方域名的 MX 记录，找到 Gmail 的收信服务器，再用 SMTP 把信递过去。Bob 最后用 IMAP 或者 POP，从 Gmail 取信。服务器之间靠 SMTP，用户取信靠 IMAP、POP，本章的网页客户端则用 HTTP。 在分布式设计里，发信请求先到负载均衡，限流之后分给 Web 服务器。Web 服务器做大小等基本校验，通过了就进发信队列，附件只传对象存储的引用，校验失败则进错误处理队列。SMTP 出站 worker 取信，检查垃圾邮件和病毒，投递给对方，最后存进已发送文件夹。 发信队列的长度要一直盯着。积压有两种可能。对方服务器不可用，就用指数退避重试；worker 不够，才需要扩容。要是对方正在限流，加 worker 只会更糟。临时故障可以重试，永久拒收则要生成失败结果，不能无限重发。 收信方向反过来。邮件先到 SMTP 负载均衡器，再分给 SMTP 服务器，执行接收策略，无效邮件直接拒绝。较大的附件分离到对象存储。接着邮件处理 worker 做初步检查，把内容送往持久存储、缓存，并通知实时服务器。用户在线就推送，离线的用户上线后，通过 HTTP 接口来读。 为什么要把附件和邮件数据分开放？算一笔账。十亿用户，每人每天收四十封，每封平均五十 KB，一年约七百三十 PB。百分之二十的邮件带附件，平均五百 KB，一年约一千四百六十 PB。附件字节更多，所以放对象存储，数据库只留引用。 元数据怎么分片？按 user_id 分区，同一个用户的数据落在同一个分片，因为获取、标已读、搜索，都以单个用户为范围。主键由分区键和聚簇键组成：分区键决定去哪个分片，聚簇键在分片内排序。邮件 ID 用 timeuuid，按创建时间排。 但是，Cassandra 这类模型，不能高效地按已读未读过滤。于是把数据反规范化，建一张已读表、一张未读表。代价是，标记已读时要从未读表删掉，写进已读表，重复和乱序的事件还不能出错。读的时候省事，写的时候多了责任。 搜索用 Elasticsearch，按 user_id 路由，同一个用户的邮件集中在一个分片。邮件变更先写主存，再通过 Kafka 异步进入索引。所以刚收到的信可能暂时搜不到。先确认原信在主存，再查索引队列的水位，队列消费完，也还要等搜索可见。 最后澄清一件事：成功有四层。本系统接受发送，对方 SMTP 接受，邮件进入收件箱，用户已读。前三个，都不能替代最后一个，SMTP 接受，不等于用户已经读过。 记住三个词：SMTP 传信，分离存储，按用户分片。先可靠接收，再异步投递、异步建索引。"},{"no":24,"title":"S3 类对象存储","en":"S3-like Object Storage","dur":250.984,"mb":40.06444072723389,"scenes":11,"src":"ch24/out/ch24-S3%20%E7%B1%BB%E5%AF%B9%E8%B1%A1%E5%AD%98%E5%82%A8.mp4","text":"第二十四章，S3 类对象存储。用三分钟，看懂它。 对象存储把数据装在桶里。桶是逻辑容器，名字全局唯一；对象由数据和元数据组成，用键来找。键里的斜杠只是前缀约定，不是真的目录。对象整体写入、整体替换，不支持原地修改。 本章最核心的想法，是把元数据和数据分开。元数据是桶名、对象名、对象 ID 这些小信息；真正的字节放在数据存储里，凭对象 ID 来取。像 UNIX 先查 inode、再读数据块。分开之后，两边就能各自独立扩展。 上传时，请求经负载均衡到无状态的 API 服务。API 先问 IAM，验证身份和写权限，再把字节交给数据存储，拿回对象 ID，最后在元数据存储记下桶、名字和这个 ID。下载反过来：先查元数据拿到 ID，再凭 ID 取字节。 数据存储内部，路由服务先问放置服务该写哪个节点。小对象不会一个存一个文件，而是追加进一个几 GB 的大文件，再用本地索引记下对象 ID、文件名、起始偏移和大小。读取时查索引，直接定位。 再看持久性。纠删码把对象切成八个数据块，再算出四个校验块，一共十二块，分别放到不同的磁盘和不同的故障域。这就是八加四。 磁盘会坏。就算四块同时丢失，只要还剩任意八块，不论数据块还是校验块，都能重建出原对象。但如果再丢一块，只剩七块，就无法恢复。所以十二块必须分散在不同机架、不同机房，不能让一次故障同时带走五块。 和三副本比一比。三副本占三倍空间，额外百分之两百；八加四只占一点五倍，额外只有百分之五十，少了一半。书中假设硬盘年故障率百分之零点八一，三副本约六个九，引用的模型里纠删码能到十一个九。代价是编码解码更复杂、读取要跨多个节点。延迟敏感倾向复制，成本敏感的大规模存储倾向纠删码。 大文件用分段上传。先初始化，拿到 upload_id；再把文件切成多块，各块独立上传，成功就返回 ETag；某一块失败，只重传那一块。全部传完，提交 upload_id、块号和各块的 ETag，服务端才组装出完整对象。没用的临时块交给垃圾回收。 对象版本。同一个键再次上传，不覆盖，而是新增一个版本，有新的对象 ID 和按时间排序的版本号。默认读最新版本。删除时不抹掉字节，只插入一个删除标记，于是默认读取返回四零四，旧版本仍在，指定版本号还能读到。 总结一下：元数据与数据分离，名字查元数据，ID 查数据节点；纠删码用一点五倍空间换来高持久性，块要跨故障域；分段上传与版本管理，让大文件和误删都能从容应对。"},{"no":25,"title":"实时游戏排行榜","en":"Real-time Gaming Leaderboard","dur":233.028,"mb":37.21342658996582,"scenes":12,"src":"ch25/out/ch25-%E5%AE%9E%E6%97%B6%E6%B8%B8%E6%88%8F%E6%8E%92%E8%A1%8C%E6%A6%9C.mp4","text":"第二十五章，实时游戏排行榜。用三分钟，看懂它。 用关系数据库做排行榜，每个玩家一行，分数一列。查前十，要按分数排序，没有合适的索引，就得扫描并排序全部记录。更麻烦的是查中间某个人的名次，玩家一多，每次都很贵。 Redis 的有序集合换了个办法：数据始终保持有序。底层是哈希表加跳表，哈希表由成员查分数，跳表按分数排顺序。跳表就是在有序链表上加几层稀疏索引，先大步跳，再小步走。书里六十四个节点的例子，普通链表要走六十二个，跳表大约十一个。 日常只用四个命令。ZADD 插入成员或设置分数，ZINCRBY 加分，ZREVRANGE 按名次区间读取，ZREVRANK 查某个成员的位置。更新和定位都是对数级，区间读取是对数，再加上读出的个数。 玩家赢一场，只要一条 ZINCRBY，给 mary1934 加一分。她的条目沿着索引找到新位置，分数超过前面的人，就在榜上往上走一格，其余人自动顺延。整个过程不需要重新排序。 取前十，用 ZREVRANGE，从零到九，再带上分数。集合本来就是有序的，直接按位置读出十条就行，不用扫描，也不用排序。 查附近的人，先用 ZREVRANK 问出 mary1934 的位置，书里假设是三百六十一，注意是从零开始数的。再取前后各四个，也就是三百五十七到三百六十五，两端都包含。榜首的人要把起点截到零。 榜单按月比赛。每个月一个新的 key，比如二月就叫 leaderboard 下划线 feb 下划线 2021，加分和查榜都对这个 key 操作。月底旧榜归档到历史存储，新的一月从空榜开始。 再看规模。五百万日活，存储大约六百五十兆，峰值每秒两千五百次更新，单个 Redis 就够。可是涨到五亿日活，就是六十五 GB、每秒二十五万次，必须分片。书里写的是十倍，其实是一百倍。 第一种分片，按分数范围。比如九百到一千分放一片。查前十，先去最高分那片。查某人的全局名次，等于片内位置，加上更高分片里的人数。代价是玩家分数跨段时，要迁移条目、更新路由。 第二种，按玩家哈希分片。求全局前十，每片各取前十再合并，因为本片排不进前十的人，全局也不可能进。代价是分片越多，查询扇出越大，个人名次也要问遍所有分片。所以书里偏向固定范围分区。 总结。有序集合，让名次随分数自动移动；月度 key，一个赛季一张榜；分片，要在前十合并和个人名次之间取舍。"},{"no":26,"title":"支付系统","en":"Payment System","dur":183.066667,"mb":28.796866416931152,"scenes":10,"src":"ch26/out/ch26-%E6%94%AF%E4%BB%98%E7%B3%BB%E7%BB%9F.mp4","text":"第二十六章，支付系统。用三分钟，看懂一笔钱怎么不多扣、不少扣。 先看收款流程。用户下单，支付服务接收事件并存库，再交给支付执行器。执行器把订单存进自己的库，然后调用外部的支付服务商 PSP 去扣卡。付款完成后，更新钱包，最后在账本里记一笔。 一笔支付订单有四种状态：未开始、执行中、成功、失败。注意，库里写了执行中，不代表 PSP 已经扣款。钱包和账本各有一个标记，分别记录有没有更新，所以每一步的结果都能单独追踪。 账本用复式记账：每笔资金变动同时记入两个账户。买家一美元，卖家一美元，每张凭证借方合计等于贷方合计。这样资金可以端到端追踪，对账时也有据可查。 最麻烦的是超时。执行器请求 PSP，迟迟没有响应。这时候你只知道没收到回复，并不知道结果。也许请求根本没到，也许钱已经扣了，只是响应在路上丢了。 如果这时候贸然重试，用一个新的请求标识，会发生什么？PSP 把它当成一笔全新的付款，又扣了一次。买家被扣了两次钱。重试要做到至少一次，但不能变成多扣。 办法是幂等。重试时沿用原来的支付订单 ID 作为幂等键。PSP 看到这个键已经处理过，就不再扣款，直接返回上次的结果。自己的数据库也一样，用唯一约束拦住重复的插入。 重试要有节奏。常用指数退避：每次等待的时间，是上一次的两倍。可以重试的失败，进入重试队列。达到上限仍然失败的，送进死信队列，留给人调查。 即使这样，系统之间仍可能不一致。所以每晚，PSP 会发来结算文件。系统把它和内部记录逐笔比对，找出差异。已知类型的按标准流程调整，不能自动处理的，交给财务手工处理。 记住三个词：幂等键、对账、复式记账。先记录，再外调，不确定就查，重试复用键，异常靠对账收敛。"},{"no":27,"title":"数字钱包","en":"Digital Wallet","dur":240.064,"mb":38.699066162109375,"scenes":11,"src":"ch27/out/ch27-%E6%95%B0%E5%AD%97%E9%92%B1%E5%8C%85.mp4","text":"第二十七章，数字钱包。用三分钟，看懂跨分片转账和事件溯源。 要求是每秒一百万笔转账。书里假设一个关系数据库大约一千 TPS，所以要一千个节点。而一笔转账有扣款和入账两条腿，实际每秒要处理两百万次账户操作。账户只能分散到许多分片上。 问题来了：A 在一个分片，C 在另一个分片。先扣 A 一美元，再给 C 加一美元，这是两次写入。如果中间出了故障，这一美元就凭空消失了。跨分片的转账，必须要么都成功，要么都不发生。 第一种办法是两阶段提交。协调者先让所有数据库进入准备状态，全部回答可以，再通知提交，否则通知全部中止。它的代价是：准备之后要一直持锁等待，锁竞争让性能不理想，而且协调者本身是单点故障。 第二种是 TC/C，三个动作：尝试、确认、取消。尝试阶段，A 的数据库在本地事务里扣一美元，C 的数据库什么也不做。如果 C 那边的响应失败，就进入取消阶段，A 把一美元加回去。如果都成功，确认阶段 C 才加一美元。注意要先扣款，后入账。 第三种是 Saga。把操作排成一条线：第一步扣 A，第二步加 C，每步各自是独立的本地事务。第二步失败了，就从已完成的步骤开始，反向执行补偿，把 A 的一美元加回去。书里更推荐由一个协调者统一指挥的编排式。 三种方案放在一起看。两阶段提交是一个逻辑事务，要持锁。TC/C 和 Saga 都是各自提交本地事务，失败时用补偿。区别在于，TC/C 的步骤可以并行，延迟更低；Saga 是线性的。不管哪种，中间都会短暂不一致，还需要历史记录来恢复。 那怎么证明余额是对的？靠事件溯源。用户的请求是命令，按顺序进入队列。状态机验证命令，通过后产生事件，事件只追加、不修改，也同样有序。余额只是事件作用之后的结果。 这就带来可重现性。想知道任意时刻的余额，从头重放事件，播放到那个时刻就行。想验证改过的代码，用新旧版本处理同一批事件，比较结果。为了不每次从头来，定期保存快照，从快照之后接着重放。 性能上，命令和事件写本地磁盘，状态放在本地文件存储里。单机有单点故障，所以用 Raft 把事件复制到多个节点，多数节点可用就能继续。再用 CQRS，由只读状态机查询并主动推送结果。容量不够时，拆成多个 Raft 组，用 TC/C 或 Saga 协调跨组转账。 记住三个词：事务、事件、重放。余额是结果，事件才是历史；单组靠共识，多组靠事务。"},{"no":28,"title":"证券交易所","en":"Stock Exchange","dur":243.466667,"mb":39.007741928100586,"scenes":10,"src":"ch28/out/ch28-%E8%AF%81%E5%88%B8%E4%BA%A4%E6%98%93%E6%89%80.mp4","text":"第二十八章，证券交易所。用三分钟，看懂撮合引擎。 交易所的核心是订单簿。买盘按价格从高到低排，卖盘按价格从低到高排。最高的买价叫最佳买价，最低的卖价叫最佳卖价，中间的差距就是价差。同一个价格上，先到的订单排在前面。这就是价格优先，同价时间优先。 一张新的限价买单，如果价格够不到任何卖单，就不会成交，而是排进订单簿。比如价格一百点零七、数量两百，挂到这个价位队列的末尾。每个价位用双向链表存队列，再加一张订单号索引，入队、取队首、凭订单号撤单，都是常数时间。 现在来一张大单，买入两千七百股。最佳卖价一百点一零这一档有四个订单，两百、四百、一千一百、一百，依次成交，共一千八百股，这一档清空。再去下一档，队首是九百股，刚好补齐。每次成交，买卖双方各生成一笔成交回报。新的最佳卖价抬高到一百点一一，价差也变大了。 限价单和市价单的区别，在于有没有价格上限。限价买单只吃不高于限价的卖档，吃不完的部分挂进订单簿。市价单不设上限，有多少吃多少，可能一路扫过好几档。下面用三千股示意。本章的设计只做限价单，市价单作对照。 撮合要的是所有人看到同样的顺序，算出同样的结果。所以订单先过排序器：每条入站订单、每条出站成交，都打上递增的序列号，写进事件日志。撮合引擎严格按序号，一条一条处理。同样的初始状态，同样的有序输入，重放一遍，结果完全一样。 目标是把延迟从几十毫秒，压到几十微秒。办法有两条：减少关键路径上的任务，缩短每个任务的耗时。分布式设计里，每一跳都有网络延迟，排序器还要写磁盘。于是把关键组件放到同一台服务器上，不走网络，也不碰普通磁盘。 进程之间用 mmap 通信：把事件存储映射进各进程的地址空间，放在共享内存里，一个进程写，其他进程直接读。撮合循环固定在一个 CPU 核上，单线程依次处理事件，没有上下文切换，也不用抢锁。订单簿整个放在内存里。 单点就是风险。目标是可用性百分之九十九点九九，每天只能停大约八点六四秒。所以给撮合引擎准备热备：备机收到同样的事件流，保持同样的状态，但不对外发布成交。心跳检测到主机失联，备机接任主节点。事件在服务器之间复制，书里建议用可靠 UDP。 回顾一下。订单簿让价格优先、同价排队。排序器加单线程内存撮合，让结果确定又足够快。热备接收同样的事件，主机出事就接手。记住一句话：先有顺序，再有结果。"}];const g=document.getElementById('g'),q=document.getElementById('q'),d=document.getElementById('d'),v=document.getElementById('v');
const fmt=s=>Math.floor(s/60)+' 分 '+String(Math.round(s%60)).padStart(2,'0')+' 秒';
function draw(){const k=q.value.trim().toLowerCase();const L=R.filter(r=>!k||(r.title+r.en+r.no+r.text).toLowerCase().includes(k));
g.innerHTML=L.map(r=>'<div class="c" data-i="'+r.no+'"><div class="no">CH '+String(r.no).padStart(2,'0')+'</div><div class="t">'+r.title+'</div><div class="en">'+r.en+'</div><div class="meta">'+fmt(r.dur)+' · '+r.scenes+' 个场景 · '+r.mb.toFixed(0)+' MB</div></div>').join('');
document.getElementById('e').hidden=L.length>0}
g.onclick=e=>{const c=e.target.closest('.c');if(!c)return;const r=R.find(x=>x.no==c.dataset.i);dt.textContent='第 '+r.no+' 章 · '+r.title;v.src=r.src;d.showModal();v.play()};
d.onclose=()=>{v.pause();v.removeAttribute('src')};q.oninput=draw;draw();
</script></body></html>
