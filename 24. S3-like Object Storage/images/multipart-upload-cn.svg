<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img"><title>分片上传：完成清单把多个 part 组成一个对象</title><desc>客户端先创建upload_id，并行上传分片，失败只重传对应part，完成时提交有序的分片清单再发布对象版本。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="710" fill="#fffdf7"/><rect width="1040" height="710" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">分片上传：完成清单把多个 part 组成一个对象</text><path d="M42 86 Q177.5 84.5 313 87 Q326 87 325 99 L324 190 Q325 203 312 202 L42 203 Q29 202 30 190 L31 98 Q30 86 42 86 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="118" class="head">① 发起 multipart upload</text><text x="47" y="150">得到 upload_id = U9</text><text x="47" y="178">拆分文件：P1、P2、P3</text><path d="M326,145 L383,145" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M408 86 Q703.0 84.5 998 87 Q1011 87 1010 99 L1009 190 Q1010 203 997 202 L408 203 Q395 202 396 190 L397 98 Q396 86 408 86 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="413" y="118" class="head">② 临时分片空间：按 upload_id + part_no 保存</text><text x="413" y="150">U9/P1 → ETag e1    U9/P2 → e2    U9/P3 → e3</text><text x="413" y="178">分片可并行上传；单个失败只重传该 part</text><path d="M704,203 L704,248" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M408 265 Q703.0 263.5 998 266 Q1011 266 1010 278 L1009 365 Q1010 378 997 377 L408 378 Q395 377 396 365 L397 277 Q396 265 408 265 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="297" class="head">③ Complete：提交完整、有序的分片清单</text><text x="413" y="329">U9 + [(1,e1), (2,e2), (3,e3)]</text><text x="413" y="357">验证分片存在、顺序与完整性；不能漏 part 就发布</text><path d="M42 265 Q177.5 263.5 313 266 Q326 266 325 278 L324 365 Q325 378 312 377 L42 378 Q29 377 30 365 L31 277 Q30 265 42 265 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="297" class="head">未完成的上传 U9</text><text x="47" y="329">有效期内可重试</text><text x="47" y="357">过期后 GC 回收孤儿分片</text><path d="M325,320 L385,320" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="332" y="299" class="small">未过期</text><path d="M704,378 L704,425" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M408 440 Q703.0 438.5 998 441 Q1011 441 1010 453 L1009 552 Q1010 565 997 564 L408 565 Q395 564 396 552 L397 452 Q396 440 408 440 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="472" class="head">④ 形成新对象版本并发布元数据</text><text x="413" y="504">对外可见：bucket/key → 新 UUID</text><text x="413" y="532">完成后才返回成功；临时分片按策略回收</text><path d="M42 603 Q520.0 601.5 998 604 Q1011 604 1010 616 L1009 668 Q1010 681 997 680 L42 681 Q29 680 30 668 L31 615 Q30 603 42 603 Z" fill="#f7f2e6" stroke="#263b48" stroke-width="2.4"/><text x="47" y="634">ETag 是分片标识，不应一概当作对象内容的 MD5；校验和语义由接口定义。</text><text x="47" y="662">图示是通用对象存储教学流程，完成不一定意味着物理拼接成一个大文件。</text></svg>