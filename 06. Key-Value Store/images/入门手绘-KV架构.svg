<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330"><title>键值存储协调节点与副本</title><desc>客户端访问协调节点，协调节点按key路由到数据的三个副本。</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:Comic Sans MS,sans-serif;fill:#243447}.b{fill:#eef7f2;stroke:#355c4d;stroke-width:3;rx:16}.a{stroke:#e07a5f;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#e07a5f"/></marker></defs><rect class="b" x="25" y="120" width="135" height="75"/><text x="55" y="165" font-size="22">客户端</text><line class="a" x1="160" y1="158" x2="245" y2="158"/><rect class="b" x="245" y="95" width="170" height="125"/><text x="280" y="140" font-size="22">协调节点</text><text x="275" y="175" font-size="17">路由 + 读写</text><line class="a" x1="415" y1="125" x2="505" y2="75"/><line class="a" x1="415" y1="158" x2="505" y2="158"/><line class="a" x1="415" y1="190" x2="505" y2="240"/><rect class="b" x="505" y="35" width="220" height="65"/><text x="540" y="74" font-size="20">节点 A（副本）</text><rect class="b" x="505" y="125" width="220" height="65"/><text x="540" y="164" font-size="20">节点 B（副本）</text><rect class="b" x="505" y="215" width="220" height="65"/><text x="540" y="254" font-size="20">节点 C（副本）</text></svg>
