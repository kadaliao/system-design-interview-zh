<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260"><title>Snowflake字段示意</title><desc>一位符号、四十一位时间、五位机房、五位机器和十二位序列；图中宽度不按位数比例。</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:Comic Sans MS,sans-serif;fill:#243447}.s{stroke:#fff;stroke-width:2}.t{font-size:18px;text-anchor:middle}.h{font-size:21px;text-anchor:middle}</style><rect x="35" y="80" width="70" height="70" fill="#f2cc8f" class="s"/><rect x="105" y="80" width="300" height="70" fill="#81b29a" class="s"/><rect x="405" y="80" width="120" height="70" fill="#f28482" class="s"/><rect x="525" y="80" width="120" height="70" fill="#84a59d" class="s"/><rect x="645" y="80" width="120" height="70" fill="#f6bd60" class="s"/><text x="70" y="120" class="t">符号 1</text><text x="255" y="120" class="t">时间戳 41</text><text x="465" y="120" class="t">机房 5</text><text x="585" y="120" class="t">机器 5</text><text x="705" y="120" class="t">序列 12</text><text x="400" y="35" class="h">一个 ID = 时间 + 位置 + 同毫秒内序号</text><text x="400" y="242" font-size="14" text-anchor="middle">字段示意，宽度不按位数比例</text><text x="400" y="205" class="h">时钟回拨要保护；序列耗尽要等待下一毫秒</text></svg>
