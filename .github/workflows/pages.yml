name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 用当前 Markdown 重新生成阅读页，避免仓库里的 index.html 过期
      - name: Build reader
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/deps" marked@18.0.14
          MARKED_MODULE="$RUNNER_TEMP/deps/node_modules/marked/lib/marked.esm.js" node 工具/build-reader.mjs
          git diff --quiet -- index.html || echo "::warning file=index.html::仓库中的阅读页与 Markdown 不同步，请本地运行 工具/build-reader.mjs 后提交"
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
