<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="745" viewBox="0 0 1040 745" role="img"><title>哈希分片后的 Top K：每片先取 K，再合并候选</title><desc>用户按ID分到多个独立sorted set；每片取Top3，协调服务在三个有序候选流中合并取全局Top3。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="745" fill="#fffdf7"/><rect width="1040" height="745" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">哈希分片后的 Top K：每片先取 K，再合并候选</text><text x="35" y="88" class="small">示例 K = 3；每片是独立 Sorted Set，用户互斥归属；各片与合并采用同一排序。</text><path d="M42 116 Q175.0 114.5 308 117 Q321 117 320 129 L319 297 Q320 310 307 309 L42 310 Q29 309 30 297 L31 128 Q30 116 42 116 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="148" class="head">分片 A</text><text x="47" y="180">A1  100</text><text x="47" y="208">A2   80</text><text x="47" y="236">A3   60</text><text x="47" y="286" class="small">只返回本片 Top 3</text><path d="M387 116 Q520.0 114.5 653 117 Q666 117 665 129 L664 297 Q665 310 652 309 L387 310 Q374 309 375 297 L376 128 Q375 116 387 116 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="392" y="148" class="head">分片 B</text><text x="392" y="180">B1   95</text><text x="392" y="208">B2   90</text><text x="392" y="236">B3   50</text><text x="392" y="286" class="small">只返回本片 Top 3</text><path d="M732 116 Q865.0 114.5 998 117 Q1011 117 1010 129 L1009 297 Q1010 310 997 309 L732 310 Q719 309 720 297 L721 128 Q720 116 732 116 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="737" y="148" class="head">分片 C</text><text x="737" y="180">C1   99</text><text x="737" y="208">C2   85</text><text x="737" y="236">C3   70</text><text x="737" y="286" class="small">只返回本片 Top 3</text><path d="M175,310 L175,350 L475,350 L475,407" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M520,310 L520,407" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="548" y="335" class="small">共 3 × 3 = 9 个候选</text><path d="M865,310 L865,350 L565,350 L565,407" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M227 422 Q520.0 420.5 813 423 Q826 423 825 435 L824 545 Q825 558 812 557 L227 558 Q214 557 215 545 L216 434 Q215 422 227 422 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="232" y="454" class="head">协调服务：合并 3 条已排序候选流</text><text x="232" y="486">取当前最高分 → 输出 → 推进对应分片游标</text><text x="232" y="514">全局 Top 3：A1(100)、C1(99)、B1(95)</text><path d="M42 594 Q520.0 592.5 998 595 Q1011 595 1010 607 L1009 669 Q1010 682 997 681 L42 682 Q29 681 30 669 L31 606 Q30 594 42 594 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="625">为什么够：某人若连本片前 K 都进不了，本片已有至少 K 人排在其前面。</text><text x="47" y="653">代价：查询所有分片、最多接收 分片数×K 个候选；全局某人的精确名次另算。</text><text x="35" y="720" class="small">各片并发更新时未必读到同一快照；需要严格一致的全局榜单时，还要额外协调。</text></svg>