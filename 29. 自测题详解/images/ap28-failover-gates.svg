<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="635" viewBox="0 0 1160 635" role="img"><title>P28-01/02｜交易所切换：先证明安全，再恢复承诺</title><desc>故障嫌疑触发暂停；合法多数选主并获得新任期，隔离旧主，恢复连续已提交日志，校验状态和出站去重；任一条件不满足就停盘。</desc><rect width="1160" height="635" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P28-01/02｜交易所切换：先证明安全，再恢复承诺</text><rect x="40" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="56" y="163" class="t b">① 合法领导权</text><text x="56" y="195" class="t p">多数仲裁 + 新任期</text><text x="56" y="223" class="t p">候选日志满足协议</text><rect x="320" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="336" y="163" class="t b">② 隔离旧主</text><text x="336" y="195" class="t p">fencing 在接收端生效</text><text x="336" y="223" class="t p">旧任期写入 / 发布被拒</text><rect x="600" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="616" y="163" class="t b">③ 恢复权威状态</text><text x="616" y="195" class="t p">连续的已提交日志</text><text x="616" y="223" class="t p">订单簿 + 资金冻结</text><rect x="880" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="896" y="163" class="t b">④ 校验输出边界</text><text x="896" y="195" class="t p">订单 ID / 成交 ID 去重</text><text x="896" y="223" class="t p">恢复最后已发布位置</text><path d="M280 202 L320 202" class="a"/><path d="M560 202 L600 202" class="a"/><path d="M840 202 L880 202" class="a"/><rect x="40" y="355" width="715" height="100" fill="#ffe5dd" class="box"/><text x="56" y="388" class="t b">任一关口不满足 → 保持交易暂停</text><text x="56" y="420" class="t p">心跳超时只是怀疑，最高本地序号也可能尚未提交</text><rect x="830" y="355" width="290" height="100" fill="#e2eee8" class="box"/><text x="846" y="388" class="t b">全部通过后恢复交易</text><text x="846" y="420" class="t p">恢复有序入站和唯一出站</text><path d="M1000 275 L1000 355" class="a"/><text x="40" y="521" class="t p">主副本都可能收到重试：复用原订单和成交 ID；重放不能产生第二笔成交。</text><text x="40" y="575" class="t p">补发回报可能重复投递，接收方按 ID 去重；无法确认唯一主节点时保持停盘。</text></svg>