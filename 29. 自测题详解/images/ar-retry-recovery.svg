<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img"><title>R-03｜按故障发生的位置，决定恢复动作</title><desc>提交前崩溃依赖数据库回滚；提交后发布前崩溃依赖outbox重发；PSP已执行但网络响应丢失时保留未知结果并查询原支付，避免重复扣款。</desc><rect width="1160" height="660" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">R-03｜按故障发生的位置，决定恢复动作</text><rect x="40" y="105" width="315" height="125" fill="#ffe5dd" class="box"/><text x="56" y="138" class="t b">提交前崩溃</text><rect x="430" y="105" width="290" height="125" fill="#e6e6f2" class="box"/><text x="446" y="138" class="t b">查看权威状态</text><text x="446" y="170" class="t p">事务未提交</text><rect x="805" y="105" width="315" height="125" fill="#e2eee8" class="box"/><text x="821" y="138" class="t b">恢复动作</text><text x="821" y="170" class="t p">库存和订单一起回滚</text><text x="821" y="198" class="t p">复用 checkout_id 重试</text><path d="M355 167 L430 167" class="a"/><path d="M720 167 L805 167" class="a"/><rect x="40" y="280" width="315" height="125" fill="#ffe5dd" class="box"/><text x="56" y="313" class="t b">提交后、发布前崩溃</text><rect x="430" y="280" width="290" height="125" fill="#e6e6f2" class="box"/><text x="446" y="313" class="t b">查看权威状态</text><text x="446" y="345" class="t p">订单 + outbox 已提交</text><rect x="805" y="280" width="315" height="125" fill="#e2eee8" class="box"/><text x="821" y="313" class="t b">恢复动作</text><text x="821" y="345" class="t p">发送器恢复后继续发布</text><text x="821" y="373" class="t p">消费记录与业务更新同事务</text><path d="M355 342 L430 342" class="a"/><path d="M720 342 L805 342" class="a"/><rect x="40" y="455" width="315" height="125" fill="#ffe5dd" class="box"/><text x="56" y="488" class="t b">PSP 响应途中丢失</text><rect x="430" y="455" width="290" height="125" fill="#e6e6f2" class="box"/><text x="446" y="488" class="t b">查看权威状态</text><text x="446" y="520" class="t p">本地结果仍为未知</text><rect x="805" y="455" width="315" height="125" fill="#e2eee8" class="box"/><text x="821" y="488" class="t b">恢复动作</text><text x="821" y="520" class="t p">原支付键查询 / 验签回调</text><text x="821" y="548" class="t p">确认终态前不重新扣一笔</text><path d="M355 517 L430 517" class="a"/><path d="M720 517 L805 517" class="a"/><text x="40" y="628" class="t p">共同规则：稳定业务 ID + 原子去重；退避、死信和对账负责让异常继续收敛。</text></svg>