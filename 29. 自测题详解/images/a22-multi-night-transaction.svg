<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">连续三晚：任意一天失败，整笔回滚</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">9 月 10 日入住，13 日退房；占用 10、11、12 日，退房日不占房晚</text><path d="M59 131 Q620.0 128 1181 132 Q1191 131 1190 142 L1191 490 Q1190 502 1180 500 L59 501 Q49 500 51 490 L49 142 Q50 131 59 131Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="620" y="164" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">同一个数据库事务：暂扣不等于已经提交</text><path d="M99 201 Q220.0 198 341 202 Q351 201 350 212 L351 335 Q350 347 340 345 L99 346 Q89 345 91 335 L89 212 Q90 201 99 201Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="220.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">9 月 10 日</text><text x="220.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">原剩余 2 间</text><text x="220.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">暂扣 1 → 暂余 1</text><path d="M489 201 Q610.0 198 731 202 Q741 201 740 212 L741 335 Q740 347 730 345 L489 346 Q479 345 481 335 L479 212 Q480 201 489 201Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="610.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">9 月 11 日</text><text x="610.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">原剩余 0 间</text><text x="610.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">不足 1 → 失败</text><path d="M879 201 Q1000.0 198 1121 202 Q1131 201 1130 212 L1131 335 Q1130 347 1120 345 L879 346 Q869 345 871 335 L869 212 Q870 201 879 201Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="1000.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">9 月 12 日</text><text x="1000.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">原剩余 4 间</text><text x="1000.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">不再继续 / 不提交</text><polyline points="350,275 480,275" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="361.5" y="231" width="107" height="28" rx="4" fill="#fffdf7"/><text x="415" y="251" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">检查下一晚</text><polyline points="610,345 610,394" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M144 398 Q620.0 395 1096 399 Q1106 398 1105 409 L1106 452 Q1105 464 1095 462 L144 463 Q134 462 136 452 L134 409 Q135 398 144 398Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="437.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">回滚之前的暂扣；不生成已确认预订</text><polyline points="620,500 620,548" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M254 551 Q620.0 548 986 552 Q996 551 995 562 L996 632 Q995 644 985 642 L254 643 Q244 642 246 632 L244 562 Q245 551 254 551Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="589.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">最终库存：2、0、4</text><text x="620.0" y="619.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">订单整体失败，用户可另选日期或房型</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">事务保证一起成功/一起失败；行锁或带条件更新保证并发争抢不超卖。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">不要持有库存行锁等待支付；库存占用与支付通过可恢复状态机衔接。</text></g></svg>