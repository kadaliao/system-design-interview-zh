<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="715" viewBox="0 0 1040 715" role="img"><title>90 秒回答：需求 → 路径 → 瓶颈 → 取舍 → 演进</title><desc>五段分别用15、25、15、20、15秒，重点是因果主线而不是技术名词列表。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="715" fill="#fffdf7"/><rect width="1040" height="715" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">90 秒回答：需求 → 路径 → 瓶颈 → 取舍 → 演进</text><path d="M42 100 Q112.5 98.5 183 101 Q196 101 195 113 L194 164 Q195 177 182 176 L42 177 Q29 176 30 164 L31 112 Q30 100 42 100 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="131">0—15 秒</text><path d="M259 100 Q628.5 98.5 998 101 Q1011 101 1010 113 L1009 164 Q1010 177 997 176 L259 177 Q246 176 247 164 L248 112 Q247 100 259 100 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="264" y="131">需求：好友图文 + 时间倒序；允许秒级传播，先不做推荐。</text><path d="M197,138 L234,138" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M105,177 L105,195" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M42 204 Q112.5 202.5 183 205 Q196 205 195 217 L194 268 Q195 281 182 280 L42 281 Q29 280 30 268 L31 216 Q30 204 42 204 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="235">15—40 秒</text><path d="M259 204 Q628.5 202.5 998 205 Q1011 205 1010 217 L1009 268 Q1010 281 997 280 L259 281 Q246 280 247 268 L248 216 Q247 204 259 204 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="264" y="235">路径：帖子先保存，再可靠扇出；读 ID 聚合正文，媒体走 CDN。</text><path d="M197,242 L234,242" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M105,281 L105,299" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M42 308 Q112.5 306.5 183 309 Q196 309 195 321 L194 372 Q195 385 182 384 L42 385 Q29 384 30 372 L31 320 Q30 308 42 308 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="339">40—55 秒</text><path d="M259 308 Q628.5 306.5 998 309 Q1011 309 1010 321 L1009 372 Q1010 385 997 384 L259 385 Q246 384 247 372 L248 320 Q247 308 259 308 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="264" y="339">瓶颈：名人扇出、缓存失效回源；看积压、热点和尾延迟。</text><path d="M197,346 L234,346" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M105,385 L105,403" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M42 412 Q112.5 410.5 183 413 Q196 413 195 425 L194 476 Q195 489 182 488 L42 489 Q29 488 30 476 L31 424 Q30 412 42 412 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="443">55—75 秒</text><path d="M259 412 Q628.5 410.5 998 413 Q1011 413 1010 425 L1009 476 Q1010 489 997 488 L259 489 Q246 488 247 476 L248 424 Q247 412 259 412 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="264" y="443">取舍：普通用户推、名人拉；用写放大和传播延迟换读体验。</text><path d="M197,450 L234,450" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M105,489 L105,507" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M42 516 Q112.5 514.5 183 517 Q196 517 195 529 L194 580 Q195 593 182 592 L42 593 Q29 592 30 580 L31 528 Q30 516 42 516 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="547">75—90 秒</text><path d="M259 516 Q628.5 514.5 998 517 Q1011 517 1010 529 L1009 580 Q1010 593 997 592 L259 593 Q246 592 247 580 L248 528 Q247 516 259 516 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="264" y="547">演进：达到实测容量阈值再扩副本或分片，并验证故障恢复。</text><path d="M197,554 L234,554" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="36" y="658" class="small">每一段回答前一段的问题：目标是什么 → 如何满足 → 哪里受限 → 付出什么 → 何时升级。</text><text x="36" y="690" class="small">示范需录音计时；替换为支付或聊天时，必须重设正确性、顺序和延迟目标。</text></svg>