<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">SMTP 接受运输责任，不代表用户已读</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">每个阶段的成功只证明该阶段完成，不能直接推断下一个阶段</text><path d="M49 211 Q155.0 208 261 212 Q271 211 270 222 L271 345 Q270 357 260 355 L49 356 Q39 355 41 345 L39 222 Q40 211 49 211Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="155.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Web API 已排队</text><text x="155.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">本系统接到发送任务</text><path d="M359 211 Q465.0 208 571 212 Q581 211 580 222 L581 345 Q580 357 570 355 L359 356 Q349 355 351 345 L349 222 Q350 211 359 211Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="465.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">DATA 后最终 250</text><text x="465.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">该服务器承担投递责任</text><path d="M669 211 Q775.0 208 881 212 Q891 211 890 222 L891 345 Q890 357 880 355 L669 356 Q659 355 661 345 L659 222 Q660 211 669 211Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="775.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">目标邮箱保存</text><text x="775.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">可能归到垃圾邮件</text><path d="M979 211 Q1085.0 208 1191 212 Q1201 211 1200 222 L1201 345 Q1200 357 1190 355 L979 356 Q969 355 971 345 L969 222 Q970 211 979 211Z" fill="#eee8fb" stroke="#455166" stroke-width="2.5"/><text x="1085.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">客户端标记已读</text><text x="1085.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">属于另一条用户操作</text><polyline points="270,282 350,282" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="285.0" y="236" width="50" height="28" rx="4" fill="#fffdf7"/><text x="310.0" y="256" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">投递</text><polyline points="580,282 660,282" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="595.0" y="236" width="50" height="28" rx="4" fill="#fffdf7"/><text x="620.0" y="256" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">入库</text><polyline points="890,282 970,282" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="905.0" y="236" width="50" height="28" rx="4" fill="#fffdf7"/><text x="930.0" y="256" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">打开</text><path d="M74 436 Q332.5 433 591 437 Q601 436 600 447 L601 585 Q600 597 590 595 L74 596 Q64 595 66 585 L64 447 Q65 436 74 436Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="332.5" y="493.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">不能混淆的 SMTP 回复</text><text x="332.5" y="523.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">RCPT TO 后 250：接受收件人阶段</text><text x="332.5" y="553.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">DATA 后 354：允许继续发送正文</text><path d="M664 436 Q922.5 433 1181 437 Q1191 436 1190 447 L1191 585 Q1190 597 1180 595 L664 596 Q654 595 656 585 L654 447 Q655 436 664 436Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="922.5" y="493.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">完整 DATA 结束后的成功回复</text><text x="922.5" y="523.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">表示承担投递 / 中继责任</text><text x="922.5" y="553.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">仍不证明进入收件箱或被阅读</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">中继接受、目标接受、投递邮箱、已读是不同状态；各阶段都可能停留或失败。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">临时失败按策略重试，永久失败记录并通知；读回执也不是可靠的人类阅读证明。</text></g></svg>