<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">Three nights: if any night fails, the whole booking rolls back</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">Check in Sep 10, check out Sep 13: nights of the 10th, 11th, and 12th; the checkout day is not a night</text><path d="M59 131 Q620.0 128 1181 132 Q1191 131 1190 142 L1191 490 Q1190 502 1180 500 L59 501 Q49 500 51 490 L49 142 Q50 131 59 131Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="620" y="164" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">One database transaction: a hold is not yet a commit</text><path d="M99 201 Q220.0 198 341 202 Q351 201 350 212 L351 335 Q350 347 340 345 L99 346 Q89 345 91 335 L89 212 Q90 201 99 201Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="220.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Sep 10</text><text x="220.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">2 rooms left</text><text x="220.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Hold 1 → 1 left</text><path d="M489 201 Q610.0 198 731 202 Q741 201 740 212 L741 335 Q740 347 730 345 L489 346 Q479 345 481 335 L479 212 Q480 201 489 201Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="610.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Sep 11</text><text x="610.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">0 rooms left</text><text x="610.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Need 1: fail</text><path d="M879 201 Q1000.0 198 1121 202 Q1131 201 1130 212 L1131 335 Q1130 347 1120 345 L879 346 Q869 345 871 335 L869 212 Q870 201 879 201Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="1000.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Sep 12</text><text x="1000.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">4 rooms left</text><text x="1000.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Not reached / no commit</text><polyline points="350,275 480,275" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="361.5" y="231" width="107" height="28" rx="4" fill="#fffdf7"/><text x="415" y="251" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Next night</text><polyline points="610,345 610,394" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M144 398 Q620.0 395 1096 399 Q1106 398 1105 409 L1106 452 Q1105 464 1095 462 L144 463 Q134 462 136 452 L134 409 Q135 398 144 398Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="437.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Roll back earlier holds; no confirmed booking is created</text><polyline points="620,500 620,548" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M254 551 Q620.0 548 986 552 Q996 551 995 562 L996 632 Q995 644 985 642 L254 643 Q244 642 246 632 L244 562 Q245 551 254 551Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="589.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Final inventory: 2, 0, 4</text><text x="620.0" y="619.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">The whole order fails; the guest can pick other dates or a room type</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">The transaction makes the nights succeed or fail together; row locks or conditional updates prevent overselling.</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">Don’t hold inventory row locks while waiting for payment; link holds and payment with a recoverable state machine.</text></g></svg>