<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.node{font:600 19px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.label{font:16px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#35424a}.note{font:17px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#5a625f}</style><title>Token bucket: capacity governs bursts, rate governs the long term</title><desc>Capacity 20, refill rate 5 per second. Starting with 20 tokens, an instant burst of 20 leaves 0; after 1 second there are 5, after 4 seconds 20 again. Tokens cannot accumulate without limit.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">Token bucket: capacity governs bursts, rate governs the long term</text><text class="note" x="35" y="80" text-anchor="start"><tspan x="35" dy="0">Assumptions: each request costs 1 token, the bucket starts full, and no more requests follow</tspan></text><path d="M45,115 Q33,116 35,127 L36,187 Q35,198 47,197 L231,196 Q242,197 240,184 L239,126 Q240,113 228,116 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,119 L225,117 M236,130 L238,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="149" text-anchor="middle"><tspan x="137.5" dy="0">t = 0, bucket full</tspan><tspan x="137.5" dy="23">20 / 20 tokens</tspan></text><path d="M315,115 Q303,116 305,127 L306,187 Q305,198 317,197 L501,196 Q512,197 510,184 L509,126 Q510,113 498,116 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M318,119 L495,117 M506,130 L508,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="149" text-anchor="middle"><tspan x="407.5" dy="0">20 allowed at once</tspan><tspan x="407.5" dy="23">0 / 20 tokens</tspan></text><path d="M585,115 Q573,116 575,127 L576,187 Q575,198 587,197 L771,196 Q782,197 780,184 L779,126 Q780,113 768,116 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M588,119 L765,117 M776,130 L778,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="149" text-anchor="middle"><tspan x="677.5" dy="0">After 1 second</tspan><tspan x="677.5" dy="23">5 / 20 tokens</tspan></text><path d="M855,115 Q843,116 845,127 L846,187 Q845,198 857,197 L1041,196 Q1052,197 1050,184 L1049,126 Q1050,113 1038,116 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,119 L1035,117 M1046,130 L1048,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="149" text-anchor="middle"><tspan x="947.5" dy="0">After 4 seconds</tspan><tspan x="947.5" dy="23">20 / 20, full</tspan></text><path d="M240,156 L305,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,156 L575,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,156 L845,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M110,290 Q98,291 100,302 L101,362 Q100,373 112,372 L491,371 Q502,372 500,359 L499,301 Q500,288 488,291 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M113,294 L485,292 M496,305 L498,356" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="300.0" y="324" text-anchor="middle"><tspan x="300.0" dy="0">Capacity B = 20</tspan><tspan x="300.0" dy="23">Stores at most 20 instant allowances</tspan></text><path d="M610,290 Q598,291 600,302 L601,362 Q600,373 612,372 L991,371 Q1002,372 1000,359 L999,301 Q1000,288 988,291 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M613,294 L985,292 M996,305 L998,356" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="800.0" y="324" text-anchor="middle"><tspan x="800.0" dy="0">Rate r = 5 per second</tspan><tspan x="800.0" dy="23">Limits the long-term rate under steady load</tspan></text><text class="note" x="35" y="432" text-anchor="start"><tspan x="35" dy="0">Over a span Δt, the allowed total is at most about B + r × Δt, not at most r per second.</tspan></text><text class="note" x="35" y="469" text-anchor="start"><tspan x="35" dy="0">After a minute idle there are still only 20 tokens; once full, new tokens stop accumulating.</tspan></text></svg>