<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><style>.title{font:700 27px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.node{font:600 19px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.label{font:16px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#35424a}.note{font:17px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#5a625f}</style><title>Vector clock: spots concurrency, can’t pick the name</title><desc>Initial “Zhang Min” with vector 1,1; A changes it to “Zhang Ming” 2,1; B changes it to “Li Min” 1,2; neither dominates, so the business merges them, and the new write is e.g. 3,2.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="560" fill="#fffdf7"/><rect width="1100" height="560" fill="url(#paper)"/><text class="title" x="35" y="42">Vector clock: spots concurrency, can’t pick the name</text><path d="M445,93 Q433,94 435,105 L436,165 Q435,176 447,175 L676,174 Q687,175 685,162 L684,104 Q685,91 673,94 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M448,97 L670,95 M681,108 L683,159" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="560.0" y="127" text-anchor="middle"><tspan x="560.0" dy="0">Original: Zhang Min</tspan><tspan x="560.0" dy="23">Vector (A:1, B:1)</tspan></text><path d="M110,265 Q98,266 100,277 L101,337 Q100,348 112,347 L371,346 Q382,347 380,334 L379,276 Q380,263 368,266 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M113,269 L365,267 M376,280 L378,331" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="240.0" y="299" text-anchor="middle"><tspan x="240.0" dy="0">A: “Zhang Ming”</tspan><tspan x="240.0" dy="23">Vector (2,1)</tspan></text><path d="M750,265 Q738,266 740,277 L741,337 Q740,348 752,347 L1011,346 Q1022,347 1020,334 L1019,276 Q1020,263 1008,266 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M753,269 L1005,267 M1016,280 L1018,331" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="880.0" y="299" text-anchor="middle"><tspan x="880.0" dy="0">B: “Li Min”</tspan><tspan x="880.0" dy="23">Vector (1,2)</tspan></text><path d="M480,175 L480,216 L240,216 L240,265" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M635,175 L635,216 L880,216 L880,265" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="node" x="555" y="301" text-anchor="middle"><tspan x="555" dy="0">2 &gt; 1, but 1 &lt; 2</tspan><tspan x="555" dy="23">Neither dominates → concurrent</tspan></text><path d="M385,408 Q373,409 375,420 L376,480 Q375,491 387,490 L726,489 Q737,490 735,477 L734,419 Q735,406 723,409 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M388,412 L720,410 M731,423 L733,474" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="555.0" y="442" text-anchor="middle"><tspan x="555.0" dy="0">Business rule or user decides</tspan><tspan x="555.0" dy="23">Merged write, e.g. (3,2)</tspan></text><path d="M240,347 L240,449 L375,449" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M880,347 L880,449 L735,449" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="533" text-anchor="start"><tspan x="35" dy="0">(3,2) = max((2,1),(1,2)), then A adds one; you can’t splice characters from both sides into a name.</tspan></text></svg>