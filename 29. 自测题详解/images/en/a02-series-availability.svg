<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="665" viewBox="0 0 1040 665" role="img"><title>Independent chained dependencies: success must pass three gates</title><desc>Each of the chain's three required components is 99.9% available; if independent, the joint success rate is 0.999 cubed, about 99.7003%; with shared failures you cannot simply multiply.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="665" fill="#fffdf7"/><rect width="1040" height="665" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Independent chained dependencies: success must pass three gates</text><text x="35" y="86" class="small">Assumptions: same counting basis; all three must succeed; failures are independent.</text><path d="M42 119 Q175.0 117.5 308 120 Q321 120 320 132 L319 224 Q320 237 307 236 L42 237 Q29 236 30 224 L31 131 Q30 119 42 119 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="151" class="head">API service</text><text x="47" y="183">Availability = 99.9%</text><text x="47" y="211">P(success) = 0.999</text><path d="M387 119 Q520.0 117.5 653 120 Q666 120 665 132 L664 224 Q665 237 652 236 L387 237 Q374 236 375 224 L376 131 Q375 119 387 119 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="392" y="151" class="head">Database</text><text x="392" y="183">Availability = 99.9%</text><text x="392" y="211">P(success) = 0.999</text><path d="M732 119 Q865.0 117.5 998 120 Q1011 120 1010 132 L1009 224 Q1010 237 997 236 L732 237 Q719 236 720 224 L721 131 Q720 119 732 119 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="737" y="151" class="head">Payment gateway</text><text x="737" y="183">Availability = 99.9%</text><text x="737" y="211">P(success) = 0.999</text><path d="M322,177 L362,177" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M667,177 L707,177" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M865,238 L865,278 L520,278 L520,309" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M102 324 Q520.0 322.5 938 325 Q951 325 950 337 L949 441 Q950 454 937 453 L102 454 Q89 453 90 441 L91 336 Q90 324 102 324 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="107" y="356" class="head">Chain succeeds = API ok ∩ database ok ∩ payment ok</text><text x="107" y="388">A = 0.999 × 0.999 × 0.999 = 0.997002999 ≈ 99.7003%</text><text x="107" y="416">Yearly downtime ≈ 8,760 hours × (1 − A) ≈ 26.25 hours</text><path d="M42 499 Q520.0 497.5 998 500 Q1011 500 1010 512 L1009 615 Q1010 628 997 627 L42 628 Q29 627 30 615 L31 511 Q30 499 42 499 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="531" class="head">Boundary: shared power / data center / DNS → failures may be correlated</text><text x="47" y="563">Always failing together? Don't multiply. Redundancy and degradation change the condition too.</text><text x="47" y="591">Map dependencies and failure domains first; then choose intersection, redundancy, or measurement.</text></svg>