<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img"><title>Read-your-writes: never read older than your own write</title><desc>The nickname write lands on the primary at version 42 while the async replica is still at 41; a read that carries minimum version 42 must not return version 41.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="710" fill="#fffdf7"/><rect width="1040" height="710" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Read-your-writes: never read older than your own write</text><path d="M42 91 Q165.0 89.5 288 92 Q301 92 300 104 L299 192 Q300 205 287 204 L42 205 Q29 204 30 192 L31 103 Q30 91 42 91 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="123" class="head">Change nickname</text><text x="47" y="155">A → B</text><text x="47" y="183">Write request</text><path d="M301,148 L383,148" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="308" y="128" class="small">Commit</text><path d="M408 91 Q535.0 89.5 662 92 Q675 92 674 104 L673 192 Q674 205 661 204 L408 205 Q395 204 396 192 L397 103 Q396 91 408 91 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="123" class="head">Primary: version 42</text><text x="413" y="155">nickname = B; committed</text><text x="413" y="183">Response carries v42</text><path d="M676,148 L754,148" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="680" y="127" class="small">Async</text><path d="M779 91 Q888.5 89.5 998 92 Q1011 92 1010 104 L1009 192 Q1010 205 997 204 L779 205 Q766 204 767 192 L768 103 Q767 91 779 91 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="784" y="123" class="head">Replica: still v41</text><text x="784" y="155">nickname = A</text><text x="784" y="183">Write not applied yet</text><path d="M160,205 L160,290" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="180" y="257" class="small">Later reads carry the write's version</text><path d="M42 304 Q178.5 302.5 315 305 Q328 305 327 317 L326 398 Q327 411 314 410 L42 411 Q29 410 30 398 L31 316 Q30 304 42 304 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="336" class="head">Read the profile</text><text x="47" y="368">min_version = 42</text><text x="47" y="396">Cache must meet it too</text><path d="M329,357 L384,357" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M408 304 Q703.0 302.5 998 305 Q1011 305 1010 317 L1009 398 Q1010 411 997 410 L408 411 Q395 410 396 398 L397 316 Q396 304 408 304 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="336" class="head">Check replica progress: 41 &lt; 42, can't return A</text><text x="413" y="368">Must see at least B, or a newer committed version.</text><path d="M539,411 L539,486" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="552" y="461" class="small">Can wait</text><path d="M870,411 L870,486" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="882" y="461" class="small">Wait times out</text><path d="M408 500 Q541.5 498.5 675 501 Q688 501 687 513 L686 587 Q687 600 674 599 L408 600 Q395 599 396 587 L397 512 Q396 500 408 500 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="532" class="head">Wait for v42</text><text x="413" y="564">Position ok, then read</text><path d="M732 500 Q865.0 498.5 998 501 Q1011 501 1010 513 L1009 587 Q1010 600 997 599 L732 600 Q719 599 720 587 L721 512 Q720 500 732 500 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="737" y="532" class="head">Read primary or fail</text><text x="737" y="564">No silent stale reads</text><path d="M42 637 Q520.0 635.5 998 638 Q1011 638 1010 650 L1009 678 Q1010 691 997 690 L42 691 Q29 690 30 678 L31 649 Q30 637 42 637 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="659" class="small">A fixed “read the primary for 1 second after a write” is not a strict guarantee:</text><text x="47" y="681" class="small">replication lag can run longer, and a failover can lose writes that were not yet replicated.</text></svg>