<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img"><title>Powers of 2: count the values first, then add the byte unit</title><desc>2 to the 30th power is 1024 cubed, 1073741824; 1 GiB is that many bytes, which is not the decimal 1 GB.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="650" fill="#fffdf7"/><rect width="1040" height="650" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Powers of 2: count the values first, then add the byte unit</text><path d="M42 88 Q170.0 86.5 298 89 Q311 89 310 101 L309 187 Q310 200 297 199 L42 200 Q29 199 30 187 L31 100 Q30 88 42 88 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="120" class="head">One step per 10 bits</text><text x="47" y="152">2¹⁰ = 1,024</text><text x="47" y="180">about 10³</text><path d="M312,143 L367,143" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="317" y="123" class="small">square</text><path d="M392 88 Q520.0 86.5 648 89 Q661 89 660 101 L659 187 Q660 200 647 199 L392 200 Q379 199 380 187 L381 100 Q380 88 392 88 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="397" y="120" class="head">20 bits: millions</text><text x="397" y="152">2²⁰ = 1,048,576</text><text x="397" y="180">about 10⁶</text><path d="M662,143 L717,143" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="671" y="122" class="small">×1024</text><path d="M742 88 Q870.0 86.5 998 89 Q1011 89 1010 101 L1009 187 Q1010 200 997 199 L742 200 Q729 199 730 187 L731 100 Q730 88 742 88 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="747" y="120" class="head">30 bits: billions</text><text x="747" y="152">2³⁰ = 1,073,741,824</text><text x="747" y="180">about 10⁹</text><path d="M870,201 L870,247 L520,247 L520,289" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="522" y="237" class="small">Add the unit B to talk capacity</text><path d="M112 304 Q520.0 302.5 928 305 Q941 305 940 317 L939 421 Q940 434 927 433 L112 434 Q99 433 100 421 L101 316 Q100 304 112 304 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="117" y="336" class="head">Binary vs. decimal capacity</text><text x="117" y="368">1 GiB = 2³⁰ B = 1,073,741,824 B ≈ 1.074 GB</text><text x="117" y="396">1 GB  = 10⁹ B = 1,000,000,000 B ≈ 0.931 GiB</text><text x="117" y="424">Different unit names, different byte counts.</text><path d="M42 480 Q520.0 478.5 998 481 Q1011 481 1010 493 L1009 598 Q1010 611 997 610 L42 611 Q29 610 30 598 L31 492 Q30 480 42 480 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="512" class="head">With 8 B records, how many fit in 1 GiB of raw space?</text><text x="47" y="544">2³⁰ B ÷ 8 B/record = 2²⁷ records = 134,217,728 records</text><text x="47" y="572">Indexes, object headers, allocation, and replicas are not counted. It is not a billion records.</text></svg>