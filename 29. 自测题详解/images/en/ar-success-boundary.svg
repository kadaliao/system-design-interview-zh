<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="635" viewBox="0 0 1160 635" role="img"><title>R-01 | Order created and payment succeeded are two commit boundaries</title><desc>After validation, one local transaction writes the order, reserves inventory, and writes the outbox. Only the commit returns pending payment; the order becomes paid after a background task confirms the PSP result and posts the ledger entry.</desc><rect width="1160" height="635" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:21px;font-weight:bold}.p{font-size:18px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">R-01 | Order created and payment succeeded are two commit boundaries</text><rect x="40" y="110" width="280" height="120" fill="#fff0cc" class="box"/><text x="56" y="143" class="t b">1. Intake and validation</text><text x="56" y="175" class="t p">Identity, price, quantity</text><text x="56" y="203" class="t p">Stable checkout_id</text><rect x="440" y="110" width="300" height="120" fill="#fff0cc" class="box"/><text x="456" y="143" class="t b">2. Local commit</text><text x="456" y="175" class="t p">Order + inventory hold</text><text x="456" y="203" class="t p">+ outbox, all or nothing</text><rect x="850" y="110" width="270" height="120" fill="#e2eee8" class="box"/><text x="866" y="143" class="t b">3. Return created</text><text x="866" y="175" class="t p">HTTP 201: pending pay</text><text x="866" y="203" class="t p">Not yet ready to ship</text><path d="M320 170 L440 170" class="a"/><path d="M740 170 L850 170" class="a"/><path d="M590 230 L590 285 L180 285 L180 355" class="a"/><rect x="40" y="355" width="280" height="120" fill="#fff0cc" class="box"/><text x="56" y="388" class="t b">Background outbox send</text><text x="56" y="420" class="t p">Safe to resend; dedupe</text><text x="56" y="448" class="t p">Holds no order DB locks</text><rect x="440" y="355" width="300" height="120" fill="#e6e6f2" class="box"/><text x="456" y="388" class="t b">PSP confirms payment</text><text x="456" y="420" class="t p">Verified webhook / query</text><text x="456" y="448" class="t p">Ignore browser redirect</text><rect x="850" y="355" width="270" height="120" fill="#e2eee8" class="box"/><text x="866" y="388" class="t b">Money and order done</text><text x="866" y="420" class="t p">Idempotent ledger; paid</text><text x="866" y="448" class="t p">Then trigger fulfillment</text><path d="M320 415 L440 415" class="a"/><path d="M740 415 L850 415" class="a"/><text x="40" y="542" class="t p">A network timeout after commit may only mean the response was lost: query the order or retry with the original key.</text><text x="40" y="587" class="t p">A success response must say which fact now holds; never present “accepted” as “paid.”</text></svg>