<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img"><title>Queue redelivery: duplicate message, single effect</title><desc>The dedup record for event E7 and the +10 points commit in one transaction; the missing ack after commit triggers redelivery, and reprocessing skips the work already done.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="710" fill="#fffdf7"/><rect width="1040" height="710" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Queue redelivery: duplicate message, single effect</text><path d="M82 88 Q195.0 86.5 308 89 Q321 89 320 101 L319 204 Q320 217 307 216 L82 217 Q69 216 70 204 L71 100 Q70 88 82 88 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="87" y="120" class="head">Queue delivers E7</text><text x="87" y="152">Reward 10 points</text><text x="87" y="180">Awaiting consumer ack</text><path d="M322,154 L369,154" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="324" y="134" class="small">1st</text><path d="M394 88 Q696.0 86.5 998 89 Q1011 89 1010 101 L1009 204 Q1010 217 997 216 L394 217 Q381 216 382 204 L383 100 Q382 88 394 88 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="399" y="120" class="head">One database transaction</text><text x="399" y="152">INSERT processed_events(E7) — unique constraint</text><text x="399" y="180">Account +10 points; COMMIT both together</text><path d="M807,218 L807,258" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M642 273 Q820.0 271.5 998 274 Q1011 274 1010 286 L1009 367 Q1010 380 997 379 L642 380 Q629 379 630 367 L631 285 Q630 273 642 273 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="647" y="305" class="head">Crash after commit</text><text x="647" y="337">+10 applied, ack not delivered</text><text x="647" y="365">Queue can't know it's done</text><path d="M162,218 L162,405" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="183" y="326" class="small">Unacked → same E7 redelivered</text><path d="M82 421 Q195.0 419.5 308 422 Q321 422 320 434 L319 511 Q320 524 307 523 L82 524 Q69 523 70 511 L71 433 Q70 421 82 421 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="87" y="453" class="head">E7 received again</text><text x="87" y="485">Same business event ID</text><path d="M322,472 L369,472" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="324" y="452" class="small">2nd</text><path d="M394 421 Q696.0 419.5 998 422 Q1011 422 1010 434 L1009 511 Q1010 524 997 523 L394 524 Q381 523 382 511 L383 433 Q382 421 394 421 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="399" y="453" class="head">E7 already processed → skip account update</text><text x="399" y="485">Read the finished result; no second +10; now safe to ack</text><path d="M692,524 L692,574 L30,574 L30,176 L60,176" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="110" y="561" class="small">Ack succeeds: back to the queue, delivery done</text><path d="M42 620 Q520.0 618.5 998 621 Q1011 621 1010 633 L1009 674 Q1010 687 997 686 L42 687 Q29 686 30 674 L31 632 Q30 620 42 620 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="651" class="small">External email/payment calls aren't in this transaction: use idempotency keys, reconciliation, or compensation.</text><text x="47" y="679" class="small">Keep dedup records longer than the replay window; acking before processing risks losing tasks.</text></svg>