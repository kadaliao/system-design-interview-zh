<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><title>Three new copies, yet a stale metadata cache returns the old object</title><desc>O2 is on three data nodes and K → O2 is committed, but a later GET through a stale cache still reads O1.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">Three new copies exist, but not every read is correct</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">The counterexample starts the GET only after the PUT returns, removing any ambiguity from overlap</text><path d="M44 156 Q167.5 153 291 157 Q301 156 300 167 L301 280 Q300 292 290 290 L44 291 Q34 290 36 280 L34 167 Q35 156 44 156Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="167.5" y="200.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">PUT K = O2 succeeded</text><text x="167.5" y="230.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Authoritative: K → O2</text><text x="167.5" y="260.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Success already returned</text><path d="M419 136 Q805.0 133 1191 137 Q1201 136 1200 147 L1201 310 Q1200 322 1190 320 L419 321 Q409 320 411 310 L409 147 Q410 136 419 136Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="805" y="175" font-size="24" text-anchor="middle" font-weight="600" fill="#263244">O2 synced to three data nodes</text><path d="M444 201 Q550.0 198 656 202 Q666 201 665 212 L666 280 Q665 292 655 290 L444 291 Q434 290 436 280 L434 212 Q435 201 444 201Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="550.0" y="238.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Node A</text><text x="550.0" y="268.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">New object O2</text><path d="M699 201 Q805.0 198 911 202 Q921 201 920 212 L921 280 Q920 292 910 290 L699 291 Q689 290 691 280 L689 212 Q690 201 699 201Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="805.0" y="238.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Node B</text><text x="805.0" y="268.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">New object O2</text><path d="M954 201 Q1060.0 198 1166 202 Q1176 201 1175 212 L1176 280 Q1175 292 1165 290 L954 291 Q944 290 946 280 L944 212 Q945 201 954 201Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="1060.0" y="238.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Node C</text><text x="1060.0" y="268.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">New object O2</text><polyline points="300,223 410,223" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="55,367 1190,367" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="414.5" y="340" width="411" height="28" rx="4" fill="#fffdf7"/><text x="620" y="360" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Real time: PUT completes, then GET starts</text><path d="M49 451 Q170.0 448 291 452 Q301 451 300 462 L301 560 Q300 572 290 570 L49 571 Q39 570 41 560 L39 462 Q40 451 49 451Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="170.0" y="503.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Then GET K</text><text x="170.0" y="533.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Should read O2 or newer</text><path d="M479 451 Q620.0 448 761 452 Q771 451 770 462 L771 560 Q770 572 760 570 L479 571 Q469 570 471 560 L469 462 Q470 451 479 451Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="503.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Stale metadata cache</text><text x="620.0" y="533.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Still returns K → O1</text><path d="M949 451 Q1067.5 448 1186 452 Q1196 451 1195 462 L1196 560 Q1195 572 1185 570 L949 571 Q939 570 941 560 L939 462 Q940 451 949 451Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="1067.5" y="503.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Read the old object O1</text><text x="1067.5" y="533.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Violates linearizability</text><polyline points="300,510 470,510" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="331.5" y="468" width="107" height="28" rx="4" fill="#fffdf7"/><text x="385" y="488" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Look up K</text><polyline points="770,510 940,510" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="793" y="468" width="124" height="28" rx="4" fill="#fffdf7"/><text x="855" y="488" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Stale map</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">Sync replicas protect durability; linearizability also needs write order, a commit point, correct reads, and fencing.</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">Counting replicas, or citing R + W &gt; N alone, does not prove the read/write semantics of a full protocol.</text></g></svg>