<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><style>.title{font:700 27px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.node{font:600 19px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.label{font:16px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#35424a}.note{font:17px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#5a625f}</style><title>Snowflake: no repeat tickets in a millisecond, brake when time rewinds</title><desc>When now is later than last, reset the sequence; in the same millisecond, increment it and wait once 4096 are used up; when the clock is behind last, wait or reject and alert.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="620" fill="#fffdf7"/><rect width="1100" height="620" fill="url(#paper)"/><text class="title" x="35" y="42">Snowflake: no repeat tickets in a millisecond, brake when time rewinds</text><text class="note" x="35" y="80" text-anchor="start"><tspan x="35" dy="0">On one machine, the time check, sequence update, and save must run under one lock</tspan></text><path d="M385,110 Q373,111 375,122 L376,182 Q375,193 387,192 L716,191 Q727,192 725,179 L724,121 Q725,108 713,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M388,114 L710,112 M721,125 L723,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="550.0" y="144" text-anchor="middle"><tspan x="550.0" dy="0">Read now and lastTimestamp</tspan><tspan x="550.0" dy="23">Compare times, check seq</tspan></text><path d="M45,300 Q33,301 35,312 L36,372 Q35,383 47,382 L296,381 Q307,382 305,369 L304,311 Q305,298 293,301 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M48,304 L290,302 M301,315 L303,366" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="170.0" y="334" text-anchor="middle"><tspan x="170.0" dy="0">now &gt; last</tspan><tspan x="170.0" dy="23">new ms: seq = 0</tspan></text><path d="M425,300 Q413,301 415,312 L416,372 Q415,383 427,382 L676,381 Q687,382 685,369 L684,311 Q685,298 673,301 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M428,304 L670,302 M681,315 L683,366" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="550.0" y="334" text-anchor="middle"><tspan x="550.0" dy="0">now = last</tspan><tspan x="550.0" dy="23">if seq &lt; 4095, seq++</tspan></text><path d="M805,300 Q793,301 795,312 L796,372 Q795,383 807,382 L1056,381 Q1067,382 1065,369 L1064,311 Q1065,298 1053,301 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M808,304 L1050,302 M1061,315 L1063,366" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="930.0" y="334" text-anchor="middle"><tspan x="930.0" dy="0">now &lt; last</tspan><tspan x="930.0" dy="23">wait / reject + alert</tspan></text><path d="M430,192 L430,243 L170,243 L170,300" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550,192 L550,300" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M670,192 L670,243 L930,243 L930,300" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M385,442 Q373,443 375,454 L376,514 Q375,525 387,524 L716,523 Q727,524 725,511 L724,453 Q725,440 713,443 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M388,446 L710,444 M721,457 L723,508" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="550.0" y="476" text-anchor="middle"><tspan x="550.0" dy="0">Same ms, seq already 4095</tspan><tspan x="550.0" dy="23">4097th request waits or is rejected</tspan></text><path d="M550,382 L550,442" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="590.0" y="403" width="70" height="22" rx="5" fill="#fffdf7"/><text class="label" x="625" y="420" text-anchor="middle"><tspan x="625" dy="0">if full</tspan></text><text class="note" x="35" y="568" text-anchor="start"><tspan x="35" dy="0">Never wrap an exhausted sequence to 0, and never treat an earlier millisecond after rollback as new time.</tspan></text><text class="note" x="35" y="601" text-anchor="start"><tspan x="35" dy="0">A logical-time scheme needs extra design: persisted state, capacity limit, restarts, and machine ID reuse.</tspan></text></svg>