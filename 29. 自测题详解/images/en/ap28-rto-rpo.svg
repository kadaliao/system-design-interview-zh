<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img"><title>P28-03 | RTO is recovery time, RPO is the data gap</title><desc>Example 5 s RTO budget: 0.5 s detection, 1 s election and fencing, 2 s log catch-up, 1.5 s verification and reopening; zero RPO for acknowledged trades needs durable replication guaranteed before acknowledgement.</desc><rect width="1160" height="670" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:21px;font-weight:bold}.p{font-size:18px}.s{font-size:16px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P28-03 | RTO is recovery time, RPO is the data gap</text><text x="40" y="108" class="t b">Example RTO target: restore a verified trading service within 5 s of a single-machine failure</text><rect x="40" y="155" width="100" height="110" fill="#ffe5dd" stroke="#344d61" stroke-width="2"/><text x="52" y="196" class="t p">Detect</text><text x="52" y="231" class="t p">0.5 s</text><rect x="140" y="155" width="200" height="110" fill="#fff0cc" stroke="#344d61" stroke-width="2"/><text x="152" y="196" class="t p">Elect + fence</text><text x="152" y="231" class="t p">1 s</text><rect x="340" y="155" width="400" height="110" fill="#e6e6f2" stroke="#344d61" stroke-width="2"/><text x="352" y="196" class="t p">Catch up + rebuild state</text><text x="352" y="231" class="t p">2 s</text><rect x="740" y="155" width="300" height="110" fill="#e2eee8" stroke="#344d61" stroke-width="2"/><text x="752" y="196" class="t p">Verify + open gateway</text><text x="752" y="231" class="t p">1.5 s</text><text x="40" y="300" class="t s">0</text><text x="140" y="300" class="t s">0.5</text><text x="340" y="300" class="t s">1.5</text><text x="740" y="300" class="t s">3.5</text><text x="1040" y="300" class="t s">5 s</text><text x="40" y="365" class="t b">RPO asks how much of the acknowledged log survives</text><rect x="40" y="405" width="600" height="110" fill="#e2eee8" class="box"/><text x="56" y="438" class="t b">Acknowledged: 98 → 99 → 100</text><text x="56" y="470" class="t p">Target RPO = 0: these acknowledged facts must be kept in full</text><rect x="740" y="405" width="360" height="110" fill="#fff0cc" class="box"/><text x="756" y="438" class="t b">101: not yet acknowledged</text><text x="756" y="470" class="t p">Look up the result / retry by ID</text><text x="756" y="498" class="t p">Don’t declare it a success</text><text x="40" y="568" class="t p">A 5 s RTO doesn’t allow losing 5 s of trades; an async remote replica’s RPO follows its real replication promise.</text><text x="40" y="617" class="t p">With a log gap or dual-primary risk, halt and investigate even if the recovery target is exceeded.</text></svg>