<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><title>8+4 erasure coding of an 800 MB object</title><desc>8 data shards plus 4 parity shards of 100 MB each give 1200 MB in total, 1.5 times the original.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">8 + 4 erasure coding: the denominator is the original 8</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">Example: 800 MB object; ignores metadata, alignment padding, and repair scratch space</text><text x="412" y="151" font-size="24" text-anchor="middle" font-weight="600" fill="#263244">8 data shards × 100 MB</text><text x="1005" y="151" font-size="24" text-anchor="middle" font-weight="600" fill="#263244">4 parity shards × 100 MB</text><path d="M54 186 Q128.0 183 202 187 Q212 186 211 197 L212 269 Q211 281 201 279 L54 280 Q44 279 46 269 L44 197 Q45 186 54 186Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="128.0" y="225.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D1</text><text x="128.0" y="255.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M244 186 Q318.0 183 392 187 Q402 186 401 197 L402 269 Q401 281 391 279 L244 280 Q234 279 236 269 L234 197 Q235 186 244 186Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="318.0" y="225.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D2</text><text x="318.0" y="255.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M434 186 Q508.0 183 582 187 Q592 186 591 197 L592 269 Q591 281 581 279 L434 280 Q424 279 426 269 L424 197 Q425 186 434 186Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="508.0" y="225.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D3</text><text x="508.0" y="255.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M624 186 Q698.0 183 772 187 Q782 186 781 197 L782 269 Q781 281 771 279 L624 280 Q614 279 616 269 L614 197 Q615 186 624 186Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="698.0" y="225.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D4</text><text x="698.0" y="255.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M54 316 Q128.0 313 202 317 Q212 316 211 327 L212 399 Q211 411 201 409 L54 410 Q44 409 46 399 L44 327 Q45 316 54 316Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="128.0" y="355.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D5</text><text x="128.0" y="385.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M244 316 Q318.0 313 392 317 Q402 316 401 327 L402 399 Q401 411 391 409 L244 410 Q234 409 236 399 L234 327 Q235 316 244 316Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="318.0" y="355.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D6</text><text x="318.0" y="385.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M434 316 Q508.0 313 582 317 Q592 316 591 327 L592 399 Q591 411 581 409 L434 410 Q424 409 426 399 L424 327 Q425 316 434 316Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="508.0" y="355.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D7</text><text x="508.0" y="385.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M624 316 Q698.0 313 772 317 Q782 316 781 327 L782 399 Q781 411 771 409 L624 410 Q614 409 616 399 L614 327 Q615 316 624 316Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="698.0" y="355.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Data D8</text><text x="698.0" y="385.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M829 186 Q903.0 183 977 187 Q987 186 986 197 L987 269 Q986 281 976 279 L829 280 Q819 279 821 269 L819 197 Q820 186 829 186Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="903.0" y="225.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Parity P1</text><text x="903.0" y="255.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M1024 186 Q1098.0 183 1172 187 Q1182 186 1181 197 L1182 269 Q1181 281 1171 279 L1024 280 Q1014 279 1016 269 L1014 197 Q1015 186 1024 186Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="1098.0" y="225.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Parity P2</text><text x="1098.0" y="255.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M829 316 Q903.0 313 977 317 Q987 316 986 327 L987 399 Q986 411 976 409 L829 410 Q819 409 821 399 L819 327 Q820 316 829 316Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="903.0" y="355.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Parity P3</text><text x="903.0" y="385.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M1024 316 Q1098.0 313 1172 317 Q1182 316 1181 327 L1182 399 Q1181 411 1171 409 L1024 410 Q1014 409 1016 399 L1014 327 Q1015 316 1024 316Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="1098.0" y="355.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Parity P4</text><text x="1098.0" y="385.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100 MB</text><path d="M99 481 Q620.0 478 1141 482 Q1151 481 1150 492 L1151 605 Q1150 617 1140 615 L99 616 Q89 615 91 605 L89 492 Q90 481 99 481Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="525.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Total = 12 × 100 MB = 1200 MB</text><text x="620.0" y="555.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Storage amplification = 12 / 8 = 1.5×; extra overhead = 4 / 8 = 50%</text><text x="620.0" y="585.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Full 3 replicas take 2400 MB; 8+4 takes half of that here</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">With a suitable 12/8 MDS code, any 8 valid shards recover the data; up to 4 located losses are tolerated.</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">A single failure that takes out 5 shards is not recoverable; the space ratio alone does not prove any number of “nines.”</text></g></svg>