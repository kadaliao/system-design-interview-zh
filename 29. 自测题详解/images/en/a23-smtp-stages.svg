<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">SMTP Accepts Transport, Not a Read</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">Each success proves only its own stage, never the next one</text><path d="M49 211 Q155.0 208 261 212 Q271 211 270 222 L271 345 Q270 357 260 355 L49 356 Q39 355 41 345 L39 222 Q40 211 49 211Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="155.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Web API queued</text><text x="155.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">This system got the task</text><path d="M359 211 Q465.0 208 571 212 Q581 211 580 222 L581 345 Q580 357 570 355 L359 356 Q349 355 351 345 L349 222 Q350 211 359 211Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="465.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Final 250 after DATA</text><text x="465.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Server owns delivery</text><path d="M669 211 Q775.0 208 881 212 Q891 211 890 222 L891 345 Q890 357 880 355 L669 356 Q659 355 661 345 L659 222 Q660 211 669 211Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="775.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Stored at destination</text><text x="775.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">May land in spam</text><path d="M979 211 Q1085.0 208 1191 212 Q1201 211 1200 222 L1201 345 Q1200 357 1190 355 L979 356 Q969 355 971 345 L969 222 Q970 211 979 211Z" fill="#eee8fb" stroke="#455166" stroke-width="2.5"/><text x="1085.0" y="275.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Client marks read</text><text x="1085.0" y="305.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">A separate user action</text><polyline points="270,282 350,282" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="285.0" y="236" width="50" height="28" rx="4" fill="#fffdf7"/><text x="310.0" y="256" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Relay</text><polyline points="580,282 660,282" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="595.0" y="236" width="50" height="28" rx="4" fill="#fffdf7"/><text x="620.0" y="256" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Store</text><polyline points="890,282 970,282" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="905.0" y="236" width="50" height="28" rx="4" fill="#fffdf7"/><text x="930.0" y="256" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Open</text><path d="M74 436 Q332.5 433 591 437 Q601 436 600 447 L601 585 Q600 597 590 595 L74 596 Q64 595 66 585 L64 447 Q65 436 74 436Z" fill="#edf0f4" stroke="#455166" stroke-width="2.5"/><text x="332.5" y="493.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">SMTP replies not to confuse</text><text x="332.5" y="523.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">250 after RCPT TO: recipient accepted</text><text x="332.5" y="553.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">354 after DATA: go ahead, send body</text><path d="M664 436 Q922.5 433 1181 437 Q1191 436 1190 447 L1191 585 Q1190 597 1180 595 L664 596 Q654 595 656 585 L654 447 Q655 436 664 436Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="922.5" y="493.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Success after complete DATA</text><text x="922.5" y="523.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Owns delivery / relay</text><text x="922.5" y="553.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Still no proof of inbox or read</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">Relay accepted, destination accepted, in mailbox, and read are different states; each can stall or fail.</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">Retry temporary failures by policy; record and notify permanent ones. A read receipt is no reliable proof a human read it.</text></g></svg>