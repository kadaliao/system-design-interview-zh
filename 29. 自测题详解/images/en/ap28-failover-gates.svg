<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="635" viewBox="0 0 1160 635" role="img"><title>P28-01/02 | Exchange failover: prove it is safe, then resume commitments</title><desc>A suspected failure triggers a pause; a legitimate majority elects a primary with a new term, the old primary is fenced off, the contiguous committed log is restored, and state and outbound deduplication are verified; if any condition fails, halt trading.</desc><rect width="1160" height="635" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:21px;font-weight:bold}.p{font-size:18px}.s{font-size:16px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P28-01/02 | Exchange failover: prove it is safe, then resume commitments</text><rect x="40" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="56" y="163" class="t b">① Valid leadership</text><text x="56" y="195" class="t p">Majority + new term</text><text x="56" y="223" class="t p">Log passes the check</text><rect x="320" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="336" y="163" class="t b">② Fence old primary</text><text x="336" y="195" class="t p">Fencing at the receiver</text><text x="336" y="223" class="t p">Old terms rejected</text><rect x="600" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="616" y="163" class="t b">③ Restore state</text><text x="616" y="195" class="t p">Committed log, no gaps</text><text x="616" y="223" class="t p">Book + frozen funds</text><rect x="880" y="130" width="240" height="145" fill="#e2eee8" class="box"/><text x="896" y="163" class="t b">④ Verify outputs</text><text x="896" y="195" class="t p">Dedupe order/trade IDs</text><text x="896" y="223" class="t p">Resume at last publish</text><path d="M280 202 L320 202" class="a"/><path d="M560 202 L600 202" class="a"/><path d="M840 202 L880 202" class="a"/><rect x="40" y="355" width="715" height="100" fill="#ffe5dd" class="box"/><text x="56" y="388" class="t b">Any gate fails → keep trading paused</text><text x="56" y="420" class="t p">Timeouts are only suspicion; the top local sequence may be uncommitted</text><rect x="830" y="355" width="290" height="100" fill="#e2eee8" class="box"/><text x="846" y="388" class="t b">All pass → reopen</text><text x="846" y="420" class="t p">Ordered in, unique out</text><path d="M1000 275 L1000 355" class="a"/><text x="40" y="521" class="t p">Either replica may get retries: reuse the original order and trade IDs; replay must not create a second trade.</text><text x="40" y="575" class="t p">Resent reports may arrive twice and receivers dedupe by ID; with no provable single primary, stay halted.</text></svg>