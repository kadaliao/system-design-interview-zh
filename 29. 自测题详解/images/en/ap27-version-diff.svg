<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img"><title>P27-03 | Old vs. new replay: find the first divergent event</title><desc>The same snapshot and events go into isolated old and new reducers; balances, frozen amounts, entries, and sequence numbers are then compared per event. No external side effects during replay.</desc><rect width="1160" height="670" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P27-03 | Old vs. new replay: find the first divergent event</text><rect x="40" y="255" width="260" height="150" fill="#fff0cc" class="box"/><text x="56" y="288" class="t b">Frozen inputs</text><text x="56" y="320" class="t p">Snapshot + seq range</text><text x="56" y="348" class="t p">Events + rule versions</text><text x="56" y="376" class="t p">Frozen time and rates</text><rect x="420" y="110" width="280" height="130" fill="#e6e6f2" class="box"/><text x="436" y="143" class="t b">Old-version reducer</text><text x="436" y="175" class="t p">Isolated store A</text><text x="436" y="203" class="t p">Replay by event version</text><rect x="420" y="450" width="280" height="130" fill="#e2eee8" class="box"/><text x="436" y="483" class="t b">New-version reducer</text><text x="436" y="515" class="t p">Isolated store B</text><text x="436" y="543" class="t p">Replay by event version</text><rect x="840" y="255" width="280" height="150" fill="#fff0cc" class="box"/><text x="856" y="288" class="t b">Per-event diff</text><text x="856" y="320" class="t p">Balance / frozen / entries</text><text x="856" y="348" class="t p">Seq / rejection reason</text><text x="856" y="376" class="t p">Find the first divergence</text><path d="M300 300 L355 300 L355 175 L420 175" class="a"/><path d="M300 355 L355 355 L355 515 L420 515" class="a"/><path d="M700 175 L765 175 L765 300 L840 300" class="a"/><path d="M700 515 L800 515 L800 355 L840 355" class="a"/><text x="40" y="477" class="t b">No external side effects</text><text x="40" y="512" class="t p">No payments, no notifications</text><text x="40" y="547" class="t p">No re-running real commands</text><text x="40" y="624" class="t p">Optimizations keep semantics; rule changes need a version and expected diffs.</text></svg>