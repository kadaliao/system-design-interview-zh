<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><title>After a commit timeout: verify, then reclaim</title><desc>O9 bytes are written and the metadata commit times out; verify the commit state first, and treat the object as an orphan candidate only if it was not committed.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">Metadata commit timed out: verify first, don’t delete bytes yet</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">Bytes written without a visible reference may be an orphan; a lost response can also hide a successful commit</text><path d="M44 156 Q175.0 153 306 157 Q316 156 315 167 L316 275 Q315 287 305 285 L44 286 Q34 285 36 275 L34 167 Q35 156 44 156Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="175.0" y="213.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">O9 bytes written</text><text x="175.0" y="243.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Replicas are durable</text><path d="M454 156 Q597.5 153 741 157 Q751 156 750 167 L751 275 Q750 287 740 285 L454 286 Q444 285 446 275 L444 167 Q445 156 454 156Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="597.5" y="213.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Try to commit metadata</text><text x="597.5" y="243.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">photo.jpg → O9</text><path d="M914 156 Q1050.0 153 1186 157 Q1196 156 1195 167 L1196 275 Q1195 287 1185 285 L914 286 Q904 285 906 275 L904 167 Q905 156 914 156Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="1050.0" y="213.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Connection drop / timeout</text><text x="1050.0" y="243.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Outcome not yet known</text><polyline points="315,220 445,220" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="750,220 905,220" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M454 356 Q597.5 353 741 357 Q751 356 750 367 L751 450 Q750 462 740 460 L454 461 Q444 460 446 450 L444 367 Q445 356 454 356Z" fill="#eee8fb" stroke="#455166" stroke-width="2.5"/><text x="597.5" y="400.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Verify by upload_id</text><text x="597.5" y="430.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Idempotent query / retry</text><polyline points="1050,285 1050,408 750,408" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="874.5" y="368" width="69" height="28" rx="4" fill="#fffdf7"/><text x="909" y="388" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Query</text><path d="M74 536 Q240.0 533 406 537 Q416 536 415 547 L416 630 Q415 642 405 640 L74 641 Q64 640 66 630 L64 547 Q65 536 74 536Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="240.0" y="580.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Committed: valid object</text><text x="240.0" y="610.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Keep O9; return original result</text><path d="M834 521 Q1010.0 518 1186 522 Q1196 521 1195 532 L1196 650 Q1195 662 1185 660 L834 661 Q824 660 826 650 L824 532 Q825 521 834 521Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="1010.0" y="568.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Not committed: orphan candidate</text><text x="1010.0" y="598.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">Past grace period, no references,</text><text x="1010.0" y="628.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">no active upload; recheck, then reclaim</text><polyline points="445,408 240,408 240,535" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="185" y="465" width="110" height="28" rx="4" fill="#fffdf7"/><text x="240" y="485" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Committed</text><polyline points="600,460 600,488 1010,488 1010,520" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="729" y="463" width="130" height="28" rx="4" fill="#fffdf7"/><text x="794" y="483" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">Not committed</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">No reference now does not mean none ever; postpone destructive GC while metadata is unavailable.</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">An overwritten version may still be retained or read in flight; switching references is not reclaiming bytes.</text></g></svg>