<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><style>.title{font:700 27px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.node{font:600 19px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.label{font:16px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#35424a}.note{font:17px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#5a625f}</style><title>Quorum overlap doesn’t stop “read 1, then read 0”</title><desc>Three replicas start at 0; an unfinished write reaches only A; read 1 queries A and B and returns 1 without repair; later read 2 queries B and C and returns 0. Every read satisfies R=2.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="560" fill="#fffdf7"/><rect width="1100" height="560" fill="url(#paper)"/><text class="title" x="35" y="42">Quorum overlap doesn’t stop “read 1, then read 0”</text><text class="note" x="35" y="81" text-anchor="start"><tspan x="35" dy="0">N = 3, R = W = 2; write 1 reaches only A and never gets 2 acks; no later writes</tspan></text><path d="M130,120 Q118,121 120,132 L121,192 Q120,203 132,202 L341,201 Q352,202 350,189 L349,131 Q350,118 338,121 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M133,124 L335,122 M346,135 L348,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="235.0" y="154" text-anchor="middle"><tspan x="235.0" dy="0">Replica A</tspan><tspan x="235.0" dy="23">x = 1 (not acked)</tspan></text><path d="M450,120 Q438,121 440,132 L441,192 Q440,203 452,202 L661,201 Q672,202 670,189 L669,131 Q670,118 658,121 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M453,124 L655,122 M666,135 L668,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="555.0" y="154" text-anchor="middle"><tspan x="555.0" dy="0">Replica B</tspan><tspan x="555.0" dy="23">x = 0</tspan></text><path d="M770,120 Q758,121 760,132 L761,192 Q760,203 772,202 L981,201 Q992,202 990,189 L989,131 Q990,118 978,121 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M773,124 L975,122 M986,135 L988,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="875.0" y="154" text-anchor="middle"><tspan x="875.0" dy="0">Replica C</tspan><tspan x="875.0" dy="23">x = 0</tspan></text><path d="M210,305 Q198,306 200,317 L201,377 Q200,388 212,387 L471,386 Q482,387 480,374 L479,316 Q480,303 468,306 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M213,309 L465,307 M476,320 L478,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="340.0" y="339" text-anchor="middle"><tspan x="340.0" dy="0">Read 1: reads A + B</tspan><tspan x="340.0" dy="23">Returns 1, no repair</tspan></text><path d="M680,305 Q668,306 670,317 L671,377 Q670,388 682,387 L941,386 Q952,387 950,374 L949,316 Q950,303 938,306 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M683,309 L935,307 M946,320 L948,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="810.0" y="339" text-anchor="middle"><tspan x="810.0" dy="0">Read 2: reads B + C</tspan><tspan x="810.0" dy="23">Can only return old 0</tspan></text><path d="M235,202 L235,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,202 L510,250 L405,250 L405,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M595,202 L595,250 L740,250 L740,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M875,202 L875,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480,346 L670,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="495.0" y="308" width="160" height="22" rx="5" fill="#fffdf7"/><text class="label" x="575" y="325" text-anchor="middle"><tspan x="575" dy="0">After read 1 ends</tspan></text><text class="note" x="35" y="455" text-anchor="start"><tspan x="35" dy="0">Each read set has 2 replicas, but the shared node B only knows the old value.</tspan></text><text class="note" x="35" y="491" text-anchor="start"><tspan x="35" dy="0">Some strong protocols write back to a majority before returning;</tspan><tspan x="35" dy="26">they also need version rules, ordering of concurrent writes, and membership-change handling.</tspan></text></svg>