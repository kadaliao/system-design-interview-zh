<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img"><title>P27-01 | History = snapshot boundary + committed events</title><desc>Snapshot 100: 10,000 cents. Event 101 reserves 1,500 cents; 102 confirms the debit; 103 refunds 500 cents. A query as of sequence 101 replays only 101 and gets 8,500 available and 1,500 frozen.</desc><rect width="1160" height="650" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P27-01 | History = snapshot boundary + committed events</text><rect x="40" y="120" width="240" height="130" fill="#e6e6f2" class="box"/><text x="56" y="153" class="t b">Snapshot: seq 100</text><text x="56" y="185" class="t p">Available 10,000</text><text x="56" y="213" class="t p">Frozen 0</text><rect x="320" y="120" width="240" height="130" fill="#fff0cc" class="box"/><text x="336" y="153" class="t b">101: reserve 1,500</text><text x="336" y="185" class="t p">Available 8,500</text><text x="336" y="213" class="t p">Frozen 1,500</text><rect x="600" y="120" width="240" height="130" fill="#e2eee8" class="box"/><text x="616" y="153" class="t b">102: confirm debit</text><text x="616" y="185" class="t p">Available 8,500</text><text x="616" y="213" class="t p">Frozen 0</text><rect x="880" y="120" width="240" height="130" fill="#e2eee8" class="box"/><text x="896" y="153" class="t b">103: refund 500</text><text x="896" y="185" class="t p">Available 9,000</text><text x="896" y="213" class="t p">Frozen 0</text><path d="M280 185 L320 185" class="a"/><path d="M560 185 L600 185" class="a"/><path d="M840 185 L880 185" class="a"/><rect x="40" y="350" width="515" height="140" fill="#fff0cc" class="box"/><text x="56" y="383" class="t b">Balance as of sequence 101</text><text x="56" y="415" class="t p">Load verified snapshot 100, apply only 101</text><text x="56" y="443" class="t p">Do not apply 102 or 103</text><rect x="640" y="350" width="480" height="140" fill="#e6e6f2" class="box"/><text x="656" y="383" class="t b">Boundaries replay must keep</text><text x="656" y="415" class="t p">Event ID / commit seq / currency</text><text x="656" y="443" class="t p">Schema + rule version / snapshot checksum</text><path d="M440 250 L440 310 L295 310 L295 350" class="a"/><text x="40" y="550" class="t p">Replay only computes state: no PSP calls, no re-sent notifications, no live exchange rate.</text><text x="40" y="597" class="t s">Commit-point queries differ from business-date recomputation; cross-shard totals need a consistent cut and an in-transit account.</text></svg>