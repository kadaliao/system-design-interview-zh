<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img"><title>R-03 | The failure point decides the recovery action</title><desc>A crash before commit relies on database rollback; a crash after commit but before publishing relies on outbox resend; if the PSP acted but the response was lost, keep the result unknown and query the original payment to avoid a double charge.</desc><rect width="1160" height="660" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:21px;font-weight:bold}.p{font-size:18px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">R-03 | The failure point decides the recovery action</text><rect x="40" y="105" width="315" height="125" fill="#ffe5dd" class="box"/><text x="56" y="138" class="t b">Crash before commit</text><rect x="430" y="105" width="290" height="125" fill="#e6e6f2" class="box"/><text x="446" y="138" class="t b">Authoritative state</text><text x="446" y="170" class="t p">Transaction not committed</text><rect x="805" y="105" width="315" height="125" fill="#e2eee8" class="box"/><text x="821" y="138" class="t b">Recovery action</text><text x="821" y="170" class="t p">Order + stock roll back</text><text x="821" y="198" class="t p">Retry with the same checkout_id</text><path d="M355 167 L430 167" class="a"/><path d="M720 167 L805 167" class="a"/><rect x="40" y="280" width="315" height="125" fill="#ffe5dd" class="box"/><text x="56" y="313" class="t b">Crash after commit</text><rect x="430" y="280" width="290" height="125" fill="#e6e6f2" class="box"/><text x="446" y="313" class="t b">Authoritative state</text><text x="446" y="345" class="t p">Order + outbox committed</text><rect x="805" y="280" width="315" height="125" fill="#e2eee8" class="box"/><text x="821" y="313" class="t b">Recovery action</text><text x="821" y="345" class="t p">Sender resumes publishing</text><text x="821" y="373" class="t p">Dedup + update in one tx</text><path d="M355 342 L430 342" class="a"/><path d="M720 342 L805 342" class="a"/><rect x="40" y="455" width="315" height="125" fill="#ffe5dd" class="box"/><text x="56" y="488" class="t b">PSP response lost</text><rect x="430" y="455" width="290" height="125" fill="#e6e6f2" class="box"/><text x="446" y="488" class="t b">Authoritative state</text><text x="446" y="520" class="t p">Local result still unknown</text><rect x="805" y="455" width="315" height="125" fill="#e2eee8" class="box"/><text x="821" y="488" class="t b">Recovery action</text><text x="821" y="520" class="t p">Query by key / webhook</text><text x="821" y="548" class="t p">No re-charge until final</text><path d="M355 517 L430 517" class="a"/><path d="M720 517 L805 517" class="a"/><text x="40" y="628" class="t p">Common rule: stable business ID + atomic dedup; backoff, dead letters, and reconciliation drive leftovers to convergence.</text></svg>