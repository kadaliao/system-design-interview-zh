<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">搜索不到新邮件：追索引链路的水位</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">先按 email_id 找到变更事件；不同分区的 offset 不能直接互相比较</text><path d="M39 191 Q155.0 188 271 192 Q281 191 280 202 L281 345 Q280 357 270 355 L39 356 Q29 355 31 345 L29 202 Q30 191 39 191Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="155.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">权威邮箱主存</text><text x="155.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">邮件 M 已提交</text><text x="155.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">索引事件应在 P:4312</text><path d="M354 191 Q470.0 188 586 192 Q596 191 595 202 L596 345 Q595 357 585 355 L354 356 Q344 355 346 345 L344 202 Q345 191 354 191Z" fill="#eee8fb" stroke="#455166" stroke-width="2.5"/><text x="470.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">Outbox / Kafka</text><text x="470.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">分区 P 日志末尾</text><text x="470.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">已到 4315</text><path d="M669 191 Q785.0 188 901 192 Q911 191 910 202 L911 345 Q910 357 900 355 L669 356 Q659 355 661 345 L659 202 Q660 191 669 191Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="785.0" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">索引消费者</text><text x="785.0" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">成功处理进度</text><text x="785.0" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">仍在 4280</text><path d="M984 191 Q1092.5 188 1201 192 Q1211 191 1210 202 L1211 345 Q1210 357 1200 355 L984 356 Q974 355 976 345 L974 202 Q975 191 984 191Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1092.5" y="250.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">ES 写入与 refresh</text><text x="1092.5" y="280.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">业务跟踪可见水位</text><text x="1092.5" y="310.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">示例：4278</text><polyline points="280,270 345,270" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="595,270 660,270" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="910,270 975,270" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M49 431 Q217.5 428 386 432 Q396 431 395 442 L396 595 Q395 607 385 605 L49 606 Q39 605 41 595 L39 442 Q40 431 49 431Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="217.5" y="495.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">4312 还没进入队列？</text><text x="217.5" y="525.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">检查 Outbox / CDC</text><text x="217.5" y="555.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">提交后事件是否可靠发出</text><path d="M451 431 Q619.5 428 788 432 Q798 431 797 442 L798 595 Q797 607 787 605 L451 606 Q441 605 443 595 L441 442 Q442 431 451 431Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="619.5" y="495.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">4312 还没被处理？</text><text x="619.5" y="525.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">查积压、重试、死信</text><text x="619.5" y="555.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">消费者与分区热点</text><path d="M853 431 Q1021.5 428 1190 432 Q1200 431 1199 442 L1200 595 Q1199 607 1189 605 L853 606 Q843 605 845 595 L843 442 Q844 431 853 431Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1021.5" y="495.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">已处理但仍搜不到？</text><text x="1021.5" y="525.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">查 Bulk 部分失败 / refresh</text><text x="1021.5" y="555.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">再查路由、别名、权限</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">消费提交、索引成功写入、搜索可见并非同一件事；水位需有明确业务定义。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">不要先扩 SMTP 出站队列；它通常不在“已收信但搜不到”的故障路径上。</text></g></svg>