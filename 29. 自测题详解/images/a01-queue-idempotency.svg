<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img"><title>队列重投：消息重复，业务效果仍只有一次</title><desc>事件E7的去重记录与加10积分在同一事务提交；提交后未ack触发重投，再次处理跳过已经完成的业务。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="710" fill="#fffdf7"/><rect width="1040" height="710" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">队列重投：消息重复，业务效果仍只有一次</text><path d="M82 88 Q195.0 86.5 308 89 Q321 89 320 101 L319 204 Q320 217 307 216 L82 217 Q69 216 70 204 L71 100 Q70 88 82 88 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="87" y="120" class="head">队列投递事件 E7</text><text x="87" y="152">订单奖励 +10 分</text><text x="87" y="180">等待消费者确认 ack</text><path d="M322,154 L369,154" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="324" y="134" class="small">第一次</text><path d="M394 88 Q696.0 86.5 998 89 Q1011 89 1010 101 L1009 204 Q1010 217 997 216 L394 217 Q381 216 382 204 L383 100 Q382 88 394 88 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="399" y="120" class="head">同一个数据库事务</text><text x="399" y="152">INSERT processed_events(E7) — 唯一约束</text><text x="399" y="180">账户 +10 分；两项一起 COMMIT</text><path d="M807,218 L807,258" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M642 273 Q820.0 271.5 998 274 Q1011 274 1010 286 L1009 367 Q1010 380 997 379 L642 380 Q629 379 630 367 L631 285 Q630 273 642 273 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="647" y="305" class="head">提交后进程崩溃</text><text x="647" y="337">+10 已生效，ack 尚未送达</text><text x="647" y="365">队列无法知道业务已经完成</text><path d="M162,218 L162,405" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="183" y="326" class="small">未确认 → 重投同一 E7</text><path d="M82 421 Q195.0 419.5 308 422 Q321 422 320 434 L319 511 Q320 524 307 523 L82 524 Q69 523 70 511 L71 433 Q70 421 82 421 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="87" y="453" class="head">再次收到事件 E7</text><text x="87" y="485">使用同一个业务事件 ID</text><path d="M322,472 L369,472" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="324" y="452" class="small">第二次</text><path d="M394 421 Q696.0 419.5 998 422 Q1011 422 1010 434 L1009 511 Q1010 524 997 523 L394 524 Q381 523 382 511 L383 433 Q382 421 394 421 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="399" y="453" class="head">发现 E7 已处理 → 跳过账户更新</text><text x="399" y="485">读取已完成结果；不再 +10；此时可安全确认消息</text><path d="M692,524 L692,574 L30,574 L30,176 L60,176" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="305" y="561" class="small">ack 成功：返回队列，结束这次投递</text><path d="M42 620 Q520.0 618.5 998 621 Q1011 621 1010 633 L1009 674 Q1010 687 997 686 L42 687 Q29 686 30 674 L31 632 Q30 620 42 620 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="651">外部邮件/支付不在此数据库事务中：还需对方幂等键、查询对账或补偿。</text><text x="47" y="679">去重记录须覆盖重放窗口；先 ack 后处理会产生丢任务风险。</text></svg>