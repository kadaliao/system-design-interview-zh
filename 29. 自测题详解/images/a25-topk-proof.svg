<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">本地 Top K 足够：前面已有 K 人，就进不了全局前 K</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">缩小例子 K = 3；前提是玩家不跨片重复、统一排序规则、同一逻辑快照</text><path d="M49 161 Q190.0 158 331 162 Q341 161 340 172 L341 295 Q340 307 330 305 L49 306 Q39 305 41 295 L39 172 Q40 161 49 161Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="190.0" y="225.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">A 片本地前三</text><text x="190.0" y="255.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100、90、80</text><path d="M479 161 Q620.0 158 761 162 Q771 161 770 172 L771 295 Q770 307 760 305 L479 306 Q469 305 471 295 L469 172 Q470 161 479 161Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="225.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">B 片本地前三</text><text x="620.0" y="255.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">95、85、75</text><path d="M909 161 Q1050.0 158 1191 162 Q1201 161 1200 172 L1201 295 Q1200 307 1190 305 L909 306 Q899 305 901 295 L899 172 Q900 161 909 161Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="1050.0" y="225.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">C 片本地前三</text><text x="1050.0" y="255.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">93、92、70</text><path d="M419 371 Q620.0 368 821 372 Q831 371 830 382 L831 460 Q830 472 820 470 L419 471 Q409 470 411 460 L409 382 Q410 371 419 371Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="413.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">合并得到全局前三</text><text x="620.0" y="443.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">100、95、93</text><polyline points="190,305 190,420 410,420" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="620,305 620,370" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="1050,305 1050,420 830,420" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><path d="M54 541 Q382.5 538 711 542 Q721 541 720 552 L721 630 Q720 642 710 640 L54 641 Q44 640 46 630 L44 552 Q45 541 54 541Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="382.5" y="583.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">反证：P 在本片第 4 → 本片已有 3 人在前</text><text x="382.5" y="613.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">这 3 人在全局也在前 → P 不可能全局前三</text><path d="M784 516 Q987.5 513 1191 517 Q1201 516 1200 527 L1201 640 Q1200 652 1190 650 L784 651 Q774 650 776 640 L774 527 Q775 516 784 516Z" fill="#ffe9e5" stroke="#455166" stroke-width="2.5"/><text x="987.5" y="560.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">并列边界：12 人都是 100 分</text><text x="987.5" y="590.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">取前 10 个人：返回 10 人</text><text x="987.5" y="620.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">含全部并列第一：必须返回 12 人</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">最多取 m × K 个候选；若要求包含边界所有同分者，还需按分数阈值扩大取数。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">若查询期间各片持续变化、没有共同快照，结果可能混用多个时刻，证明前提就变了。</text></g></svg>