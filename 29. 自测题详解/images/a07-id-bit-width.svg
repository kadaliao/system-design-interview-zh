<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>时间有序不代表位宽合格：UUIDv7 仍是 128 位</title><desc>UUIDv7字段为48时间加4版本加12随机加2variant加62随机。Snowflake是1加41加5加5加12总64。宽度是说明示意。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="560" fill="#fffdf7"/><rect width="1100" height="560" fill="url(#paper)"/><text class="title" x="35" y="42">时间有序不代表位宽合格：UUIDv7 仍是 128 位</text><text class="note" x="35" y="85" text-anchor="start"><tspan x="35" dy="0">UUIDv7：128 位 = 16 字节（下方方块不按位数等比例绘制）</tspan></text><path d="M45,120 Q33,121 35,132 L36,192 Q35,203 47,202 L216,201 Q227,202 225,189 L224,131 Q225,118 213,121 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,124 L210,122 M221,135 L223,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="130.0" y="154" text-anchor="middle"><tspan x="130.0" dy="0">48 位</tspan><tspan x="130.0" dy="23">Unix 毫秒</tspan></text><path d="M258,120 Q246,121 248,132 L249,192 Q248,203 260,202 L429,201 Q440,202 438,189 L437,131 Q438,118 426,121 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M261,124 L423,122 M434,135 L436,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="343.0" y="154" text-anchor="middle"><tspan x="343.0" dy="0">4 位</tspan><tspan x="343.0" dy="23">版本 7</tspan></text><path d="M471,120 Q459,121 461,132 L462,192 Q461,203 473,202 L642,201 Q653,202 651,189 L650,131 Q651,118 639,121 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M474,124 L636,122 M647,135 L649,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="556.0" y="154" text-anchor="middle"><tspan x="556.0" dy="0">12 位</tspan><tspan x="556.0" dy="23">rand_a</tspan></text><path d="M684,120 Q672,121 674,132 L675,192 Q674,203 686,202 L855,201 Q866,202 864,189 L863,131 Q864,118 852,121 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M687,124 L849,122 M860,135 L862,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="769.0" y="154" text-anchor="middle"><tspan x="769.0" dy="0">2 位</tspan><tspan x="769.0" dy="23">variant</tspan></text><path d="M897,120 Q885,121 887,132 L888,192 Q887,203 899,202 L1068,201 Q1079,202 1077,189 L1076,131 Q1077,118 1065,121 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M900,124 L1062,122 M1073,135 L1075,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="982.0" y="154" text-anchor="middle"><tspan x="982.0" dy="0">62 位</tspan><tspan x="982.0" dy="23">rand_b</tspan></text><text class="note" x="35" y="250" text-anchor="start"><tspan x="35" dy="0">48 + 4 + 12 + 2 + 62 = 128；74 位 rand 区域也可含规范允许的计数/亚毫秒结构</tspan></text><text class="note" x="35" y="305" text-anchor="start"><tspan x="35" dy="0">本题 Snowflake：64 位 = 8 字节</tspan></text><path d="M45,338 Q33,339 35,350 L36,410 Q35,421 47,420 L216,419 Q227,420 225,407 L224,349 Q225,336 213,339 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M48,342 L210,340 M221,353 L223,404" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="130.0" y="372" text-anchor="middle"><tspan x="130.0" dy="0">1 位</tspan><tspan x="130.0" dy="23">符号</tspan></text><path d="M258,338 Q246,339 248,350 L249,410 Q248,421 260,420 L429,419 Q440,420 438,407 L437,349 Q438,336 426,339 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M261,342 L423,340 M434,353 L436,404" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="343.0" y="372" text-anchor="middle"><tspan x="343.0" dy="0">41 位</tspan><tspan x="343.0" dy="23">epoch 毫秒</tspan></text><path d="M471,338 Q459,339 461,350 L462,410 Q461,421 473,420 L642,419 Q653,420 651,407 L650,349 Q651,336 639,339 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M474,342 L636,340 M647,353 L649,404" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="556.0" y="372" text-anchor="middle"><tspan x="556.0" dy="0">5 位</tspan><tspan x="556.0" dy="23">机房 ID</tspan></text><path d="M684,338 Q672,339 674,350 L675,410 Q674,421 686,420 L855,419 Q866,420 864,407 L863,349 Q864,336 852,339 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M687,342 L849,340 M860,353 L862,404" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="769.0" y="372" text-anchor="middle"><tspan x="769.0" dy="0">5 位</tspan><tspan x="769.0" dy="23">机器 ID</tspan></text><path d="M897,338 Q885,339 887,350 L888,410 Q887,421 899,420 L1068,419 Q1079,420 1077,407 L1076,349 Q1077,336 1065,339 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M900,342 L1062,340 M1073,353 L1075,404" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="982.0" y="372" text-anchor="middle"><tspan x="982.0" dy="0">12 位</tspan><tspan x="982.0" dy="23">同毫秒序列</tspan></text><text class="note" x="35" y="478" text-anchor="start"><tspan x="35" dy="0">去掉 UUID 连字符只是换表示；截成 64 位会丢信息，不能继承原来的唯一性保证。</tspan></text><text class="note" x="35" y="518" text-anchor="start"><tspan x="35" dy="0">UUIDv7 可改善时间局部性；如果允许 128 位，它仍是合适的候选方案。</tspan></text></svg>