<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="635" viewBox="0 0 1160 635" role="img"><title>R-01｜订单创建成功与支付成功，是两个提交边界</title><desc>订单校验后在一个本地事务中写订单、预留库存、写outbox。提交才返回待支付；后台任务确认PSP结果并记账后订单才已支付。</desc><rect width="1160" height="635" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">R-01｜订单创建成功与支付成功，是两个提交边界</text><rect x="40" y="110" width="280" height="120" fill="#fff0cc" class="box"/><text x="56" y="143" class="t b">① 接入与校验</text><text x="56" y="175" class="t p">身份、价格、数量</text><text x="56" y="203" class="t p">稳定 checkout_id</text><rect x="440" y="110" width="300" height="120" fill="#fff0cc" class="box"/><text x="456" y="143" class="t b">② 本地事务提交</text><text x="456" y="175" class="t p">订单 + 库存预留</text><text x="456" y="203" class="t p">+ outbox 一起成功</text><rect x="850" y="110" width="270" height="120" fill="#e2eee8" class="box"/><text x="866" y="143" class="t b">③ 返回创建成功</text><text x="866" y="175" class="t p">HTTP 201：待支付</text><text x="866" y="203" class="t p">尚不能确认可发货</text><path d="M320 170 L440 170" class="a"/><path d="M740 170 L850 170" class="a"/><path d="M590 230 L590 285 L180 285 L180 355" class="a"/><rect x="40" y="355" width="280" height="120" fill="#fff0cc" class="box"/><text x="56" y="388" class="t b">后台发送 outbox</text><text x="56" y="420" class="t p">可以重发；消费者去重</text><text x="56" y="448" class="t p">不占用订单数据库锁</text><rect x="440" y="355" width="300" height="120" fill="#e6e6f2" class="box"/><text x="456" y="388" class="t b">PSP 确认付款成功</text><text x="456" y="420" class="t p">验签 webhook / 查询</text><text x="456" y="448" class="t p">不信浏览器回跳</text><rect x="850" y="355" width="270" height="120" fill="#e2eee8" class="box"/><text x="866" y="388" class="t b">资金与订单完成</text><text x="866" y="420" class="t p">幂等记账、订单已支付</text><text x="866" y="448" class="t p">随后触发履约</text><path d="M320 415 L440 415" class="a"/><path d="M740 415 L850 415" class="a"/><text x="40" y="542" class="t p">提交后的网络超时可能只是响应丢了：查询原订单，或复用原键重试。</text><text x="40" y="587" class="t p">成功响应必须说清“哪件事已成立”，不能把“已受理”说成“已付款”。</text></svg>