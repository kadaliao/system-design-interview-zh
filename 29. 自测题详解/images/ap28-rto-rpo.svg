<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img"><title>P28-03｜RTO 是恢复耗时，RPO 是数据缺口</title><desc>5秒RTO示例预算为发现0.5秒，选主与隔离1秒，追日志2秒，校验开放1.5秒；已确认交易RPO零需要确认前的持久化复制保证。</desc><rect width="1160" height="670" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P28-03｜RTO 是恢复耗时，RPO 是数据缺口</text><text x="40" y="108" class="t b">示例 RTO 目标：单机故障后 5 秒内恢复经过验证的交易服务</text><rect x="40" y="155" width="100" height="110" fill="#ffe5dd" stroke="#344d61" stroke-width="2"/><text x="52" y="196" class="t p">检测</text><text x="52" y="231" class="t p">0.5 秒</text><rect x="140" y="155" width="200" height="110" fill="#fff0cc" stroke="#344d61" stroke-width="2"/><text x="152" y="196" class="t p">选主 + 隔离</text><text x="152" y="231" class="t p">1 秒</text><rect x="340" y="155" width="400" height="110" fill="#e6e6f2" stroke="#344d61" stroke-width="2"/><text x="352" y="196" class="t p">追日志 + 重建状态</text><text x="352" y="231" class="t p">2 秒</text><rect x="740" y="155" width="300" height="110" fill="#e2eee8" stroke="#344d61" stroke-width="2"/><text x="752" y="196" class="t p">校验 + 开放网关</text><text x="752" y="231" class="t p">1.5 秒</text><text x="40" y="300" class="t s">0</text><text x="140" y="300" class="t s">0.5</text><text x="340" y="300" class="t s">1.5</text><text x="740" y="300" class="t s">3.5</text><text x="1040" y="300" class="t s">5 秒</text><text x="40" y="365" class="t b">RPO 另看“已确认的日志保住了多少”</text><rect x="40" y="405" width="600" height="110" fill="#e2eee8" class="box"/><text x="56" y="438" class="t b">已确认：序号 98 → 99 → 100</text><text x="56" y="470" class="t p">目标 RPO = 0：这些已确认事实必须完整保留</text><rect x="740" y="405" width="360" height="110" fill="#fff0cc" class="box"/><text x="756" y="438" class="t b">101：尚未确认</text><text x="756" y="470" class="t p">查询结果 / 按原 ID 重试</text><text x="756" y="498" class="t p">不能擅自宣告已经成功</text><text x="40" y="568" class="t p">RTO 5 秒 ≠ 可以丢 5 秒交易；异步异地副本的 RPO 要按实际复制承诺披露。</text><text x="40" y="617" class="t p">若发现日志缺口或双主风险，即使超过恢复目标，也应停盘核查。</text></svg>