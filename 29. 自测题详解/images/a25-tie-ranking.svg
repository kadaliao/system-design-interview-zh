<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">同分玩家：位置与并列名次不是一回事</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">分数降序；本例同分按反向字典序展示 B、A。先约定产品排名规则</text><path d="M54 166 Q620.0 163 1186 167 Q1196 166 1195 177 L1196 460 Q1195 472 1185 470 L54 471 Q44 470 46 460 L44 177 Q45 166 54 166Z" fill="#fffdf7" stroke="#455166" stroke-width="2.5"/><path d="M250 165 L250 470" stroke="#536176" stroke-width="2" fill="none"/><path d="M455 165 L455 470" stroke="#536176" stroke-width="2" fill="none"/><path d="M730 165 L730 470" stroke="#536176" stroke-width="2" fill="none"/><path d="M965 165 L965 470" stroke="#536176" stroke-width="2" fill="none"/><path d="M45 245 L1195 245" stroke="#536176" stroke-width="2" fill="none"/><path d="M45 320 L1195 320" stroke="#536176" stroke-width="2" fill="none"/><path d="M45 395 L1195 395" stroke="#536176" stroke-width="2" fill="none"/><text x="147.5" y="211" font-size="23" text-anchor="middle" font-weight="600" fill="#263244">玩家</text><text x="352.5" y="211" font-size="23" text-anchor="middle" font-weight="600" fill="#263244">分数</text><text x="592.5" y="211" font-size="23" text-anchor="middle" font-weight="600" fill="#263244">Redis 位置 + 1</text><text x="847.5" y="211" font-size="23" text-anchor="middle" font-weight="600" fill="#263244">竞赛排名</text><text x="1080.0" y="211" font-size="23" text-anchor="middle" font-weight="600" fill="#263244">密集排名</text><text x="147.5" y="291" font-size="26" text-anchor="middle" font-weight="400" fill="#263244">B</text><text x="352.5" y="291" font-size="26" text-anchor="middle" font-weight="400" fill="#263244">100</text><text x="592.5" y="291" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">1</text><text x="847.5" y="291" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">1</text><text x="1080.0" y="291" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">1</text><text x="147.5" y="366" font-size="26" text-anchor="middle" font-weight="400" fill="#263244">A</text><text x="352.5" y="366" font-size="26" text-anchor="middle" font-weight="400" fill="#263244">100</text><text x="592.5" y="366" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">2</text><text x="847.5" y="366" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">1</text><text x="1080.0" y="366" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">1</text><text x="147.5" y="441" font-size="26" text-anchor="middle" font-weight="400" fill="#263244">C</text><text x="352.5" y="441" font-size="26" text-anchor="middle" font-weight="400" fill="#263244">90</text><text x="592.5" y="441" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">3</text><text x="847.5" y="441" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">3</text><text x="1080.0" y="441" font-size="26" text-anchor="middle" font-weight="600" fill="#263244">2</text><path d="M109 526 Q620.0 523 1131 527 Q1141 526 1140 537 L1141 610 Q1140 622 1130 620 L109 621 Q99 620 101 610 L99 537 Q100 526 109 526Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="620.0" y="565.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">竞赛名次 = 1 + 分数严格更高的人数</text><text x="620.0" y="595.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">密集名次 = 1 + 严格更高的不同分数档位数</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">ZREVRANK 是从 0 开始的位置；加 1 只转换成普通序号，不会自动产生并列名次。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">读分数与统计更高人数之间也可能发生更新，需要原子读取或明确快照/近似边界。</text></g></svg>