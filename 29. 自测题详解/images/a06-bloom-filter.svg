<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>Bloom Filter：全为 1 只能说明“可能存在”</title><desc>8位数组哈希两次。alpha占1和4，beta占4和6。未插入gamma查1和6也全1，所以出现假阳性。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">Bloom Filter：全为 1 只能说明“可能存在”</text><text class="note" x="35" y="85" text-anchor="start"><tspan x="35" dy="0">已经插入：alpha → 位 1、4；beta → 位 4、6；gamma 从未插入</tspan></text><text class="label" x="178" y="130" text-anchor="middle"><tspan x="178" dy="0">0</tspan></text><path d="M145,148 Q133,149 135,160 L136,208 Q135,219 147,218 L211,217 Q222,218 220,205 L219,159 Q220,146 208,149 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M148,152 L205,150 M216,163 L218,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="177.5" y="195" text-anchor="middle"><tspan x="177.5" dy="0">0</tspan></text><text class="label" x="281" y="130" text-anchor="middle"><tspan x="281" dy="0">1</tspan></text><path d="M248,148 Q236,149 238,160 L239,208 Q238,219 250,218 L314,217 Q325,218 323,205 L322,159 Q323,146 311,149 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M251,152 L308,150 M319,163 L321,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="280.5" y="195" text-anchor="middle"><tspan x="280.5" dy="0">1</tspan></text><text class="label" x="384" y="130" text-anchor="middle"><tspan x="384" dy="0">2</tspan></text><path d="M351,148 Q339,149 341,160 L342,208 Q341,219 353,218 L417,217 Q428,218 426,205 L425,159 Q426,146 414,149 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M354,152 L411,150 M422,163 L424,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="383.5" y="195" text-anchor="middle"><tspan x="383.5" dy="0">0</tspan></text><text class="label" x="487" y="130" text-anchor="middle"><tspan x="487" dy="0">3</tspan></text><path d="M454,148 Q442,149 444,160 L445,208 Q444,219 456,218 L520,217 Q531,218 529,205 L528,159 Q529,146 517,149 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M457,152 L514,150 M525,163 L527,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="486.5" y="195" text-anchor="middle"><tspan x="486.5" dy="0">0</tspan></text><text class="label" x="590" y="130" text-anchor="middle"><tspan x="590" dy="0">4</tspan></text><path d="M557,148 Q545,149 547,160 L548,208 Q547,219 559,218 L623,217 Q634,218 632,205 L631,159 Q632,146 620,149 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M560,152 L617,150 M628,163 L630,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="589.5" y="195" text-anchor="middle"><tspan x="589.5" dy="0">1</tspan></text><text class="label" x="693" y="130" text-anchor="middle"><tspan x="693" dy="0">5</tspan></text><path d="M660,148 Q648,149 650,160 L651,208 Q650,219 662,218 L726,217 Q737,218 735,205 L734,159 Q735,146 723,149 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M663,152 L720,150 M731,163 L733,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="692.5" y="195" text-anchor="middle"><tspan x="692.5" dy="0">0</tspan></text><text class="label" x="796" y="130" text-anchor="middle"><tspan x="796" dy="0">6</tspan></text><path d="M763,148 Q751,149 753,160 L754,208 Q753,219 765,218 L829,217 Q840,218 838,205 L837,159 Q838,146 826,149 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M766,152 L823,150 M834,163 L836,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="795.5" y="195" text-anchor="middle"><tspan x="795.5" dy="0">1</tspan></text><text class="label" x="899" y="130" text-anchor="middle"><tspan x="899" dy="0">7</tspan></text><path d="M866,148 Q854,149 856,160 L857,208 Q856,219 868,218 L932,217 Q943,218 941,205 L940,159 Q941,146 929,149 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M869,152 L926,150 M937,163 L939,202" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="898.5" y="195" text-anchor="middle"><tspan x="898.5" dy="0">0</tspan></text><path d="M100,310 Q88,311 90,322 L91,382 Q90,393 102,392 L491,391 Q502,392 500,379 L499,321 Q500,308 488,311 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M103,314 L485,312 M496,325 L498,376" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="295.0" y="344" text-anchor="middle"><tspan x="295.0" dy="0">查 gamma：位 1、6 都是 1</tspan><tspan x="295.0" dy="23">可能存在 → 继续精确查询</tspan></text><path d="M610,310 Q598,311 600,322 L601,382 Q600,393 612,392 L1001,391 Q1012,392 1010,379 L1009,321 Q1010,308 998,311 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M613,314 L995,312 M1006,325 L1008,376" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="805.0" y="344" text-anchor="middle"><tspan x="805.0" dy="0">查 delta：位 2、7 有 0</tspan><tspan x="805.0" dy="23">一定不在当前匹配的集合中</tspan></text><text class="note" x="35" y="436" text-anchor="start"><tspan x="35" dy="0">相同的位可以被不同 key 共用；普通过滤器不能随意把位清零来删除一个 key。</tspan></text><text class="note" x="35" y="472" text-anchor="start"><tspan x="35" dy="0">无假阴性前提：集合完整、哈希一致、正确维护、没有损坏或落后的过滤器。</tspan></text></svg>