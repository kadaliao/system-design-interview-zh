<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img"><title>Feed 三个需求：每个答案都要改变一处设计</title><desc>排序规则影响查询和推荐路径，粉丝规模影响推拉扇出，媒体类型影响对象存储和CDN。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="720" fill="#fffdf7"/><rect width="1040" height="720" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Feed 三个需求：每个答案都要改变一处设计</text><path d="M42 95 Q175.0 93.5 308 96 Q321 96 320 108 L319 207 Q320 220 307 219 L42 220 Q29 219 30 207 L31 107 Q30 95 42 95 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="127" class="head">① 如何排序？</text><text x="47" y="159">好友动态按时间倒序？</text><text x="47" y="187">还是个性化推荐？</text><path d="M387 95 Q520.0 93.5 653 96 Q666 96 665 108 L664 207 Q665 220 652 219 L387 220 Q374 219 375 207 L376 107 Q375 95 387 95 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="392" y="127" class="head">② 多少用户 / 粉丝？</text><text x="392" y="159">均值、峰值、头部分布？</text><text x="392" y="187">是否有百万粉丝名人？</text><path d="M732 95 Q865.0 93.5 998 96 Q1011 96 1010 108 L1009 207 Q1010 220 997 219 L732 220 Q719 219 720 207 L721 107 Q720 95 732 95 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="737" y="127" class="head">③ 是什么内容？</text><text x="737" y="159">文字、图片还是视频？</text><text x="737" y="187">是否需要转码后可见？</text><path d="M175,221 L175,283" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="192" y="261" class="small">决定</text><path d="M520,221 L520,283" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="537" y="261" class="small">决定</text><path d="M865,221 L865,283" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="882" y="261" class="small">决定</text><path d="M42 299 Q175.0 297.5 308 300 Q321 300 320 312 L319 470 Q320 483 307 482 L42 483 Q29 482 30 470 L31 311 Q30 299 42 299 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="331" class="head">排序 / 查询路径</text><text x="47" y="363">时间序：稳定游标分页</text><text x="47" y="391">推荐：候选召回 + 排序</text><text x="47" y="419">缓存键和分页规则不同</text><path d="M387 299 Q520.0 297.5 653 300 Q666 300 665 312 L664 470 Q665 483 652 482 L387 483 Q374 482 375 470 L376 311 Q375 299 387 299 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="392" y="331" class="head">发布扇出路径</text><text x="392" y="363">普通用户：可写时推送</text><text x="392" y="391">名人：读时拉取或混合</text><text x="392" y="419">峰值看扇出写，不只看发帖</text><path d="M732 299 Q865.0 297.5 998 300 Q1011 300 1010 312 L1009 470 Q1010 483 997 482 L732 483 Q719 482 720 470 L721 311 Q720 299 732 299 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="737" y="331" class="head">媒体路径</text><text x="737" y="363">正文存数据库</text><text x="737" y="391">媒体存对象库 + CDN</text><text x="737" y="419">视频处理可异步进行</text><path d="M42 530 Q520.0 528.5 998 531 Q1011 531 1010 543 L1009 657 Q1010 670 997 669 L42 670 Q29 669 30 657 L31 542 Q30 530 42 530 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="562" class="head">合并成一条可解释的高层主线</text><text x="47" y="594">帖子持久化 → 可靠扇出任务 → Feed ID 列表；读取时聚合正文，媒体由 CDN 返回。</text><text x="47" y="622">例：100 次发布/秒 × 平均 200 名接收者 = 20,000 次收件箱写/秒。</text><text x="47" y="650">平均不能掩盖名人尖峰；还需确认隐私、删除语义和发布传播时效。</text></svg>