<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img"><title>P27-01｜历史余额由“快照边界 + 已提交事件”确定</title><desc>快照100余额10000分；事件101预留1500分；102确认扣款；103退款500分。查询截至序号101的状态只重放101，得到可用8500分冻结1500分。</desc><rect width="1160" height="650" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P27-01｜历史余额由“快照边界 + 已提交事件”确定</text><rect x="40" y="120" width="240" height="130" fill="#e6e6f2" class="box"/><text x="56" y="153" class="t b">快照：序号 100</text><text x="56" y="185" class="t p">可用 10,000 分</text><text x="56" y="213" class="t p">冻结 0 分</text><rect x="320" y="120" width="240" height="130" fill="#fff0cc" class="box"/><text x="336" y="153" class="t b">101：预留 1,500</text><text x="336" y="185" class="t p">可用 8,500 分</text><text x="336" y="213" class="t p">冻结 1,500 分</text><rect x="600" y="120" width="240" height="130" fill="#e2eee8" class="box"/><text x="616" y="153" class="t b">102：确认扣款</text><text x="616" y="185" class="t p">可用 8,500 分</text><text x="616" y="213" class="t p">冻结 0 分</text><rect x="880" y="120" width="240" height="130" fill="#e2eee8" class="box"/><text x="896" y="153" class="t b">103：退款 500</text><text x="896" y="185" class="t p">可用 9,000 分</text><text x="896" y="213" class="t p">冻结 0 分</text><path d="M280 185 L320 185" class="a"/><path d="M560 185 L600 185" class="a"/><path d="M840 185 L880 185" class="a"/><rect x="40" y="350" width="515" height="140" fill="#fff0cc" class="box"/><text x="56" y="383" class="t b">查询截至序号 101 的历史余额</text><text x="56" y="415" class="t p">加载经验证的快照 100，仅应用事件 101</text><text x="56" y="443" class="t p">不要再应用 102、103</text><rect x="640" y="350" width="480" height="140" fill="#e6e6f2" class="box"/><text x="656" y="383" class="t b">重放必须保留的边界</text><text x="656" y="415" class="t p">事件 ID / 提交序号 / 币种</text><text x="656" y="443" class="t p">schema 版本 / 规则版本 / 快照校验</text><path d="M440 250 L440 310 L295 310 L295 350" class="a"/><text x="40" y="550" class="t p">重放只计算状态：不能再次调用 PSP、重新发通知，或读取今天的汇率。</text><text x="40" y="597" class="t s">按提交时点查询与按业务生效日重算不同；跨分片总额还需一致切面与在途账户。</text></svg>