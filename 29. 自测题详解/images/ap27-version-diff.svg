<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img"><title>P27-03｜旧新版本重放：定位第一个分歧事件</title><desc>同一快照和事件输入分别进入隔离的旧新版本归约器，再逐事件比较余额、冻结额、分录和序号；重放期间禁止外部副作用。</desc><rect width="1160" height="670" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba674b"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#223747}.h{font-size:28px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#344d61;stroke-width:3;stroke-linejoin:round;rx:17}.a{fill:none;stroke:#ba674b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{fill:none;stroke:#879b97;stroke-width:2;stroke-dasharray:8 7}</style><text x="40" y="45" class="t h">P27-03｜旧新版本重放：定位第一个分歧事件</text><rect x="40" y="255" width="260" height="150" fill="#fff0cc" class="box"/><text x="56" y="288" class="t b">固定只读输入</text><text x="56" y="320" class="t p">同一快照与起止序号</text><text x="56" y="348" class="t p">不可变事件 + 历史版本</text><text x="56" y="376" class="t p">固化时间、汇率等输入</text><rect x="420" y="110" width="280" height="130" fill="#e6e6f2" class="box"/><text x="436" y="143" class="t b">旧版本归约器</text><text x="436" y="175" class="t p">隔离存储 A</text><text x="436" y="203" class="t p">按历史版本重放</text><rect x="420" y="450" width="280" height="130" fill="#e2eee8" class="box"/><text x="436" y="483" class="t b">新版本归约器</text><text x="436" y="515" class="t p">隔离存储 B</text><text x="436" y="543" class="t p">按历史版本重放</text><rect x="840" y="255" width="280" height="150" fill="#fff0cc" class="box"/><text x="856" y="288" class="t b">逐事件差分</text><text x="856" y="320" class="t p">余额 / 冻结 / 分录</text><text x="856" y="348" class="t p">序号 / 拒绝原因</text><text x="856" y="376" class="t p">定位第一个分歧</text><path d="M300 300 L355 300 L355 175 L420 175" class="a"/><path d="M300 355 L355 355 L355 515 L420 515" class="a"/><path d="M700 175 L765 175 L765 300 L840 300" class="a"/><path d="M700 515 L800 515 L800 355 L840 355" class="a"/><text x="40" y="477" class="t b">禁止外部副作用</text><text x="40" y="512" class="t p">不付款、不发通知</text><text x="40" y="547" class="t p">不重跑真实业务命令</text><text x="40" y="624" class="t p">实现优化应保持语义；合法规则变更要有生效版本和预期差异，不能覆盖旧流水。</text></svg>