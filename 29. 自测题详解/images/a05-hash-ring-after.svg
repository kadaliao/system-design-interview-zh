<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>一致性哈希：新增 S4 = 65，只迁移 (50,65]</title><desc>0到99顺时针数值环。S1在20，S2在50，S3在80。key10去20，35去50，60原去80，90绕回20。新增65后，60改去65。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="600" fill="#fffdf7"/><rect width="1100" height="600" fill="url(#paper)"/><text class="title" x="35" y="42">一致性哈希：新增 S4 = 65，只迁移 (50,65]</text><circle cx="325" cy="300" r="160" fill="none" stroke="#35424a" stroke-width="2.5"/><circle cx="326" cy="299" r="163" fill="none" stroke="#35424a" stroke-width=".6" opacity=".5"/><path d="M325.0,460.0 A160,160 0 0 1 195.55728090000844,394.04564036679574" stroke="#d15f55" stroke-width="12" fill="none" opacity=".45"/><text class="node" x="319" y="303" text-anchor="middle"><tspan x="319" dy="0">红色弧段</tspan><tspan x="319" dy="23">(50,65]</tspan></text><path d="M336.11392195668844,123.34926906819592 A177,177 0 0 1 410.2704003160036,144.89371763223613" fill="none" stroke="#35424a" stroke-width="2" marker-end="url(#arrow)"/><text class="label" x="325" y="103" text-anchor="middle"><tspan x="325" dy="0">0 / 100</tspan></text><rect x="469.1690426072246" y="242.5572809000084" width="16" height="16" fill="#47799a" stroke="#27343b"/><text class="node" x="525.6729249382774" y="240.7974141868861" text-anchor="middle"><tspan x="525.6729249382774" dy="0">S1 = 20</tspan></text><rect x="317.0" y="452.0" width="16" height="16" fill="#47799a" stroke="#27343b"/><text class="node" x="325.0" y="517.0" text-anchor="middle"><tspan x="325.0" dy="0">S2 = 50</tspan></text><rect x="164.83095739277542" y="242.55728090000844" width="16" height="16" fill="#47799a" stroke="#27343b"/><text class="node" x="124.32707506172258" y="240.79741418688613" text-anchor="middle"><tspan x="124.32707506172258" dy="0">S3 = 80</tspan></text><rect x="187.55728090000844" y="386.04564036679574" width="16" height="16" fill="#d15f55" stroke="#27343b"/><text class="node" x="154.2974141868861" y="430.02268823371185" text-anchor="middle"><tspan x="154.2974141868861" dy="0">S4 = 65</tspan></text><circle cx="419.04564036679574" cy="170.5572809000084" r="6" fill="#cc913a" stroke="#5d4827"/><text class="label" x="399.0609417888516" y="203.06385870875664" text-anchor="middle"><tspan x="399.0609417888516" dy="0">kA = 10</tspan></text><circle cx="454.44271909999156" cy="394.0456403667957" r="6" fill="#cc913a" stroke="#5d4827"/><text class="label" x="426.93614129124336" y="379.0609417888516" text-anchor="middle"><tspan x="426.93614129124336" dy="0">kB = 35</tspan></text><circle cx="230.95435963320432" cy="429.44271909999156" r="6" fill="#cc913a" stroke="#5d4827"/><text class="label" x="250.9390582111484" y="406.93614129124336" text-anchor="middle"><tspan x="250.9390582111484" dy="0">kC = 60</tspan></text><circle cx="230.95435963320426" cy="170.55728090000844" r="6" fill="#cc913a" stroke="#5d4827"/><text class="label" x="250.93905821114836" y="203.06385870875664" text-anchor="middle"><tspan x="250.93905821114836" dy="0">kD = 90</tspan></text><path d="M660,110 Q648,111 650,122 L651,182 Q650,193 662,192 L1046,191 Q1057,192 1055,179 L1054,121 Q1055,108 1043,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M663,114 L1040,112 M1051,125 L1053,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="852.5" y="144" text-anchor="middle"><tspan x="852.5" dy="0">规则：第一个 ≥ key 的节点</tspan><tspan x="852.5" dy="23">超过最大值就绕回最小节点</tspan></text><path d="M660,240 Q648,241 650,252 L651,312 Q650,323 662,322 L1046,321 Q1057,322 1055,309 L1054,251 Q1055,238 1043,241 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M663,244 L1040,242 M1051,255 L1053,306" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="852.5" y="274" text-anchor="middle"><tspan x="852.5" dy="0">kA = 10 → S1 = 20</tspan><tspan x="852.5" dy="23">kB = 35 → S2 = 50</tspan></text><path d="M660,370 Q648,371 650,382 L651,442 Q650,453 662,452 L1046,451 Q1057,452 1055,439 L1054,381 Q1055,368 1043,371 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M663,374 L1040,372 M1051,385 L1053,436" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="852.5" y="404" text-anchor="middle"><tspan x="852.5" dy="0">kC = 60 → S4 = 65</tspan><tspan x="852.5" dy="23">kD = 90 → S1 = 20</tspan></text><text class="note" x="35" y="560" text-anchor="start"><tspan x="35" dy="0">端点规则：50 仍归 S2；65 归新 S4；66 仍归 S3。只有 kC 的主归属改变。</tspan></text></svg>