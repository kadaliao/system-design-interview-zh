<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>Quorum 相交，不自动阻止“读到 1 后又读到 0”</title><desc>三副本初始0，未完成写只到A；读1查AB返回1但不修复；后来读2查BC返回0。每次读都满足R2。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="560" fill="#fffdf7"/><rect width="1100" height="560" fill="url(#paper)"/><text class="title" x="35" y="42">Quorum 相交，不自动阻止“读到 1 后又读到 0”</text><text class="note" x="35" y="81" text-anchor="start"><tspan x="35" dy="0">设 N = 3，R = W = 2；写 1 仅到 A，尚未拿到两个确认；没有后续写</tspan></text><path d="M130,120 Q118,121 120,132 L121,192 Q120,203 132,202 L341,201 Q352,202 350,189 L349,131 Q350,118 338,121 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M133,124 L335,122 M346,135 L348,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="235.0" y="154" text-anchor="middle"><tspan x="235.0" dy="0">副本 A</tspan><tspan x="235.0" dy="23">x = 1（未完成写）</tspan></text><path d="M450,120 Q438,121 440,132 L441,192 Q440,203 452,202 L661,201 Q672,202 670,189 L669,131 Q670,118 658,121 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M453,124 L655,122 M666,135 L668,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="555.0" y="154" text-anchor="middle"><tspan x="555.0" dy="0">副本 B</tspan><tspan x="555.0" dy="23">x = 0</tspan></text><path d="M770,120 Q758,121 760,132 L761,192 Q760,203 772,202 L981,201 Q992,202 990,189 L989,131 Q990,118 978,121 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M773,124 L975,122 M986,135 L988,186" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="875.0" y="154" text-anchor="middle"><tspan x="875.0" dy="0">副本 C</tspan><tspan x="875.0" dy="23">x = 0</tspan></text><path d="M210,305 Q198,306 200,317 L201,377 Q200,388 212,387 L471,386 Q482,387 480,374 L479,316 Q480,303 468,306 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M213,309 L465,307 M476,320 L478,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="340.0" y="339" text-anchor="middle"><tspan x="340.0" dy="0">读 1：读取 A + B</tspan><tspan x="340.0" dy="23">选较新值 1，未写回</tspan></text><path d="M680,305 Q668,306 670,317 L671,377 Q670,388 682,387 L941,386 Q952,387 950,374 L949,316 Q950,303 938,306 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M683,309 L935,307 M946,320 L948,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="810.0" y="339" text-anchor="middle"><tspan x="810.0" dy="0">读 2：读取 B + C</tspan><tspan x="810.0" dy="23">只能返回旧值 0</tspan></text><path d="M235,202 L235,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,202 L510,250 L405,250 L405,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M595,202 L595,250 L740,250 L740,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M875,202 L875,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480,346 L670,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="495.0" y="308" width="160" height="22" rx="5" fill="#fffdf7"/><text class="label" x="575" y="325" text-anchor="middle"><tspan x="575" dy="0">读 1 完成后才发起</tspan></text><text class="note" x="35" y="455" text-anchor="start"><tspan x="35" dy="0">每个读集合都含 2 个副本，但相交的 B 只知道旧值。</tspan></text><text class="note" x="35" y="491" text-anchor="start"><tspan x="35" dy="0">某些强一致协议在读返回前写回多数派；还需版本规则、并发写排序与成员变更协议。</tspan></text></svg>