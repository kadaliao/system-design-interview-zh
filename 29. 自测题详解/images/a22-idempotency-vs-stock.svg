<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">两个保护层：幂等识别重复，库存处理争抢</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">同一请求重试与不同订单抢最后一间房，是两个独立问题</text><text x="48" y="146" font-size="23" text-anchor="start" font-weight="600" fill="#263244">情况 A：同一个 R7 再来一次</text><path d="M54 181 Q177.5 178 301 182 Q311 181 310 192 L311 295 Q310 307 300 305 L54 306 Q44 305 46 295 L44 192 Q45 181 54 181Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="177.5" y="235.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">第一次 R7 / 重试 R7</text><text x="177.5" y="265.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">请求内容必须相同</text><path d="M459 181 Q600.0 178 741 182 Q751 181 750 192 L751 295 Q750 307 740 305 L459 306 Q449 305 451 295 L449 192 Q450 181 459 181Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="600.0" y="235.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">幂等键唯一约束</text><text x="600.0" y="265.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">查证 R7 的已有状态</text><path d="M919 181 Q1047.5 178 1176 182 Q1186 181 1185 192 L1186 295 Q1185 307 1175 305 L919 306 Q909 305 911 295 L909 192 Q910 181 919 181Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1047.5" y="235.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">返回原结果</text><text x="1047.5" y="265.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">不再重复扣库存</text><polyline points="310,242 450,242" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="317.0" y="199" width="126" height="28" rx="4" fill="#fffdf7"/><text x="380" y="219" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">识别同一操作</text><polyline points="750,242 910,242" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="786.0" y="199" width="88" height="28" rx="4" fill="#fffdf7"/><text x="830" y="219" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">复用状态</text><text x="48" y="383" font-size="23" text-anchor="start" font-weight="600" fill="#263244">情况 B：R7 与 R8 都合法，但只剩一间</text><path d="M54 416 Q177.5 413 301 417 Q311 416 310 427 L311 530 Q310 542 300 540 L54 541 Q44 540 46 530 L44 427 Q45 416 54 416Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="177.5" y="470.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">两张不同订单</text><text x="177.5" y="500.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">R7 ≠ R8</text><path d="M459 416 Q600.0 413 741 417 Q751 416 750 427 L751 530 Q750 542 740 540 L459 541 Q449 540 451 530 L449 427 Q450 416 459 416Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="600.0" y="470.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">库存事务 / 条件更新</text><text x="600.0" y="500.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">剩余 1，只允许扣一次</text><path d="M919 416 Q1047.5 413 1176 417 Q1186 416 1185 427 L1186 530 Q1185 542 1175 540 L919 541 Q909 540 911 530 L909 427 Q910 416 919 416Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1047.5" y="470.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">一个成功，一个售罄</text><text x="1047.5" y="500.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">唯一订单 ID 不能代替它</text><polyline points="310,477 450,477" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="307.5" y="433" width="145" height="28" rx="4" fill="#fffdf7"/><text x="380" y="453" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">都可通过幂等层</text><polyline points="750,477 910,477" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><rect x="786.0" y="433" width="88" height="28" rx="4" fill="#fffdf7"/><text x="830" y="453" font-size="19" text-anchor="middle" font-weight="400" fill="#263244">争抢资源</text><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">幂等：同一件事做几次；库存控制：不同的人能买几份。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">请求超时先按原 ID 查询/重试；换一个新 ID 可能生成第二张订单。</text></g></svg>