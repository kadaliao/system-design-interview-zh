<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>令牌桶：容量管突发，速率管长期</title><desc>容量20补充速率5每秒，初始20令牌瞬时消耗20变0，一秒后5，四秒后20，不能无限累计。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">令牌桶：容量管突发，速率管长期</text><text class="note" x="35" y="80" text-anchor="start"><tspan x="35" dy="0">假设：每个请求消耗 1 个令牌，初始桶满，之后不再请求</tspan></text><path d="M45,115 Q33,116 35,127 L36,187 Q35,198 47,197 L231,196 Q242,197 240,184 L239,126 Q240,113 228,116 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,119 L225,117 M236,130 L238,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="149" text-anchor="middle"><tspan x="137.5" dy="0">t = 0，桶满</tspan><tspan x="137.5" dy="23">20 / 20 个令牌</tspan></text><path d="M315,115 Q303,116 305,127 L306,187 Q305,198 317,197 L501,196 Q512,197 510,184 L509,126 Q510,113 498,116 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M318,119 L495,117 M506,130 L508,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="149" text-anchor="middle"><tspan x="407.5" dy="0">瞬时放行 20 次</tspan><tspan x="407.5" dy="23">0 / 20 个令牌</tspan></text><path d="M585,115 Q573,116 575,127 L576,187 Q575,198 587,197 L771,196 Q782,197 780,184 L779,126 Q780,113 768,116 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M588,119 L765,117 M776,130 L778,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="149" text-anchor="middle"><tspan x="677.5" dy="0">经过 1 秒</tspan><tspan x="677.5" dy="23">5 / 20 个令牌</tspan></text><path d="M855,115 Q843,116 845,127 L846,187 Q845,198 857,197 L1041,196 Q1052,197 1050,184 L1049,126 Q1050,113 1038,116 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,119 L1035,117 M1046,130 L1048,181" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="149" text-anchor="middle"><tspan x="947.5" dy="0">经过 4 秒</tspan><tspan x="947.5" dy="23">20 / 20，已满</tspan></text><path d="M240,156 L305,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,156 L575,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,156 L845,156" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M110,290 Q98,291 100,302 L101,362 Q100,373 112,372 L491,371 Q502,372 500,359 L499,301 Q500,288 488,291 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M113,294 L485,292 M496,305 L498,356" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="300.0" y="324" text-anchor="middle"><tspan x="300.0" dy="0">容量 B = 20</tspan><tspan x="300.0" dy="23">最多积攒 20 次瞬时额度</tspan></text><path d="M610,290 Q598,291 600,302 L601,362 Q600,373 612,372 L991,371 Q1002,372 1000,359 L999,301 Q1000,288 988,291 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M613,294 L985,292 M996,305 L998,356" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="800.0" y="324" text-anchor="middle"><tspan x="800.0" dy="0">速率 r = 5 / 秒</tspan><tspan x="800.0" dy="23">持续有请求时限制长期速率</tspan></text><text class="note" x="35" y="432" text-anchor="start"><tspan x="35" dy="0">连续 Δt 时间内的放行上界约为 B + r × Δt，而不是每一秒最多 r 次。</tspan></text><text class="note" x="35" y="469" text-anchor="start"><tspan x="35" dy="0">空闲一分钟后仍只有 20 个令牌；桶满后新增令牌不再积累。</tspan></text></svg>