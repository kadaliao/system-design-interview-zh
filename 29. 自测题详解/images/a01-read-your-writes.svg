<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img"><title>读己之写：读取必须不早于本次成功写入</title><desc>昵称写入主库版本42，而异步副本仍在41；携带最低版本42的读取不能返回版本41。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="710" fill="#fffdf7"/><rect width="1040" height="710" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">读己之写：读取必须不早于本次成功写入</text><path d="M42 91 Q165.0 89.5 288 92 Q301 92 300 104 L299 192 Q300 205 287 204 L42 205 Q29 204 30 192 L31 103 Q30 91 42 91 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="123" class="head">用户修改昵称</text><text x="47" y="155">A → B</text><text x="47" y="183">写请求</text><path d="M301,148 L383,148" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="308" y="128" class="small">提交写入</text><path d="M408 91 Q535.0 89.5 662 92 Q675 92 674 104 L673 192 Q674 205 661 204 L408 205 Q395 204 396 192 L397 103 Q396 91 408 91 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="123" class="head">主库：版本 42</text><text x="413" y="155">昵称 = B；已提交</text><text x="413" y="183">写响应带版本 42</text><path d="M676,148 L754,148" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="680" y="127" class="small">异步复制</text><path d="M779 91 Q888.5 89.5 998 92 Q1011 92 1010 104 L1009 192 Q1010 205 997 204 L779 205 Q766 204 767 192 L768 103 Q767 91 779 91 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="784" y="123" class="head">从库：仍是 41</text><text x="784" y="155">昵称 = A</text><text x="784" y="183">尚未应用此次写入</text><path d="M160,205 L160,290" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="180" y="257" class="small">后续读取携带写版本</text><path d="M42 304 Q178.5 302.5 315 305 Q328 305 327 317 L326 398 Q327 411 314 410 L42 411 Q29 410 30 398 L31 316 Q30 304 42 304 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="336" class="head">读取个人资料</text><text x="47" y="368">min_version = 42</text><text x="47" y="396">缓存也必须满足该版本</text><path d="M329,357 L384,357" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M408 304 Q703.0 302.5 998 305 Q1011 305 1010 317 L1009 398 Q1010 411 997 410 L408 411 Q395 410 396 398 L397 316 Q396 304 408 304 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="336" class="head">检查副本进度：41 &lt; 42，不能直接返回 A</text><text x="413" y="368">读己之写要求至少看到 B，或比 B 更新的已提交版本。</text><path d="M539,411 L539,486" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="552" y="461" class="small">可等待</text><path d="M870,411 L870,486" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="882" y="461" class="small">等待超时</text><path d="M408 500 Q541.5 498.5 675 501 Q688 501 687 513 L686 587 Q687 600 674 599 L408 600 Q395 599 396 587 L397 512 Q396 500 408 500 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="413" y="532" class="head">等副本追到 42</text><text x="413" y="564">确认位点达标，再读取</text><path d="M732 500 Q865.0 498.5 998 501 Q1011 501 1010 513 L1009 587 Q1010 600 997 599 L732 600 Q719 599 720 587 L721 512 Q720 500 732 500 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="737" y="532" class="head">改读主库 / 明确失败</text><text x="737" y="564">不能无声降级成旧读取</text><path d="M42 637 Q520.0 635.5 998 638 Q1011 638 1010 650 L1009 678 Q1010 691 997 690 L42 691 Q29 690 30 678 L31 649 Q30 637 42 637 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="668">固定“写后 1 秒读主库”不是严格保证：复制延迟可能更久，故障切换也可能丢未复制写。</text></svg>