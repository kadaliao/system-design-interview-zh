<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="760" fill="#fffdf7"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#263244"><text x="42" y="52" font-size="31" text-anchor="start" font-weight="700" fill="#263244">Redis Cluster 分 key，不拆一个 ZSET 的成员</text><text x="42" y="92" font-size="20" text-anchor="start" font-weight="400" fill="#263244">一个大榜单 key 整体落在一个哈希槽；增加节点不会自动把成员切开</text><path d="M49 156 Q215.0 153 381 157 Q391 156 390 167 L391 275 Q390 287 380 285 L49 286 Q39 285 41 275 L39 167 Q40 156 49 156Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="215.0" y="213.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">leaderboard:month</text><text x="215.0" y="243.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">一亿成员，仍是一个 key</text><path d="M514 156 Q630.0 153 746 157 Q756 156 755 167 L756 275 Q755 287 745 285 L514 286 Q504 285 506 275 L504 167 Q505 156 514 156Z" fill="#fff1cc" stroke="#455166" stroke-width="2.5"/><text x="630.0" y="213.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">一个哈希槽</text><text x="630.0" y="243.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">CRC16(key) mod 16384</text><path d="M884 156 Q1035.0 153 1186 157 Q1196 156 1195 167 L1196 275 Q1195 287 1185 285 L884 286 Q874 285 876 275 L874 167 Q875 156 884 156Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1035.0" y="213.0" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">一个负责的主节点</text><text x="1035.0" y="243.0" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">保存整个 ZSET</text><polyline points="390,220 505,220" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="755,220 875,220" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><text x="45" y="371" font-size="23" text-anchor="start" font-weight="600" fill="#263244">应用先拆 key：示意这些 key 已确认分布到不同槽/节点</text><path d="M54 422 Q235.0 419 416 423 Q426 422 425 433 L426 606 Q425 618 415 616 L54 617 Q44 616 46 606 L44 433 Q45 422 54 422Z" fill="#e8f2ff" stroke="#455166" stroke-width="2.5"/><text x="235.0" y="496.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">board:month:s00</text><text x="235.0" y="526.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">board:month:s01</text><text x="235.0" y="556.5" font-size="20" text-anchor="middle" font-weight="400" fill="#263244">board:month:s02</text><path d="M834 411 Q1007.5 408 1181 412 Q1191 411 1190 422 L1191 463 Q1190 475 1180 473 L834 474 Q824 473 826 463 L824 422 Q825 411 834 411Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1007.5" y="449.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">槽 X → 节点 A</text><path d="M834 494 Q1007.5 491 1181 495 Q1191 494 1190 505 L1191 546 Q1190 558 1180 556 L834 557 Q824 556 826 546 L824 505 Q825 494 834 494Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1007.5" y="532.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">槽 Y → 节点 B</text><path d="M834 577 Q1007.5 574 1181 578 Q1191 577 1190 588 L1191 629 Q1190 641 1180 639 L834 640 Q824 639 826 629 L824 588 Q825 577 834 577Z" fill="#e7f4e2" stroke="#455166" stroke-width="2.5"/><text x="1007.5" y="615.5" font-size="22" text-anchor="middle" font-weight="600" fill="#263244">槽 Z → 节点 C</text><polyline points="425,489 590,489 590,442 825,442" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="425,519 825,524" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><polyline points="425,549 640,549 640,608 825,608" fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#ar)"/><text x="44" y="698" font-size="19" text-anchor="start" font-weight="400" fill="#263244">不要让所有分片 key 共用 {month} 标签，否则它们会被故意放进同一槽。</text><text x="44" y="727" font-size="19" text-anchor="start" font-weight="400" fill="#263244">应用分片后：全局 Top K 要合并，精确个人名次要跨片统计，跨槽原子操作也有限制。</text></g></svg>