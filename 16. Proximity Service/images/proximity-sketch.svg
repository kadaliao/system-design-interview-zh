<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">附近商家：先粗筛，再精算</text><text x="45" y="83" font-size="19" fill="#536070">格子用来减少候选量；精确距离用来保证结果属于搜索半径</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="235,275 335,275"/><polyline points="540,265 580,265 580,180 635,180"/><polyline points="752,225 752,355"/><polyline points="870,400 950,400 950,295 1000,295"/></g><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="263.0" y="239" width="46" height="25" rx="5" fill="#fffdf6"/><text x="286" y="257" text-anchor="middle" font-size="17" fill="#435165">查询</text><rect x="514.5" y="137" width="131" height="25" rx="5" fill="#fffdf6"/><text x="580" y="155" text-anchor="middle" font-size="17" fill="#435165">查询候选 ID</text><rect x="785.5" y="278" width="97" height="25" rx="5" fill="#fffdf6"/><text x="834" y="296" text-anchor="middle" font-size="17" fill="#435165">批量取详情</text><rect x="949.0" y="405" width="148" height="25" rx="5" fill="#fffdf6"/><text x="1023" y="423" text-anchor="middle" font-size="17" fill="#435165">按用户坐标算距离</text><path d="M43 232 Q135.0 228 227 231 Q237 232 234 242 L237 310 Q235 322 225 320 L44 322 Q33 320 36 310 L34 242 Q33 232 43 232Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="135.0" y="269.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">用户坐标</text><text x="135.0" y="295.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">经度 / 纬度 / 半径</text><path d="M343 232 Q437.5 228 532 231 Q542 232 539 242 L542 310 Q540 322 530 320 L344 322 Q333 320 336 310 L334 242 Q333 232 343 232Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="437.5" y="269.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">LBS</text><text x="437.5" y="295.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">选择 Geohash 精度</text><path d="M643 137 Q752.5 133 862 136 Q872 137 869 147 L872 215 Q870 227 860 225 L644 227 Q633 225 636 215 L634 147 Q633 137 643 137Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="752.5" y="174.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">空间索引 / 缓存</text><text x="752.5" y="200.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">本格 + 覆盖范围邻格</text><path d="M643 357 Q752.5 353 862 356 Q872 357 869 367 L872 435 Q870 447 860 445 L644 447 Q633 445 636 435 L634 367 Q633 357 643 357Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="752.5" y="394.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">商家详情</text><text x="752.5" y="420.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">ID → 地址 / 坐标</text><path d="M1008 232 Q1100.0 228 1192 231 Q1202 232 1199 242 L1202 310 Q1200 322 1190 320 L1009 322 Q998 320 1001 310 L999 242 Q998 232 1008 232Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="1100.0" y="269.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">返回结果</text><text x="1100.0" y="295.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">精确过滤 + 排序</text></g><text x="45" y="582" font-size="18" fill="#344054">记忆：同格不等于同距离；边界两侧的人可能很近但没有共同前缀。</text><text x="45" y="609" font-size="18" fill="#344054">九宫格是常见示例，必须检查所选网格是否真正覆盖整个搜索圆。</text></svg>