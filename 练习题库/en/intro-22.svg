<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img"><title>Hotel Reservation: dedupe retries, prevent overselling</title><desc>Left: an idempotency key merges duplicate submissions. Right: a database transaction protects inventory across several stay dates.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:22px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="740" fill="#fffdf7"/><rect width="1040" height="740" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Hotel Reservation: dedupe retries, prevent overselling</text><path d="M37 75 Q257.5 73.5 478 76 Q491 76 490 88 L489 673 Q490 686 477 685 L37 686 Q24 685 25 673 L26 87 Q25 75 37 75 Z" fill="#faf6e9" stroke="#263b48" stroke-width="2.4"/><path d="M557 75 Q780.0 73.5 1003 76 Q1016 76 1015 88 L1014 673 Q1015 686 1002 685 L557 686 Q544 685 545 673 L546 87 Q545 75 557 75 Z" fill="#eff6f7" stroke="#263b48" stroke-width="2.4"/><text x="45" y="112" class="head">Layer 1: process each order once</text><text x="565" y="112" class="head">Layer 2: orders compete for stock</text><path d="M60 143 Q141.5 141.5 223 144 Q236 144 235 156 L234 221 Q235 234 222 233 L60 234 Q47 233 48 221 L49 155 Q48 143 60 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="65" y="174">First submit</text><text x="65" y="202">Order R42</text><path d="M294 143 Q374.0 141.5 454 144 Q467 144 466 156 L465 221 Q466 234 453 233 L294 234 Q281 233 282 221 L283 155 Q282 143 294 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="299" y="174">Retry on timeout</text><text x="299" y="202">Still R42</text><path d="M142,234 L142,258 L257,258 L257,282" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M375,234 L375,258 L280,258" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="283" y="277" class="small">Same request</text><path d="M84 292 Q258.5 290.5 433 293 Q446 293 445 305 L444 395 Q445 408 432 407 L84 408 Q71 407 72 395 L73 304 Q72 292 84 292 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="89" y="324" class="head">Unique reservation_id</text><text x="89" y="356">Claim the order row; skip duplicates</text><text x="89" y="384">One key, one set of parameters</text><path d="M257,408 L257,440" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M84 450 Q258.5 448.5 433 451 Q446 451 445 463 L444 543 Q445 556 432 555 L84 556 Q71 555 72 543 L73 462 Q72 450 84 450 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="89" y="482" class="head">One result, reused</text><text x="89" y="514">Save the result after the first run</text><text x="89" y="542">Retries return the saved result</text><text x="50" y="596" class="small">E.g. a double click, a network resend.</text><text x="50" y="623" class="small">Disabling the button can’t stop retries.</text><text x="50" y="650" class="small">Same R42, other parameters: reject.</text><path d="M580 143 Q661.5 141.5 743 144 Q756 144 755 156 L754 221 Q755 234 742 233 L580 234 Q567 233 568 221 L569 155 Q568 143 580 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="585" y="174">Order R43</text><text x="585" y="202">Books 6/1–6/3</text><path d="M814 143 Q895.0 141.5 976 144 Q989 144 988 156 L987 221 Q988 234 975 233 L814 234 Q801 233 802 221 L803 155 Q802 143 814 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="819" y="174">Order R44</text><text x="819" y="202">Same two nights</text><path d="M660,234 L660,258 L780,258 L780,283" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M895,234 L895,258 L803,258" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M590 292 Q781.5 290.5 973 293 Q986 293 985 305 L984 432 Q985 445 972 444 L590 445 Q577 444 578 432 L579 304 Q578 292 590 292 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="595" y="324" class="head">One database transaction</text><text x="595" y="356">Check by hotel + room_type + date</text><text x="595" y="384">Lock or conditionally update each night</text><text x="595" y="412">No night exceeds its sellable limit</text><path d="M780,445 L780,480" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M590 490 Q781.5 488.5 973 491 Q986 491 985 503 L984 596 Q985 609 972 608 L590 609 Q577 608 578 596 L579 502 Q578 490 590 490 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="595" y="522" class="head">All nights succeed or fail</text><text x="595" y="554">All succeed: commit order + stock</text><text x="595" y="582">Any night short: roll back everything</text><text x="566" y="649" class="small">Keys don’t stop a race for the last room.</text><text x="35" y="720" class="head">Idempotency stops repeats; transactions and locking protect shared stock.</text></svg>