<svg xmlns="http://www.w3.org/2000/svg" font-family="'Chalkboard SE','Comic Sans MS','Marker Felt',cursive" width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">Monitoring: Collect, Buffer, Query, Alert</text><text x="45" y="83" font-size="19" fill="#536070">Input is metric time series; logs and distributed tracing are out of scope</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="225,280 325,280"/><polyline points="525,280 625,280"/><polyline points="825,280 990,280"/><polyline points="1090,325 1090,420"/><polyline points="990,463 845,463"/></g><g font-family="'Chalkboard SE','Comic Sans MS','Marker Felt',cursive"><rect x="233.0" y="242" width="84" height="25" rx="5" fill="#fffdf6"/><text x="275" y="260" text-anchor="middle" font-size="17" fill="#435165">collect</text><rect x="533.0" y="242" width="84" height="25" rx="5" fill="#fffdf6"/><text x="575" y="260" text-anchor="middle" font-size="17" fill="#435165">enqueue</text><rect x="864.0" y="242" width="84" height="25" rx="5" fill="#fffdf6"/><text x="906" y="260" text-anchor="middle" font-size="17" fill="#435165">write</text><rect x="1098.0" y="360" width="84" height="25" rx="5" fill="#fffdf6"/><text x="1140" y="378" text-anchor="middle" font-size="17" fill="#435165">read</text><rect x="872.0" y="425" width="84" height="25" rx="5" fill="#fffdf6"/><text x="914" y="443" text-anchor="middle" font-size="17" fill="#435165">results</text><path d="M43 237 Q130.0 233 217 236 Q227 237 224 247 L227 315 Q225 327 215 325 L44 327 Q33 325 36 315 L34 247 Q33 237 43 237Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="130.0" y="274.0" text-anchor="middle" font-size="20" font-weight="600" fill="#253145">Services / Agents</text><text x="130.0" y="300.0" text-anchor="middle" font-size="16" font-weight="400" fill="#253145">name + labels + point</text><path d="M333 237 Q425.0 233 517 236 Q527 237 524 247 L527 315 Q525 327 515 325 L334 327 Q323 325 326 315 L324 247 Q323 237 333 237Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="425.0" y="274.0" text-anchor="middle" font-size="20" font-weight="600" fill="#253145">Collectors</text><text x="425.0" y="300.0" text-anchor="middle" font-size="16" font-weight="400" fill="#253145">Pull or push</text><path d="M633 237 Q725.0 233 817 236 Q827 237 824 247 L827 315 Q825 327 815 325 L634 327 Q623 325 626 315 L624 247 Q623 237 633 237Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="725.0" y="274.0" text-anchor="middle" font-size="20" font-weight="600" fill="#253145">Kafka buffer</text><text x="725.0" y="300.0" text-anchor="middle" font-size="16" font-weight="400" fill="#253145">then write to TSDB</text><path d="M998 237 Q1090.0 233 1182 236 Q1192 237 1189 247 L1192 315 Q1190 327 1180 325 L999 327 Q988 325 991 315 L989 247 Q988 237 998 237Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="1090.0" y="274.0" text-anchor="middle" font-size="20" font-weight="600" fill="#253145">Time-series DB</text><text x="1090.0" y="300.0" text-anchor="middle" font-size="16" font-weight="400" fill="#253145">partitioned, compressed</text><path d="M998 422 Q1090.0 418 1182 421 Q1192 422 1189 432 L1192 495 Q1190 507 1180 505 L999 507 Q988 505 991 495 L989 432 Q988 422 998 422Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="1090.0" y="456.5" text-anchor="middle" font-size="20" font-weight="600" fill="#253145">Query API</text><text x="1090.0" y="482.5" text-anchor="middle" font-size="16" font-weight="400" fill="#253145">aggregate + cache</text><path d="M633 422 Q735.0 418 837 421 Q847 422 844 432 L847 495 Q845 507 835 505 L634 507 Q623 505 626 495 L624 432 Q623 422 633 422Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="735.0" y="456.5" text-anchor="middle" font-size="20" font-weight="600" fill="#253145">Dashboards / Alerts</text><text x="735.0" y="482.5" text-anchor="middle" font-size="16" font-weight="400" fill="#253145">trends / rules / notify</text></g><text x="45" y="582" font-size="18" fill="#344054">Remember: steady writes, bursty queries in incidents; the queue isolates downstream failures.</text><text x="45" y="609" font-size="18" fill="#344054">Control label combinations; missing data is not healthy; alert dedup and retries need saved state.</text></svg>