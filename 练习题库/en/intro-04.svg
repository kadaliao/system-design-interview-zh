<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><title>The rate limiter controls requests</title><desc>Client requests enter the rate limiter; with quota they reach the business service, without quota they get a 429.</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#243447} .box{fill:#fff8dc;stroke:#314e68;stroke-width:3;rx:18}.arrow{stroke:#e07a5f;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#e07a5f"/></marker></defs><rect class="box" x="25" y="95" width="145" height="80"/><text x="45" y="130" font-size="23">Requests</text><text x="50" y="158" font-size="17">from clients</text><line class="arrow" x1="170" y1="135" x2="260" y2="135"/><rect class="box" x="260" y="70" width="210" height="130"/><text x="285" y="112" font-size="24">Rate Limiter</text><text x="286" y="145" font-size="18">Tokens left? Pass</text><text x="286" y="173" font-size="18">None? Try later</text><line class="arrow" x1="470" y1="110" x2="570" y2="75"/><line class="arrow" x1="470" y1="160" x2="570" y2="205"/><rect class="box" x="570" y="35" width="160" height="70"/><text x="600" y="77" font-size="20">Service</text><rect class="box" x="570" y="170" width="160" height="70"/><text x="600" y="212" font-size="20">429 Rejected</text><text x="25" y="275" font-size="18">Like a gate guard: control the entry rate and protect the services behind it.</text></svg>
