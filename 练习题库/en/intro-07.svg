<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260"><title>Snowflake field layout</title><desc>1 sign bit, 41 time bits, 5 data center bits, 5 machine bits, and 12 sequence bits; widths are not proportional to bit counts.</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#243447}.s{stroke:#fff;stroke-width:2}.t{font-size:18px;text-anchor:middle}.h{font-size:21px;text-anchor:middle}</style><rect x="35" y="80" width="70" height="70" fill="#f2cc8f" class="s"/><rect x="105" y="80" width="300" height="70" fill="#81b29a" class="s"/><rect x="405" y="80" width="120" height="70" fill="#f28482" class="s"/><rect x="525" y="80" width="120" height="70" fill="#84a59d" class="s"/><rect x="645" y="80" width="120" height="70" fill="#f6bd60" class="s"/><text x="70" y="120" class="t">Sign 1</text><text x="255" y="120" class="t">Timestamp 41</text><text x="465" y="120" class="t">DC 5</text><text x="585" y="120" class="t">Machine 5</text><text x="705" y="120" class="t">Seq 12</text><text x="400" y="35" class="h">One ID = time + location + per-millisecond sequence</text><text x="400" y="242" font-size="14" text-anchor="middle">Illustrative layout; widths are not proportional to bit counts. DC = data center</text><text x="400" y="205" class="h">Guard against clock rollback; wait out an exhausted sequence</text></svg>
