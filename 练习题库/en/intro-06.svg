<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330"><title>Key-value store: coordinator and replicas</title><desc>The client calls the coordinator, which routes by key to the three replicas of the data.</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#243447}.b{fill:#eef7f2;stroke:#355c4d;stroke-width:3;rx:16}.a{stroke:#e07a5f;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#e07a5f"/></marker></defs><rect class="b" x="25" y="120" width="135" height="75"/><text x="92" y="165" font-size="22" text-anchor="middle">Client</text><line class="a" x1="160" y1="158" x2="245" y2="158"/><rect class="b" x="245" y="95" width="170" height="125"/><text x="330" y="140" font-size="22" text-anchor="middle">Coordinator</text><text x="330" y="175" font-size="17" text-anchor="middle">Routing + R/W</text><line class="a" x1="415" y1="125" x2="505" y2="75"/><line class="a" x1="415" y1="158" x2="505" y2="158"/><line class="a" x1="415" y1="190" x2="505" y2="240"/><rect class="b" x="505" y="35" width="220" height="65"/><text x="615" y="74" font-size="20" text-anchor="middle">Node A (replica)</text><rect class="b" x="505" y="125" width="220" height="65"/><text x="615" y="164" font-size="20" text-anchor="middle">Node B (replica)</text><rect class="b" x="505" y="215" width="220" height="65"/><text x="615" y="254" font-size="20" text-anchor="middle">Node C (replica)</text></svg>
