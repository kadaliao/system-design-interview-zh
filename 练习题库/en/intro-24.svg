<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="765" viewBox="0 0 1040 765" role="img"><title>Object read: name to UUID, UUID to node, node to bytes</title><desc>The bucket and key are first mapped to an object UUID, which locates the data replicas; finally the node’s local mapping finds the offset and length inside a large file.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="765" fill="#fffdf7"/><rect width="1040" height="765" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Object read: name → UUID → node → bytes</text><path d="M42 82 Q165.0 80.5 288 83 Q301 83 300 95 L299 204 Q300 217 287 216 L42 217 Q29 216 30 204 L31 94 Q30 82 42 82 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="114" class="head">① Object name</text><text x="47" y="146">bucket = photos</text><text x="47" y="174">key = 2026/a.jpg</text><text x="47" y="202">API has passed IAM auth</text><path d="M302,150 L350,150" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M375 82 Q686.5 80.5 998 83 Q1011 83 1010 95 L1009 204 Q1010 217 997 216 L375 217 Q362 216 363 204 L364 94 Q363 82 375 82 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="380" y="114" class="head">② Object metadata: external name → internal ID</text><text x="380" y="146">(photos, 2026/a.jpg, version=v3) → UUID = u7</text><text x="380" y="174">Records size, version, and permissions; not the bytes</text><path d="M700,217 L700,259" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="727" y="245" class="small">Got u7</text><path d="M414 274 Q706.0 272.5 998 275 Q1011 275 1010 287 L1009 377 Q1010 390 997 389 L414 390 Q401 389 402 377 L403 286 Q402 274 414 274 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="419" y="306" class="head">③ Data routing / placement</text><text x="419" y="338">Pick a replica group {N1, N2, N3} by UUID</text><text x="419" y="366">Read a live replica, e.g. N2; never scan all files</text><path d="M700,390 L700,420 L285,420 L285,454" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="338" y="409" class="small">Ask N2 for UUID u7</text><path d="M42 469 Q520.0 467.5 998 470 Q1011 470 1010 482 L1009 673 Q1010 686 997 685 L42 686 Q29 685 30 673 L31 481 Q30 469 42 469 Z" fill="#eff6f1" stroke="#263b48" stroke-width="2.4"/><text x="47" y="501" class="head">④ Inside data node N2: object_mapping is a local index</text><path d="M65 523 Q306.5 521.5 548 524 Q561 524 560 536 L559 636 Q560 649 547 648 L65 649 Q52 648 53 636 L54 535 Q53 523 65 523 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="70" y="555" class="code">object_id</text><text x="70" y="584" class="code">u7</text><text x="191" y="555" class="code">filename</text><text x="191" y="584" class="code">/data/c</text><text x="332" y="555" class="code">offset</text><text x="332" y="584" class="code">8192</text><text x="448" y="555" class="code">size</text><text x="448" y="584" class="code">4096</text><text x="70" y="620">One big file holds many objects</text><path d="M562,581 L629,581" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="578" y="562" class="small">Locate</text><path d="M656 523 Q814.5 521.5 973 524 Q986 524 985 536 L984 636 Q985 649 972 648 L656 649 Q643 648 644 636 L645 535 Q644 523 656 523 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="661" y="555" class="head">⑤ A byte range in /data/c</text><text x="661" y="587">Read [8192, 12288)</text><text x="661" y="615">= 4096 bytes from the offset</text><text x="35" y="729" class="head" style="font-size:21px">Two mappings: metadata resolves names; the local index resolves disk locations.</text></svg>