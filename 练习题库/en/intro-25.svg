<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img"><title>Redis Sorted Set: score, rank, and top list are three different operations</title><desc>After verifying a win, the game service updates the sorted set, where the member is user_id and the score is the points; ZSCORE gets the score, ZREVRANK gets the zero-based position, and ZREVRANGE gets the top 10.</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="740" fill="#fffdf7"/><rect width="1040" height="740" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">Sorted Set: Score, Rank, and Top 10 Are Three Operations</text><path d="M42 85 Q195.0 83.5 348 86 Q361 86 360 98 L359 196 Q360 209 347 208 L42 209 Q29 208 30 196 L31 97 Q30 85 42 85 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="117" class="head">Trusted game service</text><text x="47" y="149">Verify win, dedup match_id</text><text x="47" y="177">ZINCRBY board:2026-09 1 alice</text><path d="M361,148 L417,148" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="378" y="129" class="small">+1</text><path d="M442 85 Q720.0 83.5 998 86 Q1011 86 1010 98 L1009 325 Q1010 338 997 337 L442 338 Q429 337 430 325 L431 97 Q430 85 442 85 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="447" y="117" class="head">Sorted Set: member = user_id, score = points</text><text x="453" y="159" class="small">Example descending sequence (illustrates API semantics)</text><text x="455" y="199">Position 0</text><text x="610" y="199" class="code">alice</text><text x="825" y="199">Score 120</text><text x="455" y="238">Position 1</text><text x="610" y="238" class="code">bob</text><text x="825" y="238">Score 110</text><text x="455" y="277">Position 2</text><text x="610" y="277" class="code">carol</text><text x="825" y="277">Score 100</text><text x="454" y="316" class="small">Members are unique; board = this month’s key.</text><path d="M42 258 Q195.0 256.5 348 259 Q361 259 360 271 L359 325 Q360 338 347 337 L42 338 Q29 337 30 325 L31 270 Q30 258 42 258 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="289">No client-reported scores</text><text x="47" y="317">Replayed wins can’t add twice</text><path d="M514,338 L514,363 L196,363 L196,414" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="49" y="390" class="small">Same board</text><path d="M714,338 L714,387 L530,387 L530,414" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M912,338 L912,414" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M42 429 Q189.5 427.5 337 430 Q350 430 349 442 L348 552 Q349 565 336 564 L42 565 Q29 564 30 552 L31 441 Q30 429 42 429 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="461" class="head">① Get a player’s score</text><text x="47" y="493">ZSCORE board alice</text><text x="47" y="521">Returns 120; not a rank</text><path d="M378 429 Q519.5 427.5 661 430 Q674 430 673 442 L672 552 Q673 565 660 564 L378 565 Q365 564 366 552 L367 441 Q366 429 378 429 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="383" y="461" class="head">② Get sorted position</text><text x="383" y="493">ZREVRANK board alice</text><text x="383" y="521">Returns 0; display as +1</text><path d="M702 429 Q850.0 427.5 998 430 Q1011 430 1010 442 L1009 552 Q1010 565 997 564 L702 565 Q689 564 690 552 L691 441 Q690 429 702 429 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="707" y="461" class="head">③ Get the top 10</text><text x="707" y="493">ZREVRANGE board 0 9</text><text x="707" y="521">WITHSCORES adds scores</text><path d="M42 605 Q520.0 603.5 998 606 Q1011 606 1010 618 L1009 692 Q1010 705 997 704 L42 705 Q29 704 30 692 L31 617 Q30 605 42 605 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="637" class="head">Tied ranks are a business rule, not Redis’s sorted position</text><text x="47" y="669" style="font-size:18px">Ties still get different Redis positions. For shared ranks: 1 + players with a strictly higher score.</text></svg>