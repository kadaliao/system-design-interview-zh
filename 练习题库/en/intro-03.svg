<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <rect width="980" height="500" fill="#fffdf7"/>
  <style>.b{fill:#fffaf0;stroke:#2e4057;stroke-width:4;stroke-linejoin:round}.t{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#1f2937}.h{font-size:25px;font-weight:bold}.p{font-size:17px}.a{fill:none;stroke:#e07a5f;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 8}</style>
  <text x="40" y="42" class="t h">The 45-minute interview loop: align, expand, close</text>
  <g transform="translate(70,110) rotate(-2)"><rect class="b" width="190" height="110" rx="20"/><text x="20" y="42" class="t h">1 Clarify</text><text x="20" y="75" class="t p">Goals and scale</text></g>
  <g transform="translate(295,110) rotate(2)"><rect class="b" width="190" height="110" rx="20"/><text x="20" y="42" class="t h">2 Blueprint</text><text x="20" y="75" class="t p">High-level parts</text></g>
  <g transform="translate(520,110) rotate(-1)"><rect class="b" width="190" height="110" rx="20"/><text x="20" y="42" class="t h">3 Deep dive</text><text x="20" y="75" class="t p">Dig into the risks</text></g>
  <g transform="translate(745,110) rotate(2)"><rect class="b" width="170" height="110" rx="20"/><text x="20" y="42" class="t h">4 Wrap up</text><text x="20" y="75" class="t p">Recap, evolution</text></g>
  <path d="M260 165 C275 140 280 140 295 165 M485 165 C500 140 505 140 520 165 M710 165 C725 140 730 140 745 165" class="a"/>
  <path d="M830 235 C850 315 700 390 490 390 C280 390 130 330 150 235" class="a"/>
  <text x="60" y="430" class="t p">At every step, check with the interviewer: does this direction match the question’s priorities?</text>
</svg>
