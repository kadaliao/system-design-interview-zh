<svg xmlns="http://www.w3.org/2000/svg" font-family='"Avenir Next","Helvetica Neue",Arial,sans-serif' width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">Map product: three parallel paths</text><text x="45" y="83" font-size="19" fill="#536070">Map display, location reporting, and navigation each have their own job; it is not a serial pipeline</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="230,250 290,250 290,162 360,162"/><polyline points="230,278 315,278 315,317 360,317"/><polyline points="230,305 270,305 270,472 360,472"/><polyline points="580,162 820,162"/><polyline points="580,472 820,472"/></g><g ><rect x="258.5" y="121" width="63" height="25" rx="5" fill="#fffdf6"/><text x="290" y="139" text-anchor="middle" font-size="17" fill="#435165">GPS</text><rect x="232" y="498" width="110" height="25" rx="5" fill="#fffdf6"/><text x="287" y="516" text-anchor="middle" font-size="17" fill="#435165">Route request</text><rect x="635" y="126" width="130" height="25" rx="5" fill="#fffdf6"/><text x="700" y="144" text-anchor="middle" font-size="17" fill="#435165">Location stream</text><rect x="625" y="436" width="150" height="25" rx="5" fill="#fffdf6"/><text x="700" y="454" text-anchor="middle" font-size="17" fill="#435165">Query + compute</text><path d="M43 232 Q132.5 228 222 231 Q232 232 229 242 L232 315 Q230 327 220 325 L44 327 Q33 325 36 315 L34 242 Q33 232 43 232Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="132.5" y="271.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Map client</text><text x="132.5" y="297.5" text-anchor="middle" font-size="15" font-weight="400" fill="#253145">Locate / pan / navigate</text><path d="M368 122 Q470.0 118 572 121 Q582 122 579 132 L582 195 Q580 207 570 205 L369 207 Q358 205 361 195 L359 132 Q358 122 368 122Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="470.0" y="156.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Location service</text><text x="470.0" y="182.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Batched reports</text><path d="M368 277 Q470.0 273 572 276 Q582 277 579 287 L582 350 Q580 362 570 360 L369 362 Q358 360 361 350 L359 287 Q358 277 368 277Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="470.0" y="311.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Map tile CDN</text><text x="470.0" y="337.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Fetch by zoom / area</text><path d="M368 432 Q470.0 428 572 431 Q582 432 579 442 L582 505 Q580 517 570 515 L369 517 Q358 515 361 505 L359 442 Q358 432 368 432Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="470.0" y="466.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Navigation service</text><text x="470.0" y="492.5" text-anchor="middle" font-size="15" font-weight="400" fill="#253145">Origin + destination + mode</text><path d="M828 122 Q985.0 118 1142 121 Q1152 122 1149 132 L1152 195 Q1150 207 1140 205 L829 207 Q818 205 821 195 L819 132 Q818 122 828 122Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="985.0" y="156.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Location store / Kafka</text><text x="985.0" y="182.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Traffic and ETA analysis</text><path d="M828 432 Q985.0 428 1142 431 Q1152 432 1149 442 L1152 505 Q1150 517 1140 515 L829 517 Q818 515 821 505 L819 442 Q818 432 828 432Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="985.0" y="466.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Routing graph + traffic</text><text x="985.0" y="492.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Search / ETA / route ranking</text></g><text x="45" y="582" font-size="18" fill="#344054">Memory hook: image and vector tiles are for “seeing”; nodes and edges in routing tiles are for “computing”.</text><text x="45" y="609" font-size="18" fill="#344054">The client stitches tiles; the navigation service routes by roads and rules, and traffic changes refresh the ETA.</text></svg>