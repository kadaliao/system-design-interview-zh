<svg xmlns="http://www.w3.org/2000/svg" font-family='"Chalkboard SE","Comic Sans MS","Marker Felt",cursive' width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">Ad clicks: keep raw, aggregate by window, recompute</text><text x="45" y="83" font-size="19" fill="#536070">Events arrive late, twice, and out of order; accurate billing needs state and output to stay consistent</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="215,270 315,270"/><polyline points="525,247 585,247 585,165 650,165"/><polyline points="525,292 585,292 585,395 650,395"/><polyline points="880,395 1010,395"/><polyline points="1105,350 1105,210"/><polyline points="765,210 765,350"/></g><g font-family='"Chalkboard SE","Comic Sans MS","Marker Felt",cursive'><rect x="236.0" y="232" width="58" height="25" rx="5" fill="#fffdf6"/><text x="265" y="250" text-anchor="middle" font-size="17" fill="#435165">Ingest</text><rect x="540.0" y="127" width="84" height="25" rx="5" fill="#fffdf6"/><text x="582" y="145" text-anchor="middle" font-size="17" fill="#435165">Keep raw</text><rect x="524.0" y="463" width="120" height="25" rx="5" fill="#fffdf6"/><text x="584" y="481" text-anchor="middle" font-size="17" fill="#435165">By partition</text><rect x="910.0" y="358" width="70" height="25" rx="5" fill="#fffdf6"/><text x="945" y="376" text-anchor="middle" font-size="17" fill="#435165">Commit</text><rect x="1125.0" y="265" width="50" height="25" rx="5" fill="#fffdf6"/><text x="1150" y="283" text-anchor="middle" font-size="17" fill="#435165">Read</text><rect x="772.0" y="266" width="160" height="25" rx="5" fill="#fffdf6"/><text x="852" y="284" text-anchor="middle" font-size="17" fill="#435165">Replay / backfill</text><path d="M43 227 Q125.0 223 207 226 Q217 227 214 237 L217 305 Q215 317 205 315 L44 317 Q33 315 36 305 L34 237 Q33 227 43 227Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="125.0" y="264.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Click events</text><text x="125.0" y="290.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">event_id + event time</text><path d="M323 227 Q420.0 223 517 226 Q527 227 524 237 L527 305 Q525 317 515 315 L324 317 Q313 315 316 305 L314 237 Q313 227 323 227Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="420.0" y="264.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Kafka input log</text><text x="420.0" y="290.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Replayable events</text><path d="M658 122 Q765.0 118 872 121 Q882 122 879 132 L882 200 Q880 212 870 210 L659 212 Q648 210 651 200 L649 132 Q648 122 658 122Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="765.0" y="159.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Raw event store</text><text x="765.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Reconcile / recompute</text><path d="M658 352 Q765.0 348 872 351 Q882 352 879 362 L882 430 Q880 442 870 440 L659 442 Q648 440 651 430 L649 362 Q648 352 658 352Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="765.0" y="389.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Window aggregation</text><text x="765.0" y="415.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">State + input offset</text><path d="M1018 352 Q1105.0 348 1192 351 Q1202 352 1199 362 L1202 430 Q1200 442 1190 440 L1019 442 Q1008 440 1011 430 L1009 362 Q1008 352 1018 352Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="1105.0" y="389.0" text-anchor="middle" font-size="18" font-weight="600" fill="#253145">Result queue / DB</text><text x="1105.0" y="415.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Idempotent commits</text><path d="M1018 122 Q1105.0 118 1192 121 Q1202 122 1199 132 L1202 200 Q1200 212 1190 210 L1019 212 Q1008 210 1011 200 L1009 132 Q1008 122 1018 122Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="1105.0" y="159.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Reports / billing</text><text x="1105.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Query by window</text></g><text x="45" y="582" font-size="18" fill="#344054">Memory hook: windows decide which bucket an event belongs to; a watermark tracks event-time progress, not window length.</text><text x="45" y="609" font-size="18" fill="#344054">Snapshots must match offsets. Raw logs enable reconciliation; versions keep recomputes from clobbering results.</text></svg>