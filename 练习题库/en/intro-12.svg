<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.node{font:600 17px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#27343b}.label{font:16px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#35424a}.note{font:17px "Avenir Next","Helvetica Neue",Arial,sans-serif;fill:#5a625f}</style><title>Chat: Beyond the Real-Time Channel, You Need a Catch-Up Path</title><desc>A sends over WebSocket; the service persists the message and delivers it in real time to online B. Offline B can get a push notification, and after reconnecting B catches up from persisted history using a safe cursor.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">Chat: Beyond the Real-Time Channel, You Need a Catch-Up Path</text><path d="M45,110 Q33,111 35,122 L36,182 Q35,193 47,192 L231,191 Q242,192 240,179 L239,121 Q240,108 228,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,114 L225,112 M236,125 L238,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="144" text-anchor="middle"><tspan x="137.5" dy="0">Device A</tspan><tspan x="137.5" dy="23">Sends message</tspan></text><path d="M315,110 Q303,111 305,122 L306,182 Q305,193 317,192 L501,191 Q512,192 510,179 L509,121 Q510,108 498,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,114 L495,112 M506,125 L508,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="144" text-anchor="middle"><tspan x="407.5" dy="0">Chat service</tspan><tspan x="407.5" dy="23">Stable message ID</tspan></text><path d="M585,110 Q573,111 575,122 L576,182 Q575,193 587,192 L771,191 Q782,192 780,179 L779,121 Q780,108 768,111 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M588,114 L765,112 M776,125 L778,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="144" text-anchor="middle"><tspan x="677.5" dy="0">Persisted history</tspan><tspan x="677.5" dy="23">Per-chat ordering</tspan></text><path d="M855,110 Q843,111 845,122 L846,182 Q845,193 857,192 L1041,191 Q1052,192 1050,179 L1049,121 Q1050,108 1038,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M858,114 L1035,112 M1046,125 L1048,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="144" text-anchor="middle"><tspan x="947.5" dy="0">Device B online</tspan><tspan x="947.5" dy="23">WebSocket delivery</tspan></text><path d="M240,151 L305,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,151 L575,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,151 L845,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M315,305 Q303,306 305,317 L306,377 Q305,388 317,387 L501,386 Q512,387 510,374 L509,316 Q510,303 498,306 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M318,309 L495,307 M506,320 L508,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="339" text-anchor="middle"><tspan x="407.5" dy="0">B offline</tspan><tspan x="407.5" dy="23">Push alert sent</tspan></text><path d="M585,305 Q573,306 575,317 L576,377 Q575,388 587,387 L771,386 Q782,387 780,374 L779,316 Q780,303 768,306 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M588,309 L765,307 M776,320 L778,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="339" text-anchor="middle"><tspan x="677.5" dy="0">B back / new device</tspan><tspan x="677.5" dy="23">Sends sync cursor</tspan></text><path d="M855,305 Q843,306 845,317 L846,377 Q845,388 857,387 L1041,386 Q1052,387 1050,374 L1049,316 Q1050,303 1038,306 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M858,309 L1035,307 M1046,320 L1048,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="339" text-anchor="middle"><tspan x="947.5" dy="0">Fetch unconfirmed</tspan><tspan x="947.5" dy="23">Dedup, advance cursor</tspan></text><path d="M650,192 L650,235 L407,235 L407,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="497.5" y="209" width="55" height="22" rx="5" fill="#fffdf7"/><text class="label" x="525" y="226" text-anchor="middle"><tspan x="525" dy="0">Offline</tspan></text><path d="M510,346 L575,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="523.0" y="308" width="40" height="22" rx="5" fill="#fffdf7"/><text class="label" x="543" y="325" text-anchor="middle"><tspan x="543" dy="0">Later</tspan></text><path d="M678,305 L678,192" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="711.0" y="235" width="70" height="22" rx="5" fill="#fffdf7"/><text class="label" x="746" y="252" text-anchor="middle"><tspan x="746" dy="0">Query</tspan></text><path d="M780,346 L845,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="436" text-anchor="start"><tspan x="35" dy="0">Per-chat local IDs → keep a cursor per chat; a user-level inbox can use its own monotonic sync sequence.</tspan></text><text class="note" x="35" y="468" text-anchor="start"><tspan x="35" dy="0">WebSocket delivers promptly; persistence and catch-up recover; dedup makes retries safe.</tspan></text></svg>