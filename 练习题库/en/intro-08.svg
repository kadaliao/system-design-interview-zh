<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#27343b}.node{font:600 19px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#27343b}.label{font:16px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#35424a}.note{font:17px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#5a625f}</style><title>Short URLs: Creation and Redirect Are Two Separate Paths</title><desc>Top: creation. A long URL gets a unique ID, is Base62-encoded, and is written to the mapping table. Bottom: redirect. The short code is looked up in the cache first, then the database on a miss, and a redirect is returned.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">Short URLs: Creation and Redirect Are Two Separate Paths</text><text class="note" x="35" y="81" text-anchor="start"><tspan x="35" dy="0">① Create path: generate an identifier and store the mapping; no need to download the target page</tspan></text><path d="M45,110 Q33,111 35,122 L36,182 Q35,193 47,192 L231,191 Q242,192 240,179 L239,121 Q240,108 228,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,114 L225,112 M236,125 L238,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="144" text-anchor="middle"><tspan x="137.5" dy="0">Long URL</tspan><tspan x="137.5" dy="23">POST /shorten</tspan></text><path d="M315,110 Q303,111 305,122 L306,182 Q305,193 317,192 L501,191 Q512,192 510,179 L509,121 Q510,108 498,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,114 L495,112 M506,125 L508,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="144" text-anchor="middle"><tspan x="407.5" dy="0">Unique ID</tspan><tspan x="407.5" dy="23">ID generator</tspan></text><path d="M585,110 Q573,111 575,122 L576,182 Q575,193 587,192 L771,191 Q782,192 780,179 L779,121 Q780,108 768,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M588,114 L765,112 M776,125 L778,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="144" text-anchor="middle"><tspan x="677.5" dy="0">Base62 encode</tspan><tspan x="677.5" dy="23">e.g. zn9edcu</tspan></text><path d="M855,110 Q843,111 845,122 L846,182 Q845,193 857,192 L1041,191 Q1052,192 1050,179 L1049,121 Q1050,108 1038,111 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,114 L1035,112 M1046,125 L1048,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="144" text-anchor="middle"><tspan x="947.5" dy="0">Mapping table</tspan><tspan x="947.5" dy="23">Code → long URL</tspan></text><path d="M240,151 L305,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,151 L575,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,151 L845,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="248" text-anchor="start"><tspan x="35" dy="0">② Redirect path: read-heavy, so the cache speeds up lookups</tspan></text><path d="M45,280 Q33,281 35,292 L36,352 Q35,363 47,362 L231,361 Q242,362 240,349 L239,291 Q240,278 228,281 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,284 L225,282 M236,295 L238,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="314" text-anchor="middle"><tspan x="137.5" dy="0">Code request</tspan><tspan x="137.5" dy="23">GET /zn9edcu</tspan></text><path d="M315,280 Q303,281 305,292 L306,352 Q305,363 317,362 L501,361 Q512,362 510,349 L509,291 Q510,278 498,281 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,284 L495,282 M506,295 L508,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="314" text-anchor="middle"><tspan x="407.5" dy="0">Check cache</tspan><tspan x="407.5" dy="23">On miss, query DB</tspan></text><path d="M585,280 Q573,281 575,292 L576,352 Q575,363 587,362 L771,361 Q782,362 780,349 L779,291 Q780,278 768,281 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M588,284 L765,282 M776,295 L778,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="314" text-anchor="middle"><tspan x="677.5" dy="0">Get long URL</tspan><tspan x="677.5" dy="23">Check it is active</tspan></text><path d="M855,280 Q843,281 845,292 L846,352 Q845,363 857,362 L1041,361 Q1052,362 1050,349 L1049,291 Q1050,278 1038,281 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M858,284 L1035,282 M1046,295 L1048,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="314" text-anchor="middle"><tspan x="947.5" dy="0">301 / 302</tspan><tspan x="947.5" dy="23">Location: URL</tspan></text><path d="M240,321 L305,321" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,321 L575,321" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,321 L845,321" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="421" text-anchor="start"><tspan x="35" dy="0">Remember: Base62 is a base conversion; hash collisions need an exact check; a DB unique constraint handles concurrency.</tspan></text><text class="note" x="35" y="453" text-anchor="start"><tspan x="35" dy="0">The create API returns the short URL; the redirect API returns a redirect so the browser visits the real target site.</tspan></text></svg>