<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#fffdf7"/>
  <style>
    .box{fill:#fffaf0;stroke:#2e4057;stroke-width:4;stroke-linejoin:round}
    .t{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#1f2937}
    .small{font-size:16px}.big{font-size:21px;font-weight:bold}
    .arrow{fill:none;stroke:#e07a5f;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 8}
  </style>
  <text x="42" y="42" class="t big">From one server to scale-out: each step fixes one bottleneck</text>
  <path d="M62 330 Q180 300 275 260 T490 205 T695 150 T920 92" class="arrow"/>
  <g transform="translate(45,240) rotate(-2)"><rect class="box" width="145" height="88" rx="17"/><text x="20" y="35" class="t big">Monolith</text><text x="20" y="63" class="t small">Web + DB</text></g>
  <g transform="translate(210,205) rotate(2)"><rect class="box" width="150" height="88" rx="17"/><text x="18" y="35" class="t big">Split DB</text><text x="18" y="63" class="t small">Scales alone</text></g>
  <g transform="translate(382,166) rotate(-2)"><rect class="box" width="160" height="88" rx="17"/><text x="18" y="35" class="t big">LB + Web</text><text x="18" y="63" class="t small">Many web nodes</text></g>
  <g transform="translate(565,125) rotate(2)"><rect class="box" width="160" height="88" rx="17"/><text x="18" y="35" class="t big">Cache / CDN</text><text x="18" y="63" class="t small">Fewer slow reads</text></g>
  <g transform="translate(748,75) rotate(-2)"><rect class="box" width="190" height="100" rx="17"/><text x="18" y="38" class="t big">Queue + Shards</text><text x="18" y="68" class="t small">Decouple + grow</text></g>
  <text x="68" y="375" class="t small">Measure → find the bottleneck → add one capability → verify, then repeat</text>
</svg>
