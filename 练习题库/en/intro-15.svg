<svg xmlns="http://www.w3.org/2000/svg" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><title>Cloud drive: file content and directory travel separately</title><desc>Device A edits a file, the block server chunks and stores blocks in object storage, the API server updates metadata, and a change notice lets device B pull the changed blocks.</desc><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">Cloud drive: file content and directory travel separately</text><text x="45" y="83" font-size="19" fill="#536070">Rough illustration | blue = clients, green = data stores, arrow labels show what is sent</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="230,268 280,268 280,175 340,175"/><polyline points="550,175 680,175"/><polyline points="230,312 280,312 280,415 340,415"/><polyline points="550,415 680,415"/><polyline points="890,415 1000,415"/><polyline points="1097,370 1097,175 890,175"/></g><g font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif"><rect x="238.0" y="140" width="80" height="25" rx="5" fill="#fffdf6"/><text x="278" y="158" text-anchor="middle" font-size="17" fill="#435165">Upload data</text><rect x="576.0" y="140" width="80" height="25" rx="5" fill="#fffdf6"/><text x="616" y="158" text-anchor="middle" font-size="17" fill="#435165">Write blocks</text><rect x="230.5" y="466" width="97" height="25" rx="5" fill="#fffdf6"/><text x="279" y="484" text-anchor="middle" font-size="17" fill="#435165">Send metadata</text><rect x="560" y="377" width="112" height="25" rx="5" fill="#fffdf6"/><text x="616" y="395" text-anchor="middle" font-size="16" fill="#435165">pending → done</text><rect x="905.0" y="377" width="80" height="25" rx="5" fill="#fffdf6"/><text x="945" y="395" text-anchor="middle" font-size="15" fill="#435165">Change notice</text><rect x="1021.5" y="132" width="97" height="25" rx="5" fill="#fffdf6"/><text x="1070" y="150" text-anchor="middle" font-size="17" fill="#435165">Fetch changed blocks</text><path d="M48 247 Q135.0 243 222 246 Q232 247 229 257 L232 325 Q230 337 220 335 L49 337 Q38 335 41 325 L39 257 Q38 247 48 247Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="135.0" y="284.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Device A</text><text x="135.0" y="310.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Edits a file</text><path d="M348 132 Q445.0 128 542 131 Q552 132 549 142 L552 210 Q550 222 540 220 L349 222 Q338 220 341 210 L339 142 Q338 132 348 132Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="445.0" y="169.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Block server</text><text x="445.0" y="195.0" text-anchor="middle" font-size="15" font-weight="400" fill="#253145">Chunk / compress / encrypt</text><path d="M688 132 Q785.0 128 882 131 Q892 132 889 142 L892 210 Q890 222 880 220 L689 222 Q678 220 681 210 L679 142 Q678 132 688 132Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="785.0" y="169.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Object storage</text><text x="785.0" y="195.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Blocks + checksums</text><path d="M348 372 Q445.0 368 542 371 Q552 372 549 382 L552 450 Q550 462 540 460 L349 462 Q338 460 341 450 L339 382 Q338 372 348 372Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="445.0" y="409.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">API server</text><text x="445.0" y="435.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Auth / versions</text><path d="M688 372 Q785.0 368 882 371 Q892 372 889 382 L892 450 Q890 462 880 460 L689 462 Q678 460 681 450 L679 382 Q678 372 688 372Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="785.0" y="409.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Metadata &amp; notices</text><text x="785.0" y="435.0" text-anchor="middle" font-size="15" font-weight="400" fill="#253145">Database + update events</text><path d="M1008 372 Q1097.5 368 1187 371 Q1197 372 1194 382 L1197 450 Q1195 462 1185 460 L1009 462 Q998 460 1001 450 L999 382 Q998 372 1008 372Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="1097.5" y="409.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Device B</text><text x="1097.5" y="435.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Pulls by version</text></g><text x="45" y="582" font-size="18" fill="#344054">Memory hook: the directory records which blocks make up which version; block storage holds the real content.</text><text x="45" y="609" font-size="18" fill="#344054">Verify every block before publishing uploaded; a notice is only a hint, not an integrity check.</text></svg>