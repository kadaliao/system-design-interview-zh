<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#27343b}.node{font:700 16px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#27343b}.label{font:15px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#35424a}.note{font:15px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#5a625f}</style><title>Notifications: accept reliably first, deliver asynchronously</title><desc>A business event is validated, persisted, and enqueued; a worker calls the third party; success is recorded, failure backs off and retries; beyond the policy it goes to manual review or the dead-letter queue.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">Notifications: accept reliably first, deliver asynchronously</text><path d="M45,110 Q33,111 35,122 L36,182 Q35,193 47,192 L231,191 Q242,192 240,179 L239,121 Q240,108 228,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,114 L225,112 M236,125 L238,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="144" text-anchor="middle"><tspan x="137.5" dy="0">Business event</tspan><tspan x="137.5" dy="23">stable event ID</tspan></text><path d="M315,110 Q303,111 305,122 L306,182 Q305,193 317,192 L501,191 Q512,192 510,179 L509,121 Q510,108 498,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,114 L495,112 M506,125 L508,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="144" text-anchor="middle"><tspan x="407.5" dy="0">Validate + persist</tspan><tspan x="407.5" dy="23">settings → enqueue</tspan></text><path d="M585,110 Q573,111 575,122 L576,182 Q575,193 587,192 L771,191 Q782,192 780,179 L779,121 Q780,108 768,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M588,114 L765,112 M776,125 L778,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="144" text-anchor="middle"><tspan x="677.5" dy="0">Channel workers</tspan><tspan x="677.5" dy="23">Push / SMS / Email</tspan></text><path d="M855,110 Q843,111 845,122 L846,182 Q845,193 857,192 L1041,191 Q1052,192 1050,179 L1049,121 Q1050,108 1038,111 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,114 L1035,112 M1046,125 L1048,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="144" text-anchor="middle"><tspan x="947.5" dy="0">Third party</tspan><tspan x="947.5" dy="23">accepted ≠ read</tspan></text><path d="M240,151 L305,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,151 L575,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,151 L845,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M855,295 Q843,296 845,307 L846,367 Q845,378 857,377 L1041,376 Q1052,377 1050,364 L1049,306 Q1050,293 1038,296 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,299 L1035,297 M1046,310 L1048,361" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="329" text-anchor="middle"><tspan x="947.5" dy="0">Status log</tspan><tspan x="947.5" dy="23">accepted / delivered</tspan></text><path d="M585,295 Q573,296 575,307 L576,367 Q575,378 587,377 L771,376 Q782,377 780,364 L779,306 Q780,293 768,296 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M588,299 L765,297 M776,310 L778,361" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="329" text-anchor="middle"><tspan x="677.5" dy="0">Backoff retry</tspan><tspan x="677.5" dy="23">same idempotency key</tspan></text><path d="M315,295 Q303,296 305,307 L306,367 Q305,378 317,377 L501,376 Q512,377 510,364 L509,306 Q510,293 498,296 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M318,299 L495,297 M506,310 L508,361" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="329" text-anchor="middle"><tspan x="407.5" dy="0">Cap / expired</tspan><tspan x="407.5" dy="23">dead letter or stop</tspan></text><path d="M985,192 L985,295" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="965.0" y="231" width="40" height="22" rx="5" fill="#fffdf7"/><text class="label" x="985" y="248" text-anchor="middle"><tspan x="985" dy="0">OK</tspan></text><path d="M890,192 L890,241 L678,241 L678,295" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="717.5" y="214" width="115" height="22" rx="5" fill="#fffdf7"/><text class="label" x="775" y="231" text-anchor="middle"><tspan x="775" dy="0">Fail/timeout</tspan></text><path d="M628,377 L628,409 L407,409 L407,377" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="485.0" y="382" width="70" height="22" rx="5" fill="#fffdf7"/><text class="label" x="520" y="399" text-anchor="middle"><tspan x="520" dy="0">Give up</tspan></text><path d="M575,336 L552,336 L552,216 L628,216 L628,192" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="524.5" y="247" width="55" height="22" rx="5" fill="#fffdf7"/><text class="label" x="552" y="264" text-anchor="middle"><tspan x="552" dy="0">Retry</tspan></text><text class="note" x="35" y="445" text-anchor="start"><tspan x="35" dy="0">The third party may accept but lose the reply: retries can duplicate, so combine idempotency keys with send state.</tspan></text><text class="note" x="35" y="477" text-anchor="start"><tspan x="35" dy="0">The queue buffers spikes and workers scale per channel; a user opening the notification is yet another event to track.</tspan></text></svg>