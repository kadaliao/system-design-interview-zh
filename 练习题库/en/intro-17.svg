<svg xmlns="http://www.w3.org/2000/svg" font-family="&quot;Chalkboard SE&quot;,&quot;Comic Sans MS&quot;,&quot;Marker Felt&quot;,cursive" width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><title>Nearby friends: one location channel per user</title><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">Nearby Friends: One Location Channel per User</text><text x="45" y="83" font-size="19" fill="#536070">Main design: subscribe to per-user channels. Geohash channels extend it to “nearby strangers”</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="215,278 320,278"/><polyline points="535,254 590,254 590,168 650,168"/><polyline points="535,300 590,300 590,397 650,397"/><polyline points="880,397 1010,397"/><polyline points="1110,350 1110,215"/></g><g><rect x="247.0" y="240" width="46" height="25" rx="5" fill="#fffdf6"/><text x="270" y="258" text-anchor="middle" font-size="17" fill="#435165">Location</text><rect x="571.0" y="130" width="46" height="25" rx="5" fill="#fffdf6"/><text x="594" y="148" text-anchor="middle" font-size="17" fill="#435165">Save</text><rect x="568.0" y="460" width="46" height="25" rx="5" fill="#fffdf6"/><text x="591" y="478" text-anchor="middle" font-size="17" fill="#435165">Publish</text><rect x="922.0" y="359" width="46" height="25" rx="5" fill="#fffdf6"/><text x="945" y="377" text-anchor="middle" font-size="17" fill="#435165">Fan-out</text><rect x="1050.0" y="266" width="114" height="25" rx="5" fill="#fffdf6"/><text x="1107" y="284" text-anchor="middle" font-size="17" fill="#435165">Push if in range</text><path d="M43 232 Q125.0 228 207 231 Q217 232 214 242 L217 315 Q215 327 205 325 L44 327 Q33 325 36 315 L34 242 Q33 232 43 232Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="125.0" y="271.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">User A</text><text x="125.0" y="297.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Reports every 30 s</text><path d="M328 232 Q427.5 228 527 231 Q537 232 534 242 L537 315 Q535 327 525 325 L329 327 Q318 325 321 315 L319 242 Q318 232 328 232Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="427.5" y="271.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">WebSocket 1</text><text x="427.5" y="297.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Holds A’s connection</text><path d="M658 122 Q765.0 118 872 121 Q882 122 879 132 L882 205 Q880 217 870 215 L659 217 Q648 215 651 205 L649 132 Q648 122 658 122Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="765.0" y="161.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Cache + History</text><text x="765.0" y="187.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">TTL current / trail</text><path d="M658 352 Q765.0 348 872 351 Q882 352 879 362 L882 435 Q880 447 870 445 L659 447 Q648 445 651 435 L649 362 Q648 352 658 352Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="765.0" y="391.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Redis: A’s channel</text><text x="765.0" y="417.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Publishes A’s location</text><path d="M1018 352 Q1110.0 348 1202 351 Q1212 352 1209 362 L1212 435 Q1210 447 1200 445 L1019 447 Q1008 445 1011 435 L1009 362 Q1008 352 1018 352Z" fill="#fff0c9" stroke="#344054" stroke-width="2.5"/><text x="1110.0" y="391.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">WebSocket 2</text><text x="1110.0" y="417.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Subscribes to A for B</text><path d="M1018 122 Q1110.0 118 1202 121 Q1212 122 1209 132 L1212 205 Q1210 217 1200 215 L1019 217 Q1008 215 1011 205 L1009 132 Q1008 122 1018 122Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="1110.0" y="161.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Friend B</text><text x="1110.0" y="187.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Shows location + time</text></g><text x="45" y="582" font-size="18" fill="#344054">Memory hook: A publishes to A’s channel; the server hosting B subscribes to A’s channel.</text><text x="45" y="609" font-size="18" fill="#344054">Losing a point briefly is fine; on connect or recovery, pull a snapshot, and always check friend permissions.</text></svg>