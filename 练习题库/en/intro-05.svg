<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360"><title>Consistent hashing: clockwise lookup</title><desc>The key sits between S1 and S2. The first node found clockwise is S2, so S2 owns the key.</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#243447}.ring{fill:none;stroke:#4f6d7a;stroke-width:5}.dot{fill:#f2cc8f;stroke:#7c4d3a;stroke-width:3}.key{fill:#81b29a;stroke:#355c4d;stroke-width:3}.a{fill:none;stroke:#e07a5f;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#e07a5f"/></marker></defs><circle class="ring" cx="350" cy="170" r="120"/><circle class="dot" cx="350" cy="50" r="18"/><text x="330" y="30" font-size="18">S1</text><circle class="dot" cx="455" cy="235" r="18"/><text x="481" y="245" font-size="18">S2</text><circle class="dot" cx="240" cy="235" r="18"/><text x="195" y="245" font-size="18">S3</text><circle class="key" cx="410" cy="78" r="15"/><text x="425" y="70" font-size="17">key</text><path class="a" d="M410 78 Q450 100 455 210"/><text x="350" y="335" font-size="20" text-anchor="middle">The first server found clockwise owns the key</text></svg>
