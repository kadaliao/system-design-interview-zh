<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#27343b}.node{font:600 17px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#27343b}.label{font:16px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#35424a}.note{font:17px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive;fill:#5a625f}</style><title>Autocomplete: precompute offline, look up online</title><desc>Logs are aggregated periodically and built into a Trie with cached top-k, then validated and switched atomically; a typed prefix reads only the published version and returns filtered suggestions.</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">Autocomplete: precompute offline, look up online</text><text class="note" x="35" y="80" text-anchor="start"><tspan x="35" dy="0">Background build: frequency updates may lag behind user queries</tspan></text><path d="M45,110 Q33,111 35,122 L36,182 Q35,193 47,192 L231,191 Q242,192 240,179 L239,121 Q240,108 228,111 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M48,114 L225,112 M236,125 L238,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="144" text-anchor="middle"><tspan x="137.5" dy="0">Query log</tspan><tspan x="137.5" dy="23">append-only</tspan></text><path d="M315,110 Q303,111 305,122 L306,182 Q305,193 317,192 L501,191 Q512,192 510,179 L509,121 Q510,108 498,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,114 L495,112 M506,125 L508,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="144" text-anchor="middle"><tspan x="407.5" dy="0">Aggregate counts</tspan><tspan x="407.5" dy="23">per time window</tspan></text><path d="M585,110 Q573,111 575,122 L576,182 Q575,193 587,192 L771,191 Q782,192 780,179 L779,121 Q780,108 768,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M588,114 L765,112 M776,125 L778,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="144" text-anchor="middle"><tspan x="677.5" dy="0">Build new Trie</tspan><tspan x="677.5" dy="23">top-k per prefix</tspan></text><path d="M855,110 Q843,111 845,122 L846,182 Q845,193 857,192 L1041,191 Q1052,192 1050,179 L1049,121 Q1050,108 1038,111 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,114 L1035,112 M1046,125 L1048,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="144" text-anchor="middle"><tspan x="947.5" dy="0">Validate, publish</tspan><tspan x="947.5" dy="23">swap in full version</tspan></text><path d="M240,151 L305,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,151 L575,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,151 L845,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="254" text-anchor="start"><tspan x="35" dy="0">Online query: target under 100 ms, no rebuild per keystroke</tspan></text><path d="M45,285 Q33,286 35,297 L36,357 Q35,368 47,367 L231,366 Q242,367 240,354 L239,296 Q240,283 228,286 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,289 L225,287 M236,300 L238,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="319" text-anchor="middle"><tspan x="137.5" dy="0">Typed prefix</tspan><tspan x="137.5" dy="23">e.g. ca</tspan></text><path d="M315,285 Q303,286 305,297 L306,357 Q305,368 317,367 L501,366 Q512,367 510,354 L509,296 Q510,283 498,286 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M318,289 L495,287 M506,300 L508,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="319" text-anchor="middle"><tspan x="407.5" dy="0">Published Trie</tspan><tspan x="407.5" dy="23">walk to node ca</tspan></text><path d="M585,285 Q573,286 575,297 L576,357 Q575,368 587,367 L771,366 Q782,367 780,354 L779,296 Q780,283 768,286 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M588,289 L765,287 M776,300 L778,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="319" text-anchor="middle"><tspan x="677.5" dy="0">Read top-k</tspan><tspan x="677.5" dy="23">drop blocked terms</tspan></text><path d="M855,285 Q843,286 845,297 L846,357 Q845,368 857,367 L1041,366 Q1052,367 1050,354 L1049,296 Q1050,283 1038,286 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M858,289 L1035,287 M1046,300 L1048,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="319" text-anchor="middle"><tspan x="947.5" dy="0">Up to 5 suggestions</tspan><tspan x="947.5" dy="23">ranked by popularity</tspan></text><path d="M240,326 L305,326" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,326 L575,326" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,326 L845,326" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="428" text-anchor="start"><tspan x="35" dy="0">Example: node ca stores [cat, car, ...] directly, so no subtree traversal and sorting on every query.</tspan></text><text class="note" x="35" y="460" text-anchor="start"><tspan x="35" dy="0">Short prefixes can be hotspots; with several shards, pre-aggregate results or merge each shard’s top-k.</tspan></text></svg>