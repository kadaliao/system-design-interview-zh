<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>聊天：实时通道之外，还要有补拉路径</title><desc>A通过WebSocket发送，服务持久化消息后对在线B实时投递；离线B可以推送通知，B重连后按安全游标从持久化历史补拉。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">聊天：实时通道之外，还要有补拉路径</text><path d="M45,110 Q33,111 35,122 L36,182 Q35,193 47,192 L231,191 Q242,192 240,179 L239,121 Q240,108 228,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,114 L225,112 M236,125 L238,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="144" text-anchor="middle"><tspan x="137.5" dy="0">设备 A</tspan><tspan x="137.5" dy="23">发送消息</tspan></text><path d="M315,110 Q303,111 305,122 L306,182 Q305,193 317,192 L501,191 Q512,192 510,179 L509,121 Q510,108 498,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,114 L495,112 M506,125 L508,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="144" text-anchor="middle"><tspan x="407.5" dy="0">聊天服务</tspan><tspan x="407.5" dy="23">稳定消息 ID</tspan></text><path d="M585,110 Q573,111 575,122 L576,182 Q575,193 587,192 L771,191 Q782,192 780,179 L779,121 Q780,108 768,111 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M588,114 L765,112 M776,125 L778,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="144" text-anchor="middle"><tspan x="677.5" dy="0">持久化历史</tspan><tspan x="677.5" dy="23">会话内排序</tspan></text><path d="M855,110 Q843,111 845,122 L846,182 Q845,193 857,192 L1041,191 Q1052,192 1050,179 L1049,121 Q1050,108 1038,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M858,114 L1035,112 M1046,125 L1048,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="144" text-anchor="middle"><tspan x="947.5" dy="0">设备 B 在线</tspan><tspan x="947.5" dy="23">WebSocket 投递</tspan></text><path d="M240,151 L305,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,151 L575,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,151 L845,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M315,305 Q303,306 305,317 L306,377 Q305,388 317,387 L501,386 Q512,387 510,374 L509,316 Q510,303 498,306 Z" fill="#f1efe9" stroke="#35424a" stroke-width="2.2"/><path d="M318,309 L495,307 M506,320 L508,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="339" text-anchor="middle"><tspan x="407.5" dy="0">B 离线</tspan><tspan x="407.5" dy="23">可发送推送提醒</tspan></text><path d="M585,305 Q573,306 575,317 L576,377 Q575,388 587,387 L771,386 Q782,387 780,374 L779,316 Q780,303 768,306 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M588,309 L765,307 M776,320 L778,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="339" text-anchor="middle"><tspan x="677.5" dy="0">B 重连 / 新设备</tspan><tspan x="677.5" dy="23">带上同步游标</tspan></text><path d="M855,305 Q843,306 845,317 L846,377 Q845,388 857,387 L1041,386 Q1052,387 1050,374 L1049,316 Q1050,303 1038,306 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M858,309 L1035,307 M1046,320 L1048,371" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="339" text-anchor="middle"><tspan x="947.5" dy="0">补拉未确认消息</tspan><tspan x="947.5" dy="23">去重后推进游标</tspan></text><path d="M650,192 L650,235 L407,235 L407,305" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="497.5" y="209" width="55" height="22" rx="5" fill="#fffdf7"/><text class="label" x="525" y="226" text-anchor="middle"><tspan x="525" dy="0">未连接</tspan></text><path d="M510,346 L575,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="523.0" y="308" width="40" height="22" rx="5" fill="#fffdf7"/><text class="label" x="543" y="325" text-anchor="middle"><tspan x="543" dy="0">稍后</tspan></text><path d="M678,305 L678,192" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="711.0" y="235" width="70" height="22" rx="5" fill="#fffdf7"/><text class="label" x="746" y="252" text-anchor="middle"><tspan x="746" dy="0">查询历史</tspan></text><path d="M780,346 L845,346" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="436" text-anchor="start"><tspan x="35" dy="0">会话内局部 ID → 按会话保存游标；用户级 inbox 可另设单调同步序号。</tspan></text><text class="note" x="35" y="468" text-anchor="start"><tspan x="35" dy="0">WebSocket 负责及时到达；持久化与补拉负责找回；去重负责安全重试。</tspan></text></svg>