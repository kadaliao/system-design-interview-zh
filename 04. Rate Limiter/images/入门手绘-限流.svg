<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><title>限流器控制请求</title><desc>客户端请求进入限流器，有额度则到业务服务，没有额度则返回429。</desc><rect width="100%" height="100%" fill="#fffdf6"/><style>text{font-family:Comic Sans MS, sans-serif;fill:#243447} .box{fill:#fff8dc;stroke:#314e68;stroke-width:3;rx:18}.arrow{stroke:#e07a5f;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#e07a5f"/></marker></defs><rect class="box" x="25" y="95" width="145" height="80"/><text x="45" y="130" font-size="23">很多请求</text><text x="50" y="158" font-size="17">客户端们</text><line class="arrow" x1="170" y1="135" x2="260" y2="135"/><rect class="box" x="260" y="70" width="210" height="130"/><text x="285" y="112" font-size="24">Rate Limiter</text><text x="286" y="145" font-size="18">令牌够？放行</text><text x="286" y="173" font-size="18">不够？稍后再试</text><line class="arrow" x1="470" y1="110" x2="570" y2="75"/><line class="arrow" x1="470" y1="160" x2="570" y2="205"/><rect class="box" x="570" y="35" width="160" height="70"/><text x="600" y="77" font-size="20">业务服务</text><rect class="box" x="570" y="170" width="160" height="70"/><text x="600" y="212" font-size="20">429 拒绝</text><text x="25" y="275" font-size="18">像小区门卫：控制进入速度，保护后面的服务。</text></svg>
