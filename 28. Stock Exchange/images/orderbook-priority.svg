<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img"><title>限价买单如何成交：先选最优价格，同价按到达顺序</title><desc>一笔限价101、数量80的买单先匹配100档位的早到卖单30股，再匹配同档后到卖单50股，101档位的订单不动。</desc><rect width="1080" height="690" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c66d4f"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#243746}.h{font-size:27px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#34495e;stroke-width:3;stroke-linejoin:round;rx:17}.line{fill:none;stroke:#c66d4f;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}.soft{stroke:#8d9c94;stroke-width:2.4;stroke-dasharray:7 6;fill:none}</style><text x="40" y="45" class="t h">限价买单如何成交：先选最优价格，同价按到达顺序</text><rect x="40" y="100" width="400" height="105" class="box" fill="#ffe5dd"/><text x="58" y="133" class="t b">新买单：限价 101，数量 80</text><text x="58" y="164" class="t p">可以买 101 或更低的卖单</text><text x="40" y="257" class="t b">卖方订单簿（Ask）</text><text x="40" y="302" class="t b">价格 100</text><rect x="220" y="270" width="335" height="95" class="box" fill="#fff4d7"/><text x="238" y="303" class="t b">先到：卖单 S1，30 股</text><text x="238" y="334" class="t p">① 先成交 30，剩余买量 50</text><rect x="650" y="270" width="360" height="95" class="box" fill="#fff4d7"/><text x="668" y="303" class="t b">后到：卖单 S2，50 股</text><text x="668" y="334" class="t p">② 再成交 50，买单全部成交</text><path d="M555 317 L650 317" class="line"/><text x="562" y="296" class="t s">FIFO</text><text x="40" y="439" class="t b">价格 101</text><rect x="220" y="405" width="335" height="95" class="box" fill="#e8e7f4"/><text x="238" y="438" class="t b">卖单 S3，40 股</text><text x="238" y="469" class="t p">③ 买单已完成，本档不动</text><path d="M440 152 L580 152 L580 235 L387 235 L387 270" class="line"/><text x="40" y="558" class="t p">价格优先：先处理最低卖价；同价时间优先：先到订单先成交。</text><text x="40" y="603" class="t p">每次成交量 = min(买单剩余量, 卖单剩余量)，仅移除剩余量为 0 的订单。</text><text x="40" y="644" class="t s">示例按被动卖单价 100 成交；真实成交定价必须遵循交易所规则。</text></svg>