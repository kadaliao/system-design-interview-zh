<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>爬虫：调度循环 + 两种去重</title><desc>种子进入Frontier后下载解析，内容去重，新内容抽取链接，URL过滤和去重后回到Frontier。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">爬虫：调度循环 + 两种去重</text><path d="M45,105 Q33,106 35,117 L36,177 Q35,188 47,187 L231,186 Q242,187 240,174 L239,116 Q240,103 228,106 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,109 L225,107 M236,120 L238,171" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="139" text-anchor="middle"><tspan x="137.5" dy="0">种子 URL</tspan><tspan x="137.5" dy="23">Seed</tspan></text><path d="M315,105 Q303,106 305,117 L306,177 Q305,188 317,187 L501,186 Q512,187 510,174 L509,116 Q510,103 498,106 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,109 L495,107 M506,120 L508,171" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="139" text-anchor="middle"><tspan x="407.5" dy="0">Frontier</tspan><tspan x="407.5" dy="23">优先级 + 按站限速</tspan></text><path d="M585,105 Q573,106 575,117 L576,177 Q575,188 587,187 L771,186 Q782,187 780,174 L779,116 Q780,103 768,106 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M588,109 L765,107 M776,120 L778,171" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="139" text-anchor="middle"><tspan x="677.5" dy="0">下载 + DNS</tspan><tspan x="677.5" dy="23">超时 / 重试</tspan></text><path d="M855,105 Q843,106 845,117 L846,177 Q845,188 857,187 L1041,186 Q1052,187 1050,174 L1049,116 Q1050,103 1038,106 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M858,109 L1035,107 M1046,120 L1048,171" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="139" text-anchor="middle"><tspan x="947.5" dy="0">解析 HTML</tspan><tspan x="947.5" dy="23">提取有效内容</tspan></text><path d="M240,146 L305,146" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,146 L575,146" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,146 L845,146" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M855,285 Q843,286 845,297 L846,357 Q845,368 857,367 L1041,366 Q1052,367 1050,354 L1049,296 Q1050,283 1038,286 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M858,289 L1035,287 M1046,300 L1048,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="319" text-anchor="middle"><tspan x="947.5" dy="0">内容是否见过？</tspan><tspan x="947.5" dy="23">内容哈希去重</tspan></text><path d="M585,285 Q573,286 575,297 L576,357 Q575,368 587,367 L771,366 Q782,367 780,354 L779,296 Q780,283 768,286 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M588,289 L765,287 M776,300 L778,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="319" text-anchor="middle"><tspan x="677.5" dy="0">保存新内容</tspan><tspan x="677.5" dy="23">提取链接</tspan></text><path d="M315,285 Q303,286 305,297 L306,357 Q305,368 317,367 L501,366 Q512,367 510,354 L509,296 Q510,283 498,286 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,289 L495,287 M506,300 L508,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="319" text-anchor="middle"><tspan x="407.5" dy="0">URL 过滤</tspan><tspan x="407.5" dy="23">规范化 / 规则</tspan></text><path d="M45,285 Q33,286 35,297 L36,357 Q35,368 47,367 L231,366 Q242,367 240,354 L239,296 Q240,283 228,286 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M48,289 L225,287 M236,300 L238,351" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="319" text-anchor="middle"><tspan x="137.5" dy="0">URL 是否见过？</tspan><tspan x="137.5" dy="23">允许计划重抓</tspan></text><path d="M947,187 L947,285" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M845,326 L780,326" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="784.5" y="288" width="55" height="22" rx="5" fill="#fffdf7"/><text class="label" x="812" y="305" text-anchor="middle"><tspan x="812" dy="0">新内容</tspan></text><path d="M575,326 L510,326" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M305,326 L240,326" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M138,285 L138,235 L407,235 L407,187" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="232.5" y="209" width="85" height="22" rx="5" fill="#fffdf7"/><text class="label" x="275" y="226" text-anchor="middle"><tspan x="275" dy="0">未见或到期</tspan></text><text class="note" x="35" y="423" text-anchor="start"><tspan x="35" dy="0">URL 去重：避免重复下载；内容去重：避免重复存储。重复内容分支可直接结束。</tspan></text><text class="note" x="35" y="455" text-anchor="start"><tspan x="35" dy="0">优先级决定先抓谁；礼貌限制决定什么时候允许抓，二者都由 Frontier 协调。</tspan></text></svg>