<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><title>钱包事件溯源：意图可以失败，事实用于重建余额</title><desc>转账命令先验证，验证成功生成有序不可变事件，事件通过Raft提交后应用到账户状态；恢复从快照序号后重放事件。</desc><rect width="1080" height="600" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c66d4f"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#243746}.h{font-size:27px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#34495e;stroke-width:3;stroke-linejoin:round;rx:17}.line{fill:none;stroke:#c66d4f;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}.soft{stroke:#8d9c94;stroke-width:2.4;stroke-dasharray:7 6;fill:none}</style><text x="40" y="45" class="t h">钱包事件溯源：意图可以失败，事实用于重建余额</text><rect x="40" y="110" width="225" height="120" class="box" fill="#fff4d7"/><text x="58" y="143" class="t b">命令 Command</text><text x="58" y="174" class="t p">“A 向 C 转 $1”</text><text x="58" y="201" class="t p">可能被余额校验拒绝</text><rect x="350" y="110" width="270" height="120" class="box" fill="#fff4d7"/><text x="368" y="143" class="t b">验证与生成事件</text><text x="368" y="174" class="t p">读取权威状态</text><text x="368" y="201" class="t p">固化结果所需输入</text><rect x="705" y="110" width="330" height="120" class="box" fill="#dcefe5"/><text x="723" y="143" class="t b">已提交事件 Event</text><text x="723" y="174" class="t p">转账 ID + 序号 + 变更</text><text x="723" y="201" class="t p">不可变，可重复读取</text><path d="M265 170 L350 170" class="line"/><path d="M620 170 L705 170" class="line"/><text x="738" y="269" class="t s">提交后应用</text><path d="M870 230 L870 320" class="line"/><rect x="705" y="320" width="330" height="130" class="box" fill="#dcefe5"/><text x="723" y="353" class="t b">确定性应用事件</text><text x="723" y="384" class="t p">A：10 → 9</text><text x="723" y="411" class="t p">C：20 → 21</text><rect x="40" y="320" width="470" height="130" class="box" fill="#e8e7f4"/><text x="58" y="353" class="t b">恢复 = 快照 + 后续已提交事件</text><text x="58" y="384" class="t p">从快照的最后应用序号之后继续</text><text x="58" y="411" class="t p">同一事件不重复产生余额变化</text><path d="M510 385 L705 385" class="line"/><text x="40" y="512" class="t p">单个状态机 / Raft 组内保持顺序；跨组转账仍需 TC/C 或 Saga 协调。</text><text x="40" y="550" class="t p">可重放证明可重现；资金守恒、规则验证和对账共同检查正确性。</text></svg>