<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770" role="img"><title>接收邮件：先可靠接住，再派生搜索与通知</title><desc>外部SMTP邮件经过策略校验、可靠接收队列和邮件主存后，异步生成搜索索引并通知在线客户端。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="770" fill="#fffdf7"/><rect width="1040" height="770" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">接收邮件：先可靠接住，再派生搜索与通知</text><path d="M42 86 Q162.5 84.5 283 87 Q296 87 295 99 L294 177 Q295 190 282 189 L42 190 Q29 189 30 177 L31 98 Q30 86 42 86 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="118" class="head">外部邮件服务器</text><text x="47" y="150">SMTP 投递 / 重试</text><path d="M392 86 Q510.0 84.5 628 87 Q641 87 640 99 L639 177 Q640 190 627 189 L392 190 Q379 189 380 177 L381 98 Q380 86 392 86 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="397" y="118" class="head">SMTP 接入</text><text x="397" y="150">收件人、大小、策略校验</text><path d="M296,137 L369,137" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="309" y="119" class="small">SMTP</text><path d="M734 86 Q866.0 84.5 998 87 Q1011 87 1010 99 L1009 177 Q1010 190 997 189 L734 190 Q721 189 722 177 L723 98 Q722 86 734 86 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="739" y="118" class="head">可靠接收队列 / spool</text><text x="739" y="150">持久化邮件与处理任务</text><path d="M641,137 L711,137" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="656" y="119" class="small">接收</text><path d="M840,191 L840,231 L170,231 L170,201" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="268" y="219" class="small">可靠接收后才回复 250：本站承担后续投递责任</text><path d="M697 296 Q847.5 294.5 998 297 Q1011 297 1010 309 L1009 440 Q1010 453 997 452 L697 453 Q684 452 685 440 L686 308 Q685 296 697 296 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="702" y="328" class="head">处理 worker → 邮件主存</text><text x="702" y="360">正文、头字段、用户归属</text><text x="702" y="388">大附件存对象库，主存记引用</text><text x="702" y="416">成功后记录可重放的派生事件</text><path d="M872,190 L965,190 L965,285" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="868" y="270" class="small">后台处理</text><path d="M42 314 Q307.5 312.5 573 315 Q586 315 585 327 L584 414 Q585 427 572 426 L42 427 Q29 426 30 414 L31 326 Q30 314 42 314 Z" fill="#f6f3e7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="346" class="head">接收可靠 ≠ 用户已经看到</text><text x="47" y="378">队列与主存要可恢复；失败不能静默丢信。</text><text x="47" y="406">图示的可靠交接与事件重放是补充实现约束。</text><path d="M826,453 L826,488 L285,488 L285,528" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="346" y="480" class="small">异步：以 email_id 去重、可重试</text><path d="M876,453 L876,528" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M72 540 Q285.0 538.5 498 541 Q511 541 510 553 L509 665 Q510 678 497 677 L72 678 Q59 677 60 665 L61 552 Q60 540 72 540 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="77" y="572" class="head">搜索索引（按 user_id 隔离）</text><text x="77" y="604">建立全文索引；允许短暂延迟</text><text x="77" y="632">索引失败可从主存/事件重新构建</text><path d="M612 540 Q805.0 538.5 998 541 Q1011 541 1010 553 L1009 665 Q1010 678 997 677 L612 678 Q599 677 600 665 L601 552 Q600 540 612 540 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="617" y="572" class="head">实时通知 / 在线连接</text><text x="617" y="604">通知“有新邮件”→ 客户端读取</text><text x="617" y="632">离线用户重连后通过 HTTP 补读</text><text x="35" y="725" class="small">实线：接收与可靠存储路径     虚线：确认 / 异步派生；通知不是邮件唯一副本。</text></svg>