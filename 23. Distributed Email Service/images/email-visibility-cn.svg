<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" role="img"><title>已收件、可搜索、已通知：三个时刻不要混为一谈</title><desc>邮件主存先完成，随后搜索索引和在线通知独立推进；索引或通知失败不等于邮件丢失。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="760" fill="#fffdf7"/><rect width="1040" height="760" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">已收件、可搜索、已通知：三个时刻不要混为一谈</text><text x="45" y="100" class="small">同一封邮件 email_id = E7；以下时刻只表示先后，不承诺固定延迟。</text><text x="125" y="146" class="head" text-anchor="middle">时间</text><path d="M125 167L125 620" stroke="#b0bdc1" stroke-width="1.5"/><text x="385" y="146" class="head" text-anchor="middle">邮件主存</text><path d="M385 167L385 620" stroke="#b0bdc1" stroke-width="1.5"/><text x="660" y="146" class="head" text-anchor="middle">搜索索引</text><path d="M660 167L660 620" stroke="#b0bdc1" stroke-width="1.5"/><text x="920" y="146" class="head" text-anchor="middle">客户端</text><path d="M920 167L920 620" stroke="#b0bdc1" stroke-width="1.5"/><text x="76" y="224">t0</text><path d="M292 192 Q385.0 190.5 478 193 Q491 193 490 205 L489 250 Q490 263 477 262 L292 263 Q279 262 280 250 L281 204 Q280 192 292 192 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="297" y="223">E7 已可靠保存</text><path d="M492,226 L653,226" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="506" y="207" class="small">异步索引任务</text><path d="M385,294 L910,294" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="503" y="279" class="small">新邮件提示：通知也可独立延迟</text><path d="M567 338 Q660.0 336.5 753 339 Q766 339 765 351 L764 397 Q765 410 752 409 L567 410 Q554 409 555 397 L556 350 Q555 338 567 338 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="572" y="369">索引尚未更新</text><path d="M920,355 L780,355" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="822" y="335" class="small">搜索 E7</text><text x="816" y="394" class="small">暂时可能查不到</text><text x="76" y="480">t1</text><path d="M567 446 Q660.0 444.5 753 447 Q766 447 765 459 L764 504 Q765 517 752 516 L567 517 Q554 516 555 504 L556 458 Q555 446 567 446 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="572" y="477">E7 已进入索引</text><path d="M777,480 L910,480" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="795" y="463" class="small">现在可搜索</text><text x="76" y="580">随时</text><path d="M919,576 L402,576" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="410" y="556" class="small">收件箱补读走邮件 API，按已保存的邮件状态返回</text><path d="M42 655 Q520.0 653.5 998 656 Q1011 656 1010 668 L1009 713 Q1010 726 997 725 L42 726 Q29 725 30 713 L31 667 Q30 655 42 655 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="686">通知丢失可以重连补读；索引失败可以重建；二者都不能承担邮件持久化职责。</text></svg>