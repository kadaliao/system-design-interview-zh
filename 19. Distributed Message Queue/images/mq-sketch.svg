<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#435165"/></marker></defs><rect width="1240" height="660" fill="#fffdf6"/><text x="45" y="49" font-size="30" font-weight="700">消息队列：数据日志与读取进度分开</text><text x="45" y="83" font-size="19" fill="#536070">示意一个主题的一个分区；其他分区可并行扩展，顺序只在分区内保证</text><g fill="none" stroke="#435165" stroke-width="2.4" marker-end="url(#arrow)"><polyline points="215,265 345,265"/><polyline points="470,310 470,420"/><polyline points="595,245 680,245 680,165 790,165"/><polyline points="595,285 680,285 680,395 790,395"/></g><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="250.5" y="225" width="63" height="25" rx="5" fill="#fffdf6"/><text x="282" y="243" text-anchor="middle" font-size="17" fill="#435165">写消息</text><rect x="497.0" y="349" width="46" height="25" rx="5" fill="#fffdf6"/><text x="520" y="367" text-anchor="middle" font-size="17" fill="#435165">复制</text><rect x="676.0" y="127" width="46" height="25" rx="5" fill="#fffdf6"/><text x="699" y="145" text-anchor="middle" font-size="17" fill="#435165">读取</text><rect x="677.0" y="454" width="46" height="25" rx="5" fill="#fffdf6"/><text x="700" y="472" text-anchor="middle" font-size="17" fill="#435165">读取</text><path d="M43 222 Q125.0 218 207 221 Q217 222 214 232 L217 300 Q215 312 205 310 L44 312 Q33 310 36 300 L34 232 Q33 222 43 222Z" fill="#e6f2ff" stroke="#344054" stroke-width="2.5"/><text x="125.0" y="259.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Producer</text><text x="125.0" y="285.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">按 key 分区</text><path d="M353 222 Q470.0 218 587 221 Q597 222 594 232 L597 300 Q595 312 585 310 L354 312 Q343 310 346 300 L344 232 Q343 222 353 222Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="470.0" y="259.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Broker：Leader</text><text x="470.0" y="285.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">Partition 0 追加日志</text><path d="M353 422 Q470.0 418 587 421 Q597 422 594 432 L597 495 Q595 507 585 505 L354 507 Q343 505 346 495 L344 432 Q343 422 353 422Z" fill="#eaf5e2" stroke="#344054" stroke-width="2.5"/><text x="470.0" y="456.5" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">Follower 副本</text><text x="470.0" y="482.5" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">拉取复制 / ISR</text><path d="M798 122 Q905.0 118 1012 121 Q1022 122 1019 132 L1022 200 Q1020 212 1010 210 L799 212 Q788 210 791 200 L789 132 Q788 122 798 122Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="905.0" y="159.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">消费组 A</text><text x="905.0" y="185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">从自己的 offset 读</text><path d="M798 352 Q905.0 348 1012 351 Q1022 352 1019 362 L1022 430 Q1020 442 1010 440 L799 442 Q788 440 791 430 L789 362 Q788 352 798 352Z" fill="#f2e9fc" stroke="#344054" stroke-width="2.5"/><text x="905.0" y="389.0" text-anchor="middle" font-size="21" font-weight="600" fill="#253145">消费组 B</text><text x="905.0" y="415.0" text-anchor="middle" font-size="17" font-weight="400" fill="#253145">独立 offset / 可重放</text></g><text x="45" y="582" font-size="18" fill="#344054">记忆：不同组共享日志、各记进度；同组每分区同一时刻只有一个消费者。</text><text x="45" y="609" font-size="18" fill="#344054">处理成功再提交 offset 仍可能重放，业务写入需要幂等。</text></svg>