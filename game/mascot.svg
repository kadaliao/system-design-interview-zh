  <g class="wowl ln" style="stroke:#ffb02e"><path d="M30 40 L22 29 M20 52 L8 47 M42 33 L40 20 M170 40 L178 29 M180 52 L192 47 M158 33 L160 20"/></g>
  
</g></g></g>
<g class="dc dc-aura stars"><path transform="translate(192.4 159.1) scale(1.7)" d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#ffd43b" stroke="#14123a" stroke-width="2.4" stroke-linejoin="round"/><path transform="translate(56.9 208.4) scale(1.2)" d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#ffd43b" stroke="#14123a" stroke-width="2.4" stroke-linejoin="round"/><path transform="translate(7.6 72.9) scale(1.7)" d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#ffd43b" stroke="#14123a" stroke-width="2.4" stroke-linejoin="round"/><path transform="translate(143.1 23.6) scale(1.2)" d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z" fill="#ffd43b" stroke="#14123a" stroke-width="2.4" stroke-linejoin="round"/></g></g>
