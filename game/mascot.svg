  <ellipse class="cheek" cx="138" cy="124" rx="8.5" ry="5.2" fill="#ff5d8f"/>

  <path class="mS ln" d="M91 123 Q100 134 109 123"/>
  <g class="mG"><path d="M87 119 Q100 143 113 119 Z" fill="#14123a" stroke="#14123a" stroke-width="4" stroke-linejoin="round"/><ellipse cx="100" cy="128.4" rx="6.4" ry="3.2" fill="#ff5d8f"/></g>
  <g class="mO"><path d="M84 117 Q100 152 116 117 Z" fill="#14123a" stroke="#14123a" stroke-width="4" stroke-linejoin="round"/><ellipse cx="100" cy="132" rx="8.6" ry="4.2" fill="#ff5d8f"/></g>
