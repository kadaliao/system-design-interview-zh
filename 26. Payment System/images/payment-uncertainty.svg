<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="670" viewBox="0 0 1080 670" role="img"><title>支付超时：先保留“不确定”，再收敛到确定结果</title><desc>持久化支付订单后以相同幂等键调用PSP；超时保持处理中，由验签webhook或主动查询确认，随后幂等更新账本和钱包，并由对账补漏。</desc><rect width="1080" height="670" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c66d4f"/></marker></defs><style>.t{font-family:KaiTi,"STKaiti","Comic Sans MS",sans-serif;fill:#243746}.h{font-size:27px;font-weight:bold}.b{font-size:23px;font-weight:bold}.p{font-size:20px}.s{font-size:18px}.box{stroke:#34495e;stroke-width:3;stroke-linejoin:round;rx:17}.line{fill:none;stroke:#c66d4f;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}.soft{stroke:#8d9c94;stroke-width:2.4;stroke-dasharray:7 6;fill:none}</style><text x="40" y="45" class="t h">支付超时：先保留“不确定”，再收敛到确定结果</text><rect x="40" y="95" width="240" height="110" class="box" fill="#fff4d7"/><text x="58" y="128" class="t b">① 持久化支付订单</text><text x="58" y="159" class="t p">payment_order_id</text><text x="58" y="186" class="t p">状态：EXECUTING</text><rect x="370" y="95" width="290" height="110" class="box" fill="#fff4d7"/><text x="388" y="128" class="t b">② 调用 PSP</text><text x="388" y="159" class="t p">同一笔支付始终复用</text><text x="388" y="186" class="t p">同一 idempotency key</text><rect x="750" y="95" width="280" height="110" class="box" fill="#ffe5dd"/><text x="768" y="128" class="t b">③ 请求超时</text><text x="768" y="159" class="t p">结果未知 ≠ 扣款失败</text><text x="768" y="186" class="t p">状态仍为处理中</text><path d="M280 150 L370 150" class="line"/><path d="M660 150 L750 150" class="line"/><path d="M890 205 L890 260 L620 260 L620 305" class="line"/><rect x="370" y="305" width="500" height="135" class="box" fill="#dcefe5"/><text x="388" y="338" class="t b">④ 确认权威结果</text><text x="388" y="369" class="t p">验签 webhook / 主动查询 PSP</text><text x="388" y="396" class="t p">匹配订单、金额、币种，并幂等落库</text><path d="M620 440 L620 490" class="line"/><rect x="370" y="490" width="500" height="100" class="box" fill="#dcefe5"/><text x="388" y="523" class="t b">⑤ 成功：幂等更新账务</text><text x="388" y="554" class="t p">按支付 ID 去重，保留可追溯记录</text><text x="388" y="581" class="t p">失败：只记录终态，不增加钱包余额</text><text x="42" y="352" class="t b">后台对账补漏</text><text x="42" y="386" class="t p">PSP 结算文件</text><text x="42" y="415" class="t p">↔ 内部订单 / 账本</text><path d="M245 392 L370 392" class="line"/><text x="40" y="632" class="t p">不要因网络超时生成新支付 ID 再扣一次；重试传输与重做业务是两回事。</text></svg>