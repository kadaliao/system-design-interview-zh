<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互实验预览</title>
<link rel="stylesheet" href="runtime.css">
<style>
/* 与阅读页正文相同的基础排版，便于单独开发和截图检查实验。 */
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#fcfaf5;color:#23352f;font:17px/1.85 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
a{color:#176b52}button,input{font:inherit}
button{cursor:pointer;border:1px solid #dbe2da;border-radius:9px;padding:6px 12px;background:#fff;color:#23352f}
article{max-width:1010px;margin:0 auto;padding:30px 58px 80px;overflow-wrap:anywhere}
h1{font-size:26px;margin:0 0 10px}p{margin:17px 0}li{margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:14px;margin:25px 0;display:block;overflow:auto}
th,td{text-align:left;padding:10px 13px;border:1px solid #dbe2da;min-width:90px}th{background:#eaf0e5}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef2ec;border-radius:4px;padding:2px 4px;font-size:.88em}
.usage{color:#66756d;font-size:14px}
@media(max-width:760px){article{padding:22px 20px}}
</style>
</head>
<body>
<article id="app">
<h1>交互实验预览</h1>
<p class="usage" id="usage">用法：<code>preview.html?file=04-rate-limiter.js</code>（多个文件用逗号分隔，可加 <code>&amp;lab=实验ID</code> 只显示一个）。</p>
</article>
<script src="runtime.js"></script>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const files=(params.get('file')||'').split(',').map(s=>s.trim()).filter(Boolean);
  const only=params.get('lab');
  const app=document.getElementById('app');
  window.__labErrors=[];
  window.addEventListener('error',e=>window.__labErrors.push(String(e.message||e)));
  function load(file){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='labs/'+file;s.onload=resolve;s.onerror=()=>reject(new Error('无法加载 '+file));document.body.append(s)})}
  (async()=>{
    for(const f of files){
      const before=SDLab.specs.length;
      try{await load(f)}catch(e){window.__labErrors.push(e.message);continue}
      for(const spec of SDLab.specs.slice(before)){
        if(only&&spec.id!==only)continue;
        const div=document.createElement('div');div.className='sd-lab';div.dataset.lab=spec.id;div.id='lab-'+spec.id;
        div.textContent='（未挂载）'+spec.title;app.append(div);SDLab.mountEl(div);
      }
    }
    if(files.length)document.getElementById('usage').remove();
    window.__labsReady=true;
  })();
})();
</script>
</body>
</html>
