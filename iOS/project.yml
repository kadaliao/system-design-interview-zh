name: SystemDesignQuest
options:
  bundleIdPrefix: com.kadaliao
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SystemDesignQuest:
    type: application
    platform: iOS
    sources:
      - path: SystemDesignQuest
        excludes:
          - Resources/Content
          - Products.storekit
      - path: SystemDesignQuest/Resources/Content
        type: folder
        buildPhase: resources
    info:
      path: SystemDesignQuest/Info.plist
      properties:
        CFBundleLocalizations: [zh-Hans, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.SystemDesignQuest
        PRODUCT_NAME: SystemDesignQuest
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 系统设计闯关
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  SystemDesignQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SystemDesignQuestTests
    dependencies:
      - target: SystemDesignQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.SystemDesignQuestTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SystemDesignQuest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SystemDesignQuest
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SystemDesignQuest:
    run:
      storeKitConfiguration: SystemDesignQuest/Products.storekit
    build:
      targets:
        SystemDesignQuest: all
        SystemDesignQuestTests: [test]
    test:
      targets:
        - SystemDesignQuestTests
      gatherCoverageData: false
