<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img"><title>多日库存：一晚不够，整笔预订都不能成功</title><desc>预订6月1日到6月3日包含两个住宿夜晚；第二晚容量已满，因此整个事务回滚。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="690" fill="#fffdf7"/><rect width="1040" height="690" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">多日库存：一晚不够，整笔预订都不能成功</text><path d="M42 80 Q520.0 78.5 998 81 Q1011 81 1010 93 L1009 173 Q1010 186 997 185 L42 186 Q29 185 30 173 L31 92 Q30 80 42 80 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="47" y="112" class="head">请求：酒店 211 / 房型 1001 / 1 间房</text><text x="47" y="144">入住 06-01，退房 06-03 → 校验 [06-01, 06-03)，共 2 个住宿夜晚</text><path d="M520,186 L520,220" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="547" y="211" class="small">BEGIN；锁定或条件更新相同两行</text><path d="M42 236 Q520.0 234.5 998 237 Q1011 237 1010 249 L1009 450 Q1010 463 997 462 L42 463 Q29 462 30 450 L31 248 Q30 236 42 236 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="47" y="268" class="head">同一事务内读取完整日期集合</text><path d="M50 312L990 312" stroke="#b0bdc1" stroke-width="1.5"/><path d="M50 363L990 363" stroke="#b0bdc1" stroke-width="1.5"/><path d="M50 414L990 414" stroke="#b0bdc1" stroke-width="1.5"/><path d="M235 294L235 452" stroke="#b0bdc1" stroke-width="1.5"/><path d="M460 294L460 452" stroke="#b0bdc1" stroke-width="1.5"/><path d="M680 294L680 452" stroke="#b0bdc1" stroke-width="1.5"/><path d="M820 294L820 452" stroke="#b0bdc1" stroke-width="1.5"/><text x="55" y="303" class="head">库存日期</text><text x="252" y="303" class="head">物理库存</text><text x="475" y="303" class="head">可售上限</text><text x="695" y="303" class="head">已订</text><text x="839" y="303" class="head">本次 +1</text><text x="55" y="345">06-01</text><text x="280" y="345">100</text><text x="505" y="345">110</text><text x="710" y="345">109</text><text x="839" y="345">110 ≤ 110 ✓</text><text x="55" y="397">06-02</text><text x="280" y="397">100</text><text x="505" y="397">110</text><text x="710" y="397">110</text><text x="839" y="397">111 &gt; 110 ✕</text><text x="53" y="447" class="small">示例允许超售 10%：可售上限为 110；不是默认无限超售。</text><path d="M520,463 L520,505" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="552" y="491" class="small">第二晚不足</text><path d="M107 520 Q520.0 518.5 933 521 Q946 521 945 533 L944 607 Q945 620 932 619 L107 620 Q94 619 95 607 L96 532 Q95 520 107 520 Z" fill="#fff0eb" stroke="#263b48" stroke-width="2.4"/><text x="112" y="552" class="head">ROLLBACK：两晚库存都保持原值，不创建成功预订</text><text x="112" y="584">第一晚有空房不能代表整个入住区间可订；缺日期行也不能当成有库存。</text><text x="36" y="662" class="small">实现提示：检查完整夜晚数；多行锁顺序一致；条件更新失败时回滚并按策略重试。</text></svg>