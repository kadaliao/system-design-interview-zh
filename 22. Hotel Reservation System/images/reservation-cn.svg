<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img"><title>酒店预订：同一订单去重，不同订单防超卖</title><desc>左侧用幂等键合并重复提交，右侧用数据库事务保护多个住宿日期的库存。</desc><defs><marker id="a" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9" fill="#466e83"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d9dfd6"/></pattern></defs><style>text{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",sans-serif;fill:#263b48;font-size:20px}.title{font-size:30px;font-weight:700}.small{font-size:18px}.head{font-size:23px;font-weight:700}.code{font-family:"Menlo","DejaVu Sans Mono",monospace;font-size:18px}</style><rect width="1040" height="740" fill="#fffdf7"/><rect width="1040" height="740" fill="url(#paper)" opacity=".40"/><text x="35" y="43" class="title">酒店预订：同一订单去重，不同订单防超卖</text><path d="M37 75 Q257.5 73.5 478 76 Q491 76 490 88 L489 673 Q490 686 477 685 L37 686 Q24 685 25 673 L26 87 Q25 75 37 75 Z" fill="#faf6e9" stroke="#263b48" stroke-width="2.4"/><path d="M557 75 Q780.0 73.5 1003 76 Q1016 76 1015 88 L1014 673 Q1015 686 1002 685 L557 686 Q544 685 545 673 L546 87 Q545 75 557 75 Z" fill="#eff6f7" stroke="#263b48" stroke-width="2.4"/><text x="45" y="112" class="head">保护层一：同一个订单只处理一次</text><text x="565" y="112" class="head">保护层二：不同订单竞争同一库存</text><path d="M60 143 Q141.5 141.5 223 144 Q236 144 235 156 L234 221 Q235 234 222 233 L60 234 Q47 233 48 221 L49 155 Q48 143 60 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="65" y="174">第一次提交</text><text x="65" y="202">订单 R42</text><path d="M294 143 Q374.0 141.5 454 144 Q467 144 466 156 L465 221 Q466 234 453 233 L294 234 Q281 233 282 221 L283 155 Q282 143 294 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="299" y="174">超时后重试</text><text x="299" y="202">仍是 R42</text><path d="M142,234 L142,258 L257,258 L257,282" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M375,234 L375,258 L280,258" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><text x="283" y="277" class="small">相同请求内容</text><path d="M84 292 Q258.5 290.5 433 293 Q446 293 445 305 L444 395 Q445 408 432 407 L84 408 Q71 407 72 395 L73 304 Q72 292 84 292 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="89" y="324" class="head">reservation_id 唯一约束</text><text x="89" y="356">先争取订单记录；重复键不重做</text><text x="89" y="384">同一幂等键绑定相同业务参数</text><path d="M257,408 L257,440" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M84 450 Q258.5 448.5 433 451 Q446 451 445 463 L444 543 Q445 556 432 555 L84 556 Q71 555 72 543 L73 462 Q72 450 84 450 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="89" y="482" class="head">一次结果，多次复用</text><text x="89" y="514">首次完成后保存结果</text><text x="89" y="542">重试读取原订单状态与结果</text><text x="50" y="596" class="small">例：用户连点两下、网络重发。</text><text x="50" y="623" class="small">仅禁用按钮挡不住请求重试。</text><text x="50" y="650" class="small">不同参数却复用 R42：应拒绝。</text><path d="M580 143 Q661.5 141.5 743 144 Q756 144 755 156 L754 221 Q755 234 742 233 L580 234 Q567 233 568 221 L569 155 Q568 143 580 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="585" y="174">订单 R43</text><text x="585" y="202">订 6/1—6/3</text><path d="M814 143 Q895.0 141.5 976 144 Q989 144 988 156 L987 221 Q988 234 975 233 L814 234 Q801 233 802 221 L803 155 Q802 143 814 143 Z" fill="#eaf3fb" stroke="#263b48" stroke-width="2.4"/><text x="819" y="174">订单 R44</text><text x="819" y="202">也订这两晚</text><path d="M660,234 L660,258 L780,258 L780,283" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M895,234 L895,258 L803,258" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M590 292 Q781.5 290.5 973 293 Q986 293 985 305 L984 432 Q985 445 972 444 L590 445 Q577 444 578 432 L579 304 Q578 292 590 292 Z" fill="#fff5d7" stroke="#263b48" stroke-width="2.4"/><text x="595" y="324" class="head">库存与订单在同一数据库事务中</text><text x="595" y="356">按 hotel + room_type + date 检查</text><text x="595" y="384">逐晚加锁或条件更新（含版本）</text><text x="595" y="412">每晚都不能超过该晚可售上限</text><path d="M780,445 L780,480" fill="none" stroke="#466e83" stroke-width="3" marker-end="url(#a)"/><path d="M590 490 Q781.5 488.5 973 491 Q986 491 985 503 L984 596 Q985 609 972 608 L590 609 Q577 608 578 596 L579 502 Q578 490 590 490 Z" fill="#eaf5eb" stroke="#263b48" stroke-width="2.4"/><text x="595" y="522" class="head">所有住宿夜晚一起成功或失败</text><text x="595" y="554">全部更新成功 → 提交订单与库存</text><text x="595" y="582">任一晚不足/冲突 → 整个事务回滚</text><text x="566" y="649" class="small">幂等键不同，不会阻止两人争抢最后一间。</text><text x="35" y="720" class="head">记住：幂等保护“重复操作”，事务与并发控制保护“共享库存”。</text></svg>