<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><style>.title{font:700 27px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.node{font:600 19px "PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.label{font:16px "PingFang SC","Microsoft YaHei",sans-serif;fill:#35424a}.note{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#5a625f}</style><title>短网址：创建与跳转分开理解</title><desc>上半部创建：长网址经过唯一ID和Base62编码写映射表；下半部跳转：短码先查缓存，未命中查数据库，找到后返回重定向。</desc><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#dbd8ce"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#35424a" stroke-width="1.7"/></marker></defs><rect width="1100" height="520" fill="#fffdf7"/><rect width="1100" height="520" fill="url(#paper)"/><text class="title" x="35" y="42">短网址：创建与跳转分开理解</text><text class="note" x="35" y="81" text-anchor="start"><tspan x="35" dy="0">① 创建路径：只生成标识并保存映射，不需要下载目标网页</tspan></text><path d="M45,110 Q33,111 35,122 L36,182 Q35,193 47,192 L231,191 Q242,192 240,179 L239,121 Q240,108 228,111 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,114 L225,112 M236,125 L238,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="144" text-anchor="middle"><tspan x="137.5" dy="0">长网址</tspan><tspan x="137.5" dy="23">POST /shorten</tspan></text><path d="M315,110 Q303,111 305,122 L306,182 Q305,193 317,192 L501,191 Q512,192 510,179 L509,121 Q510,108 498,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,114 L495,112 M506,125 L508,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="144" text-anchor="middle"><tspan x="407.5" dy="0">唯一 ID</tspan><tspan x="407.5" dy="23">分布式生成器</tspan></text><path d="M585,110 Q573,111 575,122 L576,182 Q575,193 587,192 L771,191 Q782,192 780,179 L779,121 Q780,108 768,111 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M588,114 L765,112 M776,125 L778,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="144" text-anchor="middle"><tspan x="677.5" dy="0">Base62 编码</tspan><tspan x="677.5" dy="23">例如 zn9edcu</tspan></text><path d="M855,110 Q843,111 845,122 L846,182 Q845,193 857,192 L1041,191 Q1052,192 1050,179 L1049,121 Q1050,108 1038,111 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M858,114 L1035,112 M1046,125 L1048,176" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="144" text-anchor="middle"><tspan x="947.5" dy="0">映射表</tspan><tspan x="947.5" dy="23">短码 → 长网址</tspan></text><path d="M240,151 L305,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,151 L575,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,151 L845,151" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="248" text-anchor="start"><tspan x="35" dy="0">② 跳转路径：读多写少，缓存负责加快查找</tspan></text><path d="M45,280 Q33,281 35,292 L36,352 Q35,363 47,362 L231,361 Q242,362 240,349 L239,291 Q240,278 228,281 Z" fill="#eaf3ff" stroke="#35424a" stroke-width="2.2"/><path d="M48,284 L225,282 M236,295 L238,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="137.5" y="314" text-anchor="middle"><tspan x="137.5" dy="0">短码请求</tspan><tspan x="137.5" dy="23">GET /zn9edcu</tspan></text><path d="M315,280 Q303,281 305,292 L306,352 Q305,363 317,362 L501,361 Q512,362 510,349 L509,291 Q510,278 498,281 Z" fill="#fff3ce" stroke="#35424a" stroke-width="2.2"/><path d="M318,284 L495,282 M506,295 L508,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="407.5" y="314" text-anchor="middle"><tspan x="407.5" dy="0">查缓存</tspan><tspan x="407.5" dy="23">miss 再查数据库</tspan></text><path d="M585,280 Q573,281 575,292 L576,352 Q575,363 587,362 L771,361 Q782,362 780,349 L779,291 Q780,278 768,281 Z" fill="#e8f4e8" stroke="#35424a" stroke-width="2.2"/><path d="M588,284 L765,282 M776,295 L778,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="677.5" y="314" text-anchor="middle"><tspan x="677.5" dy="0">获得长网址</tspan><tspan x="677.5" dy="23">校验可用状态</tspan></text><path d="M855,280 Q843,281 845,292 L846,352 Q845,363 857,362 L1041,361 Q1052,362 1050,349 L1049,291 Q1050,278 1038,281 Z" fill="#ffecee" stroke="#35424a" stroke-width="2.2"/><path d="M858,284 L1035,282 M1046,295 L1048,346" fill="none" stroke="#35424a" stroke-width=".7" opacity=".4"/><text class="node" x="947.5" y="314" text-anchor="middle"><tspan x="947.5" dy="0">301 / 302</tspan><tspan x="947.5" dy="23">Location: 长网址</tspan></text><path d="M240,321 L305,321" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510,321 L575,321" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780,321 L845,321" fill="none" stroke="#35424a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="note" x="35" y="421" text-anchor="start"><tspan x="35" dy="0">记忆：Base62 是进制编码；哈希碰撞需要精确查重；数据库唯一约束处理并发。</tspan></text><text class="note" x="35" y="453" text-anchor="start"><tspan x="35" dy="0">创建接口返回短网址；跳转接口返回重定向，让浏览器访问真正的目标站点。</tspan></text></svg>